/* ---------- overlays ---------- */
function modal(h){closeModal();const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="md pop">${h}</div>`;o.onmousedown=e=>{if(e.target==o)o.remove()};document.body.append(o)}
const closeModal=()=>$('.ov')?.remove(),closeMenu=()=>document.querySelectorAll('.menu').forEach(m=>m.remove());
function menu(e,items){e.preventDefault();closeMenu();const m=document.createElement('div');m.className='menu pop';m.innerHTML=items.map((i,n)=>i==='-'?'<hr>':`<div class="mi ${i.d?'dng':''}" data-n="${n}">${i.l}</div>`).join('');document.body.append(m);const r=m.getBoundingClientRect();m.style.left=Math.min(e.clientX,innerWidth-r.width-8)+'px';m.style.top=Math.min(e.clientY,innerHeight-r.height-8)+'px';m.onclick=ev=>{const n=ev.target.dataset.n;if(n!=null){closeMenu();items[n].f()}}}
document.addEventListener('click',e=>{closeMenu();if(!e.target.closest('.upop,#upb'))$('.upop')?.remove()});
document.addEventListener('contextmenu',e=>{const t=e.target.closest('[data-ctx]');if(!t||!me)return;const[k,id]=t.dataset.ctx.split(':');ctx[k](e,id)});
const img=(f,max,anim)=>new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{if(f.type=='image/gif'&&anim){f.size<1.5e6?ok(r.result):no();return}const i=new Image();i.onerror=no;i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.85))};i.src=r.result};r.readAsDataURL(f)});

/* ---------- auth ---------- */
function authView(mode='login'){const L=mode=='login';
$('#root').innerHTML=`<div class="auth"><div class="card pop"><h1>${L?'Welcome back!':'Create an account'}</h1><p class="mu" style="margin:6px 0 20px">${L?'We are so excited to see you again!':'Pick a username and password.'}</p><label>USERNAME</label><input id="au" autocomplete="username"><label>PASSWORD</label><input id="ap" type="password"><button id="ab">${L?'Log In':'Continue'}</button><p class="mu">${L?'Need an account? <a onclick="authView(\'reg\')">Register</a>':'<a onclick="authView()">Already have an account?</a>'}</p></div></div>`;
$('#ap').onkeydown=$('#au').onkeydown=e=>{if(e.key=='Enter')$('#ab').click()};$('#au').focus();
$('#ab').onclick=async()=>{try{const u=$('#au').value.trim(),p=$('#ap').value;
if(!/^[\w.-]{3,32}$/.test(u)||/^(__proto__|constructor|prototype)$/.test(u))return toast('Username: 3-32 letters, numbers, _ . -');
const hs=await sha(p),h=hs[0];
if(L){if(!db.users[u]||!hs.includes(db.users[u].pass))return toast('Wrong username or password')}
else{if(p.length<6)return toast('Password needs at least 6 characters');if(db.users[u])return toast('That username is taken');db.users[u]={pass:h,display:u,friends:[],blocked:[],status:'online'};save()}
me=u;ss.set('me',u);ss.del('sid');go({t:'friends',tab:'online'})}catch(e){toast('Error: '+e.message)}}}

/* ---------- profile ---------- */
function pop(){if($('.upop'))return $('.upop').remove();const d=document.createElement('div');d.className='upop pop';const st=U(me).status||'online';
d.innerHTML=card(me,1)+(hasMemo(me)?'':`<div class="promo"><b>Amp up your profile</b><button class="x" onclick="this.parentNode.remove()">${I('x',16)}</button><div class="row"><button class="g" onclick="memoModal()">${I('memo',16)}&nbsp;Get Memo</button><button class="g" onclick="editProfile()">Customize</button></div></div>`)+
`<div class="pcard"><div class="pr" onclick="editProfile()">${I('pen',20)}<span>Edit Profile</span></div><hr><div class="pr" onclick="$('#stl').classList.toggle('open')"><i class="sd" style="background:${ST[st][1]}"></i><span>${ST[st][0]}</span>${I('chev',18)}</div><div class="sl" id="stl">${Object.entries(ST).map(([k,v])=>`<div onclick="setStatus('${k}')"><i class="sd" style="background:${v[1]}"></i>${v[0]}</div>`).join('')}</div><hr><div class="pr" onclick="showBadges()">${I('medal',20)}<span>Badges</span></div></div><div class="pcard"><div class="pr dng" onclick="logout()">${I('out',20)}<span>Log out</span></div></div>`;document.body.append(d)}
const setStatus=v=>{U(me).status=v;save();$('.upop')?.remove();render()};
function setNote(){const n=prompt('Set a note',U(me).note||'');if(n!=null){U(me).note=n.slice(0,60);save();$('.upop')?.remove();render()}}
function showBadges(){$('.upop')?.remove();modal('<h2>Badges</h2>'+(bk(me).map(k=>`<div class="row"><span class="bd" style="background:${B[k][1]}">${B[k][0]}</span>${B[k][2]}</div>`).join('')||'<p class="mu">No badges yet.</p>'))}
function logout(){try{const x=U(me);x.sess=(x.sess||[]).filter(s=>s.id!=ss.get('sid'));save()}catch{}ss.del('me');ss.del('sid');me=null;$('.upop')?.remove();$('.stg')?.remove();authView()}
function quick(){modal(`<h2>Where would you like to go?</h2><input id="qs" placeholder="Search friends"><div id="ql"></div>`);const f=()=>{const q=$('#qs').value.toLowerCase();$('#ql').innerHTML=U(me).friends.filter(u=>(u+(U(u).display||'')).toLowerCase().includes(q)).map(u=>`<div class="mi" onclick="closeModal();dm('${u}')">${av(u,28)}${dn(u)}</div>`).join('')||'<p class="mu">No matches</p>'};$('#qs').oninput=f;f();$('#qs').focus()}

/* ---------- friends ---------- */
const dm=u=>go({t:'dm',id:u});
function blk(u,on){const x=U(me);if(on){x.blocked.includes(u)||x.blocked.push(u);x.friends=x.friends.filter(f=>f!=u);U(u).friends=U(u).friends.filter(f=>f!=me)}else x.blocked=x.blocked.filter(f=>f!=u);save();toast(on?'Blocked '+u:'Unblocked '+u);render()}
function unf(u){U(me).friends=U(me).friends.filter(f=>f!=u);U(u).friends=U(u).friends.filter(f=>f!=me);save();render()}
function addFriend(){const x=U(me),n=$('#af').value.trim(),y=U(n);if(!y||n==me)return toast('No user with that username');if(y.blocked.includes(me)||x.blocked.includes(n))return toast('You cannot add this user');if(y.noFr)return toast('This user is not accepting friend requests');if(!x.friends.includes(n)){x.friends.push(n);y.friends.push(me)}save();toast('Added '+n);render()}
const fsf=v=>document.querySelectorAll('.fr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(v.toLowerCase())?'':'none');
function friendsView(){const x=U(me),t=view.tab;

let b;
if(t=='add')b=`<h2 class="h2">Add Friend</h2><p class="mu" style="margin:4px 0 16px">You can add friends with their username.</p><div class="sb">${I('search',18)}<input id="af" placeholder="Enter a username"><button id="ab2">Add friend</button></div>`;
else{const l=(t=='blocked'?x.blocked:x.friends).filter(u=>U(u)&&(t!='online'||online(u)));
b=`<div class="sb">${I('search',20)}<input id="fs" placeholder="Search" oninput="fsf(this.value)"></div><div class="lh">${t=='online'?'Online':t=='all'?'All friends':'Blocked'} — ${l.length}</div>`+(l.map(u=>`<div class="fr" data-ctx="friend:${u}" ${t=='blocked'?'':`onclick="dm('${u}')"`}><div class="avw">${av(u,40)}<i class="dot ${dot(u)}"></i></div><div><b>${dn(u)}</b> ${badges(u)}<div class="mu">${esc(u)}</div></div><span class="sp"></span>${t=='blocked'?`<button class="g" onclick="blk('${u}',0)">Unblock</button>`:`<button class="cb" title="Message" onclick="event.stopPropagation();dm('${u}')">${I('chat',18)}</button><button class="cb" title="More" onclick="event.stopPropagation();ctx.friend(event,'${u}')">${I('dots',18)}</button>`}</div>`).join('')||`<p class="mu" style="padding-top:20px">${t=='online'?'No friends online right now.':t=='blocked'?'You have not blocked anyone.':'Add a friend to get started.'}</p>`)}
return`<div class="top">${I('friends',22)}<b>Friends</b><i class="sep"></i>${tabs}<span class="tab add ${t=='add'?'on2':''}" onclick="view.tab='add';render()">Add Friend</span><span class="sp"></span><span class="tab" title="New message" onclick="quick()">${I('chat',20)}</span></div><div class="fb"><div class="fl">${b}</div><aside class="an"><h2>Active Now</h2><div class="ac"><b>It’s quiet for now…</b><span class="mu">When a friend starts an activity, like playing a game or hanging out on voice, we’ll show it here!</span></div></aside></div>`}

/* ---------- servers ---------- */
function addServer(){modal(`<h2>Create a server</h2><label>SERVER NAME</label><input id="sn" maxlength="32"><label>SERVER ICON</label><input id="si" type="file" accept="image/*"><button id="sc" style="width:100%">Create server</button><hr><h2>Join a server</h2><label>INVITE CODE</label><input id="sj"><button class="g" id="sjb" style="width:100%">Join server</button>`);
$('#sc').onclick=async()=>{const n=$('#sn').value.trim();if(!n)return toast('Give your server a name');let ic='';const f=$('#si').files[0];if(f)try{ic=await img(f,128,0)}catch{}const id=rid(),c=rid().toUpperCase();db.servers[id]={name:n,icon:ic,owner:me,members:[me],bans:[],timeouts:{},roles:[],mr:{},msgs:[],code:c};db.inv[c]=id;save();closeModal();go({t:'srv',id})};
$('#sjb').onclick=()=>{const id=db.inv[$('#sj').value.trim().toUpperCase()],s=db.servers[id];if(!s)return toast('Invalid invite code');if(s.bans.includes(me))return toast('You are banned from this server');if(!s.members.includes(me))s.members.push(me);save();closeModal();go({t:'srv',id})}}
function invite(id){const c=db.servers[id].code;navigator.clipboard?.writeText(c);modal(`<h2>Invite friends</h2><p class="mu" style="margin-bottom:10px">Send this code. They click + then Join a server. It is copied to your clipboard.</p><input readonly value="${c}" onclick="this.select()" style="font-size:20px;text-align:center;letter-spacing:3px"><button style="width:100%" onclick="closeModal()">Done</button>`)}
function roles(id){const s=db.servers[id];modal(`<h2>Roles</h2>${s.roles.map(r=>`<div class="row"><i class="sw" style="background:${r.color}"></i><span style="color:${r.color}">${esc(r.name)}</span><span class="sp"></span><button class="r" onclick="delRole('${id}','${r.id}')">Delete</button></div>`).join('')||'<p class="mu">No roles yet. Create one below, then right-click a member to assign it.</p>'}<hr><label>NEW ROLE</label><input id="rn" maxlength="24" placeholder="Role name"><div class="row"><input id="rc" type="color" value="#5865f2" style="height:42px;margin:0"><button id="ra">Add role</button></div>${s.bans.length?`<hr><label>BANNED</label>${s.bans.map(b=>`<div class="row"><span>${esc(b)}</span><span class="sp"></span><button class="g" onclick="unban('${id}','${b}')">Unban</button></div>`).join('')}`:''}`);
$('#ra').onclick=()=>{const n=$('#rn').value.trim();if(!n)return toast('Name the role');s.roles.push({id:rid(),name:n,color:$('#rc').value});save();roles(id);render()}}
const delRole=(id,r)=>{const s=db.servers[id];s.roles=s.roles.filter(x=>x.id!=r);for(const u in s.mr)s.mr[u]=s.mr[u].filter(x=>x!=r);save();roles(id);render()};
const unban=(id,u)=>{const s=db.servers[id];s.bans=s.bans.filter(x=>x!=u);save();roles(id)};
function kick(s,u,ban){s.members=s.members.filter(m=>m!=u);delete s.mr[u];if(ban)s.bans.push(u);save();toast((ban?'Banned ':'Kicked ')+u);render()}
const tmo=(s,u,min)=>{min?s.timeouts[u]=Date.now()+min*6e4:delete s.timeouts[u];save();toast(min?`Timed out ${u}`:'Timeout removed');render()};
function togRole(s,u,r){const a=s.mr[u]=s.mr[u]||[];a.includes(r)?a.splice(a.indexOf(r),1):a.push(r);save();render()}
const ctx={
friend:(e,u)=>{const b=U(me).blocked.includes(u);menu(e,[{l:'Message',f:()=>dm(u)},{l:'Profile',f:()=>showProfile(u)},'-',b?{l:'Unblock',f:()=>blk(u,0)}:{l:'Block',d:1,f:()=>blk(u,1)},...(!b&&U(me).friends.includes(u)?[{l:'Remove friend',d:1,f:()=>unf(u)}]:[])])},
srv:(e,id)=>{const s=db.servers[id],o=s.owner==me;menu(e,[{l:'Invite',f:()=>invite(id)},...(o?[{l:'Manage roles',f:()=>roles(id)},'-',{l:'Delete server',d:1,f:()=>{if(confirm('Delete this server for everyone?')){delete db.inv[s.code];delete db.servers[id];save();go({t:'friends',tab:'online'})}}}]:['-',{l:'Leave server',d:1,f:()=>{s.members=s.members.filter(m=>m!=me);save();render()}}])])},
mem:(e,u)=>{const s=db.servers[view.id];if(!s)return;const it=[{l:'Profile',f:()=>showProfile(u)}];
if(s.owner==me&&u!=me)it.push('-',...s.roles.map(r=>({l:`${(s.mr[u]||[]).includes(r.id)?'✓ ':''}Role: ${esc(r.name)}`,f:()=>togRole(s,u,r.id)})),'-',{l:'Timeout 5 minutes',f:()=>tmo(s,u,5)},{l:'Timeout 1 hour',f:()=>tmo(s,u,60)},{l:'Timeout 1 day',f:()=>tmo(s,u,1440)},{l:'Remove timeout',f:()=>tmo(s,u,0)},'-',{l:'Kick',d:1,f:()=>kick(s,u,0)},{l:'Ban',d:1,f:()=>kick(s,u,1)});
menu(e,it)}};

/* ---------- chat ---------- */
function chat(title,msgs,s,lock){const x=U(me),l=msgs.filter(m=>!x.blocked.includes(m.u));
return`<div class="top">${title}</div><div id="msgs" class="msgs">${l.map((m,i)=>`<div class="msg ${i==l.length-1?'slide':''}"><span onclick="showProfile('${m.u}')">${av(m.u,40)}</span><div><b style="color:${rc(s,m.u)}">${dn(m.u)}</b> ${badges(m.u)}<span class="mu"> ${new Date(m.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span><div>${esc(m.x)}</div></div></div>`).join('')||'<p class="mu" style="padding:8px 16px">This is the start of the conversation.</p>'}</div><div class="inw"><input id="inp" autocomplete="off" ${lock?'disabled':''} placeholder="${lock||'Message'}"></div>`}
function send(t){const m={u:me,x:t.slice(0,2000),ts:Date.now()};
if(view.t=='srv'){const s=db.servers[view.id];if(s.timeouts[me]>Date.now()||!s.members.includes(me))return;s.msgs.push(m);s.msgs=s.msgs.slice(-300)}
else{const o=view.id;if(U(me).blocked.includes(o)||U(o).blocked.includes(me))return;const k=[me,o].sort().join('|');(db.dms[k]=db.dms[k]||[]).push(m);db.dms[k]=db.dms[k].slice(-300)}
save();render();$('#inp')?.focus()}

/* ---------- main render ---------- */

if(view.t=='srv'){title='# '+esc(s.name);m=chat('<span class="mu" style="font-size:22px">#</span> general',s.msgs,s,s.timeouts[me]>Date.now()?'You are timed out':'');
side=`<div class="sh">${esc(s.name)}${I('down',18)}</div><div class="ch on"><span style="font-size:20px">#</span>general</div>${s.owner==me?`<div class="ch" onclick="roles('${view.id}')">${I('gear',20)}Manage roles</div>`:''}`}
else{if(view.t=='dm'){const o=view.id,k=[me,o].sort().join('|');title='@ '+dn(o);m=chat(`${av(o,26)}<b>${dn(o)}</b>${badges(o)}`,db.dms[k]||[],null,x.blocked.includes(o)?'You blocked this user':U(o).blocked.includes(me)?'You cannot message this user':'')}else{title=I('friends',20)+' Friends';m=friendsView()}
side=`<div class="fh"><div class="find" onclick="quick()">Find or start a conversation</div></div><div class="sc"><div class="nav ${view.t=='friends'?'on':''}" onclick="go({t:'friends',tab:'online'})">${I('friends',24)}Friends</div><div class="nav" onclick="memoModal()">${I('memo',24)}Memo</div><div class="dmh">Direct Messages<span onclick="go({t:'friends',tab:'add'})" title="Add a friend">${I('plus',18)}</span></div>${x.friends.map(u=>`<div class="nav dm ${view.t=='dm'&&view.id==u?'on':''}" data-ctx="friend:${u}" onclick="dm('${u}')"><div class="avw">${av(u,34)}<i class="dot ${dot(u)}"></i></div>${dn(u)}</div>`).join('')}</div>`}
if(view.t=='srv')side=`<div class="sc">${side}</div>`;

const members=view.t=='srv'?`<aside class="mem"><div class="mu" style="padding:0 8px 8px">Members — ${s.members.length}</div>${s.members.map(u=>`<div class="mrow ${online(u)?'':'offl'}" data-ctx="mem:${u}" onclick="showProfile('${u}')"><div class="avw">${av(u,34)}<i class="dot ${dot(u)}"></i></div><span style="color:${rc(s,u)}">${dn(u)}${u==s.owner?' 👑':''}</span></div>`).join('')}</aside>`:'';
$('#root').innerHTML=`<div id="app"><div class="tb">${title}<div class="tbr">${I('inbox',20)}${I('help',20)}</div></div><div class="wrap"><nav class="rail">${rail}</nav><aside class="side">${side}</aside><main class="${nav?'fade':''}">${m}</main>${members}</div><div class="up"><div id="upb" onclick="pop()" title="Your profile"><div class="avw">${av(me,36)}<i class="dot ${dot(me)}"></i></div><div style="min-width:0"><b>${dn(me)}</b><span class="mu">${ST[x.status||'online'][0]}</span></div></div><button class="ib ${muted?'mute':''}" title="Mute" onclick="muted=!muted;render()">${I('mic',20)}</button><button class="ib ${deaf?'mute':''}" title="Deafen" onclick="deaf=!deaf;render()">${I('head',20)}</button><button class="ib" title="User settings" onclick="settings('account')">${I('gear',20)}</button></div></div>`;
nav=0;
const i=$('#inp');if(i){if(iv)i.value=iv;if(f)i.focus();i.onkeydown=e=>{const t=i.value.trim();if(e.key=='Enter'&&t){i.value='';send(t)}};const g=$('#msgs');g.scrollTop=g.scrollHeight}
if($('#ab2')){$('#ab2').onclick=addFriend;$('#af').onkeydown=e=>{if(e.key=='Enter')addFriend()}}}

/* ---------- settings ---------- */
const cnt=()=>Object.values(db.dms).reduce((a,l)=>a+l.length,0)+Object.values(db.servers).reduce((a,v)=>a+v.msgs.length,0);
function beep(){try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.08,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.25);o.start();o.stop(c.currentTime+.25)}catch{}}
const applyLook=()=>{document.documentElement.style.setProperty('--br',U(me).accent||'#5865f2');document.documentElement.classList.toggle('rm',!!U(me).rm)};

function ensureSess(){const x=U(me);x.sess=x.sess||[];let id=ss.get('sid');if(!id){id=rid();ss.set('sid',id);x.sess.push({id,ua:ua(),t:Date.now()});save();return 1}return x.sess.some(s=>s.id==id)}
const editProfile=()=>settings('profile'),memoModal=()=>settings('memo');
let sp='account',sub='info',shown={};
const T={account:'Account',profile:'My Profile',privacy:'Data & Privacy',msg:'Messaging Permissions',notif:'Notifications',memo:'Memo',voice:'Voice & Video',look:'Appearance'};
const NAV=[['account','Account','user'],['privacy','Data & Privacy','shield'],['msg','Messaging Permissions','chat'],['notif','Notifications','bell'],'Billing',['memo','Memo','memo'],'Experience',['voice','Voice & Video','mic'],['look','Appearance','palette',1]];
const mk=(s,k)=>k=='email'?'*'.repeat(Math.max(3,s.split('@')[0].length))+'@'+s.split('@')[1]:'*'.repeat(Math.max(0,s.length-4))+s.slice(-4);
const tgRow=(l,d,k,inv)=>{const on=inv?!U(me)[k]:!!U(me)[k];return`<div class="srow"><div style="flex:1"><b>${l}</b><div class="mu">${d}</div></div><div class="tg ${on?'on':''}" onclick="tgl('${k}')"></div></div>`};
const tgl=k=>{U(me)[k]=!U(me)[k];save();render();settings()};
const row=(l,v,b)=>`<div class="srow"><b>${l}</b><span class="sv">${v}</span>${b||''}</div>`;
const lrow=(l,v,f,dis)=>`<div class="srow lr ${dis?'dis':''}" ${dis?'':`onclick="${f}"`}><b>${l}</b><span class="sv">${v}</span>${I('chev',22)}</div>`;
const contact=(l,k)=>{const v=U(me)[k];return row(l,v?`${shown[k]?esc(v):esc(mk(v,k))} <a onclick="shown.${k}=!shown.${k};settings()">${shown[k]?'Hide':'Reveal'}</a>`:'Not set',`<button class="g" onclick="editField('${k}')">${v?'Edit':'Add'}</button>`)};
const PG={
account:()=>{const n=(U(me).sess||[]).length;return`<h2 id="a-info">Account Info</h2>${row('Display Name',dn(me),`<button class="g" onclick="editField('dn')">Edit</button>`)}${row('Username',esc(me),'<button class="g" disabled title="Usernames are permanent" style="opacity:.45;cursor:not-allowed">Edit</button>')}${contact('Email','email')}${contact('Phone Number','phone')}<hr style="margin:32px 0"><h2 id="a-sec">Password &amp; Security</h2>${row('Password','',`<button class="g" onclick="pwModal()">Edit</button>`)}${lrow('Multi-Factor Authentication','Needs a server','',1)}${lrow('Logged-in Devices',n+' device'+(n==1?'':'s'),'devices()')}<hr style="margin:32px 0"><h2 id="a-status">Account Status</h2>${row('Delete Account','',`<button class="r" onclick="delAcct()">Delete</button>`)}<p class="mu">Deleting removes your account and any servers you own.</p>`},
profile:()=>{const x=U(me),m=hasMemo(me);return`<h2>My Profile</h2><div class="prof"><div class="pf"><label>DISPLAY NAME</label><input id="ed" maxlength="32" value="${esc(x.display)}"><label>PROFILE PICTURE ${m?'(GIFs animate)':'(static image)'}</label><input id="ea" type="file" accept="image/*"><label>BANNER ${m?'':'(needs Memo)'}</label><input id="eb" type="file" accept="image/*" ${m?'':'disabled'}>${m?'':'<p class="mu" style="margin:-4px 0 12px">Custom banners and animated avatars need Memo. <a onclick="settings(\'memo\')">Get Memo</a></p>'}<label>NOTE</label><input id="en" maxlength="60" value="${esc(x.note||'')}" placeholder="What have you been reading?"><button onclick="saveProfile()">Save changes</button></div><div class="pv">${card(me)}</div></div>`},
privacy:()=>`<h2>Data &amp; Privacy</h2>${tgRow('Show badges on my profile','Turn off to hide your badges from other people.','noBd',1)}${row('Blocked users',(U(me).blocked||[]).length+' blocked',`<button class="g" onclick="$('.stg').remove();go({t:'friends',tab:'blocked'})">Manage</button>`)}${row('Download my data','',`<button class="g" onclick="exportData()">Download</button>`)}`,
msg:()=>`<h2>Messaging Permissions</h2>${tgRow('Allow friend requests','When off, nobody can add you as a friend.','noFr',1)}<p class="mu">You can only message people you have added as friends.</p>`,
notif:()=>`<h2>Notifications</h2>${tgRow('Message sounds','Play a sound when a new message arrives from another tab.','noSnd',1)}`,
memo:()=>hasMemo(me)?`<h2>Memo</h2><div class="ac" style="text-align:left"><b>✦ Memo is active</b><span class="mu">Custom banners and animated profile pictures are unlocked. Change them under My Profile.</span></div>`:`<h2>Memo</h2><p class="mu" style="margin-bottom:14px">Unlock custom banners and animated profile pictures. Send BTC to this address, then enter the license key you receive.</p><label>BTC ADDRESS (placeholder)</label><input readonly value="${BTC}" onclick="this.select()"><button class="g" onclick="navigator.clipboard?.writeText('${BTC}');toast('Address copied')">Copy address</button><hr><label>LICENSE KEY</label><input id="mk"><button onclick="actMemo()">Activate</button>`,
voice:()=>`<h2>Voice &amp; Video</h2><div class="srow"><div style="flex:1"><b>Mute</b><div class="mu">Matches the mic button in the bottom-left panel.</div></div><div class="tg ${muted?'on':''}" onclick="muted=!muted;render();settings()"></div></div><div class="srow"><div style="flex:1"><b>Deafen</b><div class="mu">Matches the headphones button.</div></div><div class="tg ${deaf?'on':''}" onclick="deaf=!deaf;render();settings()"></div></div><p class="mu">Voice chat is not built yet, so these only change the status icons.</p>`,
look:()=>{const a=U(me).accent||'#5865f2';return`<h2>Appearance</h2><div class="srow"><div style="flex:1"><b>Accent color</b><div class="mu">Changes buttons, highlights and the home icon.</div></div></div><div class="row" style="gap:10px;margin-bottom:12px">${['#5865f2','#eb459e','#23a55a','#f0b232','#f23f43','#00a8fc','#9b59b6'].map(c=>`<i class="sw" style="background:${c};width:32px;height:32px;cursor:pointer;outline:${a==c?'3px solid #fff':'none'}" onclick="setAccent('${c}')"></i>`).join('')}<input type="color" value="${a}" onchange="setAccent(this.value)" style="width:44px;height:34px;padding:2px;margin:0"></div>${tgRow('Reduce motion','Turns off animations and transitions.','rm',0)}`}};
function settings(p){const old=$('.sbody')?.scrollTop||0,chg=p&&p!=sp;if(p){sp=p;if(chg)sub='info'}let o=$('.stg');if(!o){o=document.createElement('div');o.className='stg pop';document.body.append(o)}$('.upop')?.remove();
o.innerHTML=`<div class="sn"><div class="sprof" onclick="settings('profile')">${av(me,48)}<div><b>${dn(me)}</b><div class="mu">Edit Profiles ${I('pen',12)}</div></div></div><div class="sb ssb">${I('search',18)}<input id="sq" placeholder="Search" oninput="sfilter(this.value)"></div>${NAV.map(n=>typeof n=='string'?`<div class="sg">${n}</div>`:`<div class="si ${sp==n[0]?'on':''}" data-q="${n[1]}" onclick="settings('${n[0]}')">${I(n[2],20)}${n[1]}${n[3]?'<span class="nw">NEW</span>':''}</div>`+(n[0]=='account'&&sp=='account'?[['info','Account Info'],['sec','Password & Security'],['status','Account Status']].map(s=>`<div class="ss ${sub==s[0]?'on':''}" data-q="${s[1]}" onclick="subgo('${s[0]}')">${s[1].replace('&','&amp;')}</div>`).join(''):'')).join('')}<hr><div class="si dngt" onclick="logout()">${I('out',20)}Log out</div></div><div class="sr"><div class="srh"><span>${T[sp]}</span><button class="ib" onclick="$('.stg').remove()" title="Close (Esc)">${I('x',20)}</button></div><div class="sbody"><div class="sin">${PG[sp]()}</div></div></div>`;
const b=$('.sbody');b.style.scrollBehavior='auto';b.scrollTop=chg?0:old;b.style.scrollBehavior=''}
const sfilter=v=>document.querySelectorAll('.si[data-q],.ss').forEach(e=>e.style.display=e.dataset.q.toLowerCase().includes(v.toLowerCase())?'':'none');
const subgo=s=>{sub=s;document.querySelectorAll('.ss').forEach(e=>e.classList.toggle('on',e.getAttribute('onclick').includes("'"+s+"'")));document.getElementById('a-'+s)?.scrollIntoView({behavior:'smooth',block:'start'})};
async function saveProfile(){const x=U(me),m=hasMemo(me),n=$('#ed').value.trim(),a=$('#ea').files[0],b=$('#eb').files[0];try{if(a)x.avatar=await img(a,128,m);if(b&&m)x.banner=await img(b,640,m)}catch{return toast('Image failed. Animated GIFs must be under 1.5 MB.')}if(n)x.display=n;x.note=$('#en').value.trim().slice(0,60);save();render();settings();toast('Profile saved')}
const actMemo=()=>{if($('#mk').value.trim()===MEMO_KEY){U(me).memo=1;save();render();settings();toast('Memo activated')}else toast('Invalid license key')};
const setAccent=c=>{U(me).accent=c;save();applyLook();settings()};
const F={dn:['Display Name','text',32],email:['Email','email',80],phone:['Phone Number','tel',20]};
function editField(k){const x=U(me),f=F[k],cur=k=='dn'?x.display:x[k]||'';modal(`<h2>Edit ${f[0]}</h2><input id="ef" type="${f[1]}" maxlength="${f[2]}" value="${esc(cur)}"><div class="row"><span class="sp"></span><button class="g" onclick="closeModal()">Cancel</button><button id="efs">Save</button></div>`);$('#ef').focus();
const sv=()=>{const v=$('#ef').value.trim();if(k=='email'&&v&&!/^\S+@\S+\.\S+$/.test(v))return toast('Enter a valid email');if(k=='phone'&&v&&!/^\+?[\d\s()-]{6,20}$/.test(v))return toast('Enter a valid phone number');if(k=='dn'){if(!v)return toast('Display name cannot be empty');x.display=v}else x[k]=v;save();closeModal();render();$('.stg')&&settings()};$('#efs').onclick=sv;$('#ef').onkeydown=e=>{if(e.key=='Enter')sv()}}
function pwModal(){modal(`<h2>Change password</h2><label>CURRENT PASSWORD</label><input id="p0" type="password"><label>NEW PASSWORD</label><input id="p1" type="password"><label>CONFIRM NEW PASSWORD</label><input id="p2" type="password"><div class="row"><span class="sp"></span><button class="g" onclick="closeModal()">Cancel</button><button id="pws">Done</button></div>`);
$('#pws').onclick=async()=>{try{const x=U(me);if(!(await sha($('#p0').value)).includes(x.pass))return toast('Current password is wrong');const n=$('#p1').value;if(n.length<6)return toast('New password needs at least 6 characters');if(n!==$('#p2').value)return toast('Passwords do not match');x.pass=(await sha(n))[0];x.sess=x.sess.filter(s=>s.id==ss.get('sid'));save();closeModal();toast('Password changed. Other devices were logged out.');settings()}catch(e){toast('Error: '+e.message)}}}
function devices(){const x=U(me),sid=ss.get('sid');modal(`<h2>Logged-in devices</h2>${x.sess.map(s=>`<div class="row"><div><b>${esc(s.ua)}</b>${s.id==sid?' <span class="mu">(this device)</span>':''}<div class="mu">Signed in ${new Date(s.t).toLocaleString()}</div></div><span class="sp"></span>${s.id==sid?'':`<button class="r" onclick="revoke('${s.id}')">Log out</button>`}</div>`).join('')}`)}
const revoke=id=>{const x=U(me);x.sess=x.sess.filter(s=>s.id!=id);save();devices();settings()};
function exportData(){const x=U(me),d={username:me,...Object.fromEntries(Object.entries(x).filter(([k])=>!['pass','sess'].includes(k))),dms:Object.fromEntries(Object.entries(db.dms).filter(([k])=>k.split('|').includes(me)))};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download='my-chatcord-data.json';a.click()}
function delAcct(){modal(`<h2>Delete account</h2><p class="mu" style="margin-bottom:10px">This permanently deletes your account and any servers you own. Enter your password to confirm.</p><input id="dp" type="password"><div class="row"><span class="sp"></span><button class="g" onclick="closeModal()">Cancel</button><button class="r" id="dpb">Delete account</button></div>`);
$('#dpb').onclick=async()=>{const x=U(me);if(!(await sha($('#dp').value)).includes(x.pass))return toast('Wrong password');const u=me;for(const[id,v]of Object.entries(db.servers)){if(v.owner==u){delete db.inv[v.code];delete db.servers[id]}else{v.members=v.members.filter(m=>m!=u);delete v.mr[u];delete v.timeouts[u]}}for(const o of Object.values(db.users)){o.friends=o.friends.filter(f=>f!=u);o.blocked=o.blocked.filter(f=>f!=u)}delete db.users[u];save();closeModal();$('.stg')?.remove();ss.del('me');ss.del('sid');me=null;authView()}}
addEventListener('storage',e=>{if(e.key==K&&e.newValue){const n=cnt();db=JSON.parse(e.newValue);if(me&&U(me)&&cnt()>n&&!U(me).noSnd)beep();if(me)render()}});
addEventListener('keydown',e=>{if(e.key=='Escape'){if($('.ov'))closeModal();else $('.stg')?.remove()}});
const beat=()=>{try{if(me){const s=seen();s[me]=Date.now();localStorage[SK]=JSON.stringify(s)}}catch{}};beat();setInterval(beat,10000);
setInterval(()=>{if(me&&view.t=='friends'&&view.tab!='add'&&!document.activeElement?.matches('input'))render()},20000);
render();
</script></body></html>
