<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memocord</title>
<style>

body{font:15px/1.4 Inter,system-ui,"Segoe UI",sans-serif;background:var(--rail);color:var(--tx);overflow:hidden}

.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:8px;align-items:center;margin:8px 0}.sp{flex:1}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.side{width:250px;flex:none;background:var(--side);border-top-left-radius:12px;border:1px solid var(--line);border-right:0;overflow-y:auto;padding:0 8px 72px}

.vu{display:flex;gap:8px;align-items:center;padding:3px 10px 3px 34px;font-size:14px;color:var(--mu)}.dmh{padding:14px 10px 6px;font-size:12px;color:var(--mu);font-weight:700}
main{flex:1;display:flex;flex-direction:column;background:var(--main);min-width:0;border-top:1px solid var(--line);border-left:1px solid var(--line)}

.bd{display:inline-block;font-size:10px;font-weight:800;padding:1px 5px;border-radius:4px;margin-left:6px;vertical-align:1px;color:#fff}
.up{position:fixed;left:8px;bottom:8px;width:296px;height:56px;background:#1c1c21;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;padding:0 8px;gap:8px;z-index:20}
.ib{width:34px;height:34px;padding:0;background:none;font-size:18px}.ib:hover{background:#ffffff14}

.pn input{margin:0;background:transparent;border:0;padding:2px 0}.ch{display:inline-block;background:#0000004d;border-radius:6px;padding:3px 9px;margin:2px 4px 2px 0;font-size:13px}

.ac{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px}

.plp{width:85%;height:34px;border-radius:6px;display:flex;align-items:center;padding:0 12px;font-weight:600}
#cp{position:fixed;right:16px;bottom:16px;z-index:60;background:#18181c;border:1px solid var(--line);border-radius:12px;padding:10px;max-width:380px}#cp video{width:100%;border-radius:8px;margin-top:8px;background:#000}#cp audio{display:none}

</style></head><body><div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SB_URL='https://hdcuxxrwalqjlkmrscex.supabase.co',SB_KEY='sb_publishable_QlDQPKJaRBmKghxDx7kJEg_narCjl91',OWNER='9584';
let sb;try{sb=supabase.createClient(SB_URL,SB_KEY)}catch{}
const em=u=>u.toLowerCase()+'@memocord.app',rid=()=>Math.random().toString(36).slice(2,10),mine=new Set(),blank=d=>({users:{},servers:{},dms:{},keys:{},...d});
let db=blank(),me=null,view={t:'friends',tab:'online'},chan,saveT,ready=0,onl={},sp='profile',call={peers:{},vc:null,dm:null,ms:null,scr:null};
const U=u=>db.users[u],isA=u=>u===OWNER,banned=u=>!!U(u)?.banned,dn=u=>banned(u)?'Deleted User':esc(U(u)?.display||u),go=v=>{view=v;render()};
const online=u=>U(u)&&!!onl[u],uid=u=>{let h=5381,g=52711;for(const c of u){h=(h*33^c.codePointAt(0))>>>0;g=(g*31+c.codePointAt(0))>>>0}return String(h).padStart(10,'0')+String(g).padStart(9,'0')};
const findU=a=>Object.keys(db.users).find(u=>uid(u)==a||u.toLowerCase()==String(a).toLowerCase());

/* ===== catalog: badges, rings, nameplates ===== */
const B={own:['👑','#f0b232','Owner'],dev:['DEV','#5865f2','Developer'],og:['OG','#e0a020','OG'],friend:['FRIEND','#2ecc71','Friend'],memo:['MEMO','#eb459e','Memo']};
const GIVE=['dev','og','friend','memo'];
const bk=u=>[...(isA(u)?['own']:[]),...(U(u)?.b||[]),...(U(u)?.memo&&!(U(u).b||[]).includes('memo')?['memo']:[])];
const badges=u=>banned(u)?'':bk(u).map(k=>`<span class="bd" style="background:${B[k][1]}" title="${B[k][2]}">${B[k][0]}</span>`).join('');
const RING={gold:['#f7c948','#b8860b'],neon:['#00f0ff','#a855f7'],ember:['#ffb347','#e0301e'],aurora:['#43e97b','#38f9d7']};
const PLT={moon:'linear-gradient(90deg,#120a22,#4a3492)',sunset:'linear-gradient(90deg,#ff6b45,#a855f7)',ocean:'linear-gradient(90deg,#0f4c75,#00b4d8)'};
const ring=(d,s)=>RING[d]?`<svg class="deco" viewBox="0 0 100 100" style="width:${s*1.3}px;height:${s*1.3}px"><defs><linearGradient id="r${d}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${RING[d][0]}"/><stop offset="1" stop-color="${RING[d][1]}"/></linearGradient></defs><circle cx="50" cy="50" r="42" fill="none" stroke="url(#r${d})" stroke-width="7"/></svg>`:'';
const pl=u=>U(u)?.plate&&PLT[U(u).plate]&&!banned(u)?`background-image:${PLT[U(u).plate]};`:'';
const SHOP={memo:['Memo','Custom banners and animated avatars']};
for(const k in RING)SHOP['ring:'+k]=[k[0].toUpperCase()+k.slice(1)+' Ring','Profile ring'];for(const k in PLT)SHOP['plate:'+k]=[k[0].toUpperCase()+k.slice(1)+' Nameplate','Nameplate in lists'];
const hasMemo=u=>isA(u)||U(u)?.memo,owns=id=>isA(me)||(U(me).owned||[]).includes(id)||(id=='memo'&&U(me).memo);
const av=(u,s=40)=>{const x=U(u),b=x?.banned,h=[...u].reduce((a,c)=>a+c.charCodeAt(0),0)*37%360;return`<span class="aw">${!b&&x?.avatar?`<img class="av" src="${x.avatar}" style="width:${s}px;height:${s}px">`:`<div class="av" style="width:${s}px;height:${s}px;font-size:${s/2}px;background:${b?'#4a4a52':`hsl(${h} 50% 45%)`}">${b?'D':esc((x?.display||u)[0].toUpperCase())}</div>`}${b?'':ring(x?.deco,s)}</span>`};
const rc=u=>isA(u)?'#a855f7':(U(u)?.b||[]).includes('og')?'#f0b232':'#f2f3f5';
const nameH=u=>`<span style="color:${rc(u)};font-weight:600">${dn(u)}</span>${badges(u)}`;
const act=u=>U(u)?.game&&!banned(u)?`Playing <b>${esc(U(u).game.n)}</b>`:'';
const ago=t=>Math.max(1,Math.round((Date.now()-t)/6e4))+'m';
const fmt=t=>esc(t).replace(/@(everyone|[\w.-]{3,32})/g,(a,n)=>n=='everyone'||findU(n)?`<span class="mn">${a}</span>`:a);
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)}
function modal(h,c=''){closeModal();const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="md pop ${c}">${h}</div>`;o.onmousedown=e=>{if(e.target==o)o.remove()};document.body.append(o)}
const closeModal=()=>$('.ov')?.remove();
addEventListener('keydown',e=>{if(e.key=='Escape'){if($('.ov'))closeModal();else $('.stg')?.remove()}});
const img=(f,max,anim)=>new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{if(f.type=='image/gif'&&anim){f.size<1.5e6?ok(r.result):no();return}const i=new Image();i.onerror=no;i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.85))};i.src=r.result};r.readAsDataURL(f)});

/* ===== Supabase sync ===== */
const save=()=>{clearTimeout(saveT);saveT=setTimeout(push,300)};
const pull=async()=>{const{data}=await sb.from('state').select('data').eq('id',1).maybeSingle();db=blank(data?.data)};
const push=async()=>{if(!ready||!me)return;const r=rid();mine.add(r);db.rev=r;const{data:rw,error}=await sb.from('state').update({data:db}).eq('id',1).select('id');if(error)toast('Sync failed: '+error.message);else if(!rw?.length)toast('Sync failed: no permission to save')};
const CH=[['rules',1],['announcements',1],['staff-announcements',1],['faq',1],['general'],['media'],['memes'],['gaming'],['suggestions'],['feedback']];
function ensure(){let s=db.servers.memocord;if(!s)s=db.servers.memocord={name:'Memocord',owner:OWNER,members:[],msgs:{},ch:[...CH.map(([n,l])=>({id:n,n,t:'t',lock:!!l})),{id:'v1',n:'General',t:'v'},{id:'v2',n:'Gaming',t:'v'}]};if(!s.members.includes(me)){s.members.push(me);save()}}
function connect(){chan?.unsubscribe();chan=sb.channel('mc',{config:{presence:{key:me}}});
chan.on('postgres_changes',{event:'UPDATE',schema:'public',table:'state'},p=>{const d=p.new.data;if(!d||mine.has(d.rev))return;db=blank(d);if(banned(me)){toast('Your account was banned');return logout()}render()})
.on('presence',{event:'sync'},()=>{onl=chan.presenceState();render()}).on('broadcast',{event:'sig'},({payload})=>onSig(payload))
.subscribe(st=>{if(st=='SUBSCRIBED')chan.track({at:Date.now(),vc:call.vc})})}
async function boot(){try{const{data}=await sb.auth.getSession(),x=data.session;if(x){await pull();me=x.user.user_metadata.username;if(!U(me)||banned(me)){await sb.auth.signOut();me=null}else{ready=1;ensure();connect();view={t:'srv',c:'general'}}}}catch(e){toast('Offline: '+e.message)}render()}
async function logout(){try{endCall();await push();chan?.unsubscribe();await sb.auth.signOut()}catch{}me=null;ready=0;onl={};$('.stg')?.remove();authView()}

/* ===== auth ===== */
function authView(L=1){$('#root').innerHTML=`<div class="auth"><div class="card pop"><h1>${L?'Welcome back!':'Create an account'}</h1><p class="mu" style="margin:6px 0 20px">${L?'We are so excited to see you again!':'Pick a username and password.'}</p><label>USERNAME</label><input id="au"><label>PASSWORD</label><input id="ap" type="password"><button id="ab">${L?'Log In':'Sign up'}</button><p class="mu">${L?'Need an account? <a onclick="authView(0)">Register</a>':'<a onclick="authView(1)">Already have an account?</a>'}</p></div></div>`;
$('#ap').onkeydown=e=>{if(e.key=='Enter')$('#ab').click()};$('#au').focus();
$('#ab').onclick=async()=>{try{const u=$('#au').value.trim(),p=$('#ap').value;if(!/^[\w.-]{3,32}$/.test(u)||/^(__proto__|constructor|prototype)$/.test(u))return toast('Username: 3-32 letters, numbers, _ . -');if(p.length<6)return toast('Password needs 6+ characters');let key=u,r;
if(L){r=await sb.auth.signInWithPassword({email:em(u),password:p});if(r.error)return toast('Wrong username or password');await pull();key=Object.keys(db.users).find(k=>k.toLowerCase()==u.toLowerCase())||u;if(!U(key))return toast('Account data missing');if(U(key).banned){await sb.auth.signOut();return toast('This account has been banned')}}
else{r=await sb.auth.signUp({email:em(u),password:p,options:{data:{username:u}}});if(r.error)return toast(r.error.message.includes('registered')?'That username is taken':r.error.message);if(!r.data.session)return toast('Turn off Confirm email in Supabase Auth settings');await pull();db.users[u]={display:u,friends:[],b:[],owned:[],links:[],joined:Date.now()}}
me=key;ready=1;ensure();if(!L)save();connect();go({t:'srv',c:'general'})}catch(e){toast('Error: '+e.message)}}}

/* ===== friends, profile ===== */
const dm=u=>go({t:'dm',id:u});
function addF(n){const x=U(me),y=U(n);if(!y||n==me)return toast('No user with that username');if(!x.friends.includes(n)){x.friends.push(n);y.friends.push(me)}save();toast('Added '+n);render()}
function unf(u){U(me).friends=U(me).friends.filter(f=>f!=u);U(u).friends=U(u).friends.filter(f=>f!=me);save();render()}
function prof(u){const x=U(u),own=u==me,g=x.game,fr=U(me).friends.includes(u);
modal(`<div class="bn" style="${x.banner?`background-image:url(${x.banner})`:''}"></div><div class="pb"><div class="row" style="margin-top:-46px;align-items:flex-end"><div class="avw" style="border:5px solid #9b3de0;border-radius:50%;background:#9b3de0">${av(u,84)}<i class="dot ${online(u)?'on':''}" style="border-color:#9b3de0"></i></div><span class="sp"></span>${own?`<button onclick="closeModal();settings('profile')">Edit profile</button>`:`<button onclick="closeModal();dm('${u}')">Message</button>${fr?'':`<button class="g" onclick="addF('${u}');closeModal()">Add</button>`}`}</div>
<div style="font-size:22px;font-weight:800">${dn(u)}${badges(u)}</div><div class="mu" style="color:#fff9">@${esc(u)}</div>
${!own?'<div class="pn">1 mutual server: Memocord</div>':''}
${g?`<div class="pn"><b>PLAYING</b><div style="font-weight:700">${esc(g.n)}</div><div class="mu" style="color:#fff9">for ${ago(g.ts)}</div></div>`:''}
${(x.links||[]).length?`<div class="pn"><b>LINKS</b>${x.links.map(l=>`<a class="ch" style="color:#fff" href="${esc(l.u)}" target="_blank" rel="noopener">🔗 ${esc(l.t)}</a>`).join('')}</div>`:''}
<div class="pn"><b>ROLES IN MEMOCORD</b>${isA(u)?'<span class="ch">🟣 Admin</span>':''}<span class="ch">🟢 Registered</span>${(x.b||[]).includes('og')?'<span class="ch">🟡 OG</span>':''}</div>
<div class="pn"><b>MEMOCORD SINCE</b>${new Date(x.joined||Date.now()).toLocaleDateString()}</div>
${own?'':`<div class="pn"><b>NOTE</b><input placeholder="Click to add a note (only you can see it)" value="${esc((U(me).notes||{})[u]||'')}" onchange="U(me).notes=U(me).notes||{};U(me).notes['${u}']=this.value;save()"></div>`}
<div class="mu" style="text-align:right;margin-top:6px;color:#fff9">ID ${uid(u).slice(0,8)}</div></div>`,'pf')}
function friendsView(){const x=U(me),t=view.tab;
const tabs=['online','all'].map(k=>`<span class="tab ${t==k?'on':''}" onclick="view.tab='${k}';render()">${k[0].toUpperCase()+k.slice(1)}</span>`).join('');let b;
if(t=='add')b=`<h2>Add Friend</h2><div class="row"><input id="af" placeholder="Enter a username" style="margin:0"><button onclick="addF($('#af').value.trim())">Add friend</button></div>`;
else{const l=x.friends.filter(u=>U(u)&&(t!='online'||online(u)));b=`<div class="mu" style="font-weight:700;padding-bottom:10px">${t.toUpperCase()} — ${l.length}</div>`+(l.map(u=>`<div class="fr" onclick="prof('${u}')"><div class="avw">${av(u,40)}<i class="dot ${online(u)?'on':''}"></i></div><div>${nameH(u)}<div class="mu">${act(u)||esc(u)}</div></div><span class="sp"></span><button class="g" onclick="event.stopPropagation();dm('${u}')">Message</button><button class="g" onclick="event.stopPropagation();dcall('${u}')">📞</button><button class="r" onclick="event.stopPropagation();unf('${u}')">✕</button></div>`).join('')||'<p class="mu">Nobody here yet.</p>')}
return`<div class="top"><b>Friends</b>${tabs}<span class="tab add" onclick="view.tab='add';render()">Add Friend</span></div><div class="fl">${b}</div>`}

/* ===== chat & commands ===== */
const ch=()=>{const s=db.servers.memocord;return s.ch.find(c=>c.id==view.c&&c.t=='t')||s.ch.find(c=>c.id=='general')};
function chat(head,msgs,lock,ph){return`<div class="top">${head}</div><div id="msgs" class="msgs">${msgs.filter(m=>U(m.u)).map(m=>`<div class="msg ${m.u!=me&&(m.x.includes('@everyone')||m.x.toLowerCase().includes('@'+me.toLowerCase()))?'ping':''}"><span onclick="prof('${m.u}')">${av(m.u,40)}</span><div>${nameH(m.u)} <span class="mu">${new Date(m.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span><div>${fmt(m.x)}</div></div></div>`).join('')||'<p class="mu" style="padding:8px 16px">This is the start of the conversation.</p>'}</div><div class="inw"><input id="inp" autocomplete="off" ${lock?'disabled':''} placeholder="${lock?'Only 9584 can post here. You can still read.':ph}"></div>`}
function cmd(t){const[c,a]=t.trim().split(/\s+/);if(c!='!ban'&&c!='!unban')return toast('Unknown command');if(!isA(me))return toast('You do not have permission');const tg=findU(a);if(!tg)return toast('No user with that ID');if(tg==OWNER)return toast('You cannot do that to this user');U(tg).banned=c=='!ban'?1:0;save();toast((c=='!ban'?'Banned ':'Unbanned ')+tg);render()}
function send(t){if(t[0]=='!')return cmd(t);const m={u:me,x:t.slice(0,2000),ts:Date.now()};
if(view.t=='srv'){const c=ch(),s=db.servers.memocord;if(c.lock&&!isA(me))return toast('Only 9584 can post in #'+c.n);if(t.includes('@everyone')&&!(isA(me)||s.owner==me))return toast('Only admins can use @everyone');(s.msgs[c.id]=s.msgs[c.id]||[]).push(m);s.msgs[c.id]=s.msgs[c.id].slice(-300)}
else{const k=[me,view.id].sort().join('|');(db.dms[k]=db.dms[k]||[]).push(m);db.dms[k]=db.dms[k].slice(-300)}save();render()}

/* ===== voice / calls / screen share (WebRTC, signalled over Supabase realtime) ===== */
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'}]},sig=(to,d)=>chan.send({type:'broadcast',event:'sig',payload:{to,from:me,...d}});
const vcUsers=id=>Object.keys(onl).filter(u=>onl[u]?.[0]?.vc==id);
const mic=async()=>{if(!call.ms)call.ms=await navigator.mediaDevices.getUserMedia({audio:true});return call.ms};
const addT=p=>{const h=p.getSenders().map(s=>s.track);[call.ms,call.scr].forEach(s=>s&&s.getTracks().forEach(t=>h.includes(t)||p.addTrack(t,s)))};
function peer(u){if(call.peers[u])return call.peers[u];const p=new RTCPeerConnection(ICE);call.peers[u]=p;
p.onicecandidate=e=>e.candidate&&sig(u,{k:'ice',c:e.candidate});
p.onnegotiationneeded=async()=>{await p.setLocalDescription(await p.createOffer());sig(u,{k:'offer',d:p.localDescription,vc:call.vc})};
p.ontrack=e=>{const st=e.streams[0];if(!st||document.getElementById('rv'+st.id))return;const el=document.createElement(e.track.kind=='video'?'video':'audio');el.id='rv'+st.id;el.dataset.u=u;el.autoplay=true;el.playsInline=true;el.srcObject=st;$('#cp').append(el)};return p}
const rd=async(p,d)=>{await p.setRemoteDescription(d);(p.q||[]).forEach(c=>p.addIceCandidate(c).catch(()=>{}));p.q=[]};
const allowed=m=>(m.vc&&m.vc==call.vc)||call.dm==m.from;
async function onSig(m){if(m.to!=me)return;const u=m.from;
if(m.k=='ring'){if(call.ms)return;const n=document.createElement('div');n.className='toast';n.style.bottom='auto';n.style.top='16px';n.innerHTML=`📞 ${dn(u)} is calling <button onclick="acc('${u}');this.parentNode.remove()">Accept</button> <button class="g" onclick="this.parentNode.remove()">Decline</button>`;document.body.append(n);setTimeout(()=>n.remove(),30000);return}
if(m.k=='acc'){const p=peer(u);addT(p);return}
if(m.k=='bye'){call.peers[u]?.close();delete call.peers[u];document.querySelectorAll(`#cp [data-u="${u}"]`).forEach(e=>e.remove());return}
if(!call.ms||!allowed(m))return;const p=peer(u);
if(m.k=='offer'){await rd(p,m.d);addT(p);await p.setLocalDescription(await p.createAnswer());sig(u,{k:'ans',d:p.localDescription})}
else if(m.k=='ans')await rd(p,m.d);
else if(m.k=='ice'){p.remoteDescription?p.addIceCandidate(m.c).catch(()=>{}):(p.q=p.q||[]).push(m.c)}}
function panel(){if($('#cp'))return;const d=document.createElement('div');d.id='cp';d.innerHTML=`<div class="row" style="margin:0"><b class="sp">${call.vc?'🔊 Voice connected':'📞 In call'}</b><button class="g" id="mt" onclick="const t=call.ms.getAudioTracks()[0];t.enabled=!t.enabled;this.textContent=t.enabled?'🎤':'🔇'">🎤</button><button class="g" id="sh" onclick="shareScr()">🖥 Share</button><button class="r" onclick="endCall()">Leave</button></div>`;document.body.append(d)}
async function dcall(u){if(!online(u))return toast(dn(u)+' is offline');try{await mic();call.dm=u;panel();sig(u,{k:'ring'});toast('Calling '+u+'…')}catch{toast('Microphone permission needed')}}
async function acc(u){try{await mic();call.dm=u;panel();sig(u,{k:'acc'})}catch{toast('Microphone permission needed')}}
async function joinVC(id){if(call.vc==id)return endCall();endCall();try{await mic()}catch{return toast('Microphone permission needed')}call.vc=id;chan.track({at:Date.now(),vc:id});panel();vcUsers(id).filter(u=>u!=me).forEach(u=>addT(peer(u)))}
async function shareScr(){if(call.scr)return stopShare();try{call.scr=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});call.scr.getVideoTracks()[0].onended=stopShare;Object.values(call.peers).forEach(addT);$('#sh').textContent='⏹ Stop';const v=document.createElement('video');v.id='lv';v.muted=true;v.autoplay=true;v.srcObject=call.scr;$('#cp').append(v)}catch{toast('Screen share cancelled')}}
function stopShare(){if(!call.scr)return;Object.values(call.peers).forEach(p=>p.getSenders().forEach(s=>s.track&&call.scr.getTracks().includes(s.track)&&p.removeTrack(s)));call.scr.getTracks().forEach(t=>t.stop());call.scr=null;$('#lv')?.remove();if($('#sh'))$('#sh').textContent='🖥 Share'}
function endCall(){Object.keys(call.peers).forEach(u=>{try{sig(u,{k:'bye'})}catch{}call.peers[u].close()});if(call.dm)try{sig(call.dm,{k:'bye'})}catch{}stopShare();call.ms?.getTracks().forEach(t=>t.stop());call={peers:{},vc:null,dm:null,ms:null,scr:null};$('#cp')?.remove();try{chan?.track({at:Date.now(),vc:null})}catch{}}

/* ===== render ===== */
let rq=0;function render(){if(rq)return;rq=1;requestAnimationFrame(()=>{rq=0;draw()})}
function draw(){if(!me||!U(me))return authView();document.documentElement.style.setProperty('--br',U(me).accent||'#ff6b45');
const iv=$('#inp')?.value,f=document.activeElement?.id=='inp',x=U(me),s=db.servers.memocord;let m,side,mem='';
if(view.t=='dm'&&!U(view.id))view={t:'friends',tab:'online'};
if(view.t=='srv'){const c=ch();m=chat(`<b>${c.lock?'📢':'#'} ${c.n}</b>`,s.msgs[c.id]||[],c.lock&&!isA(me),'Message #'+c.n);
side=`<div class="sh">${esc(s.name)}</div>`+s.ch.map(c=>c.t=='t'?`<div class="nav ${c.id==ch().id?'on':''}" onclick="go({t:'srv',c:'${c.id}'})">${c.lock?'📢':'#'} ${c.n}</div>`:`<div class="nav" onclick="joinVC('${c.id}')">🔊 ${c.n}${call.vc==c.id?' ●':''}</div>`+vcUsers(c.id).map(u=>`<div class="vu">${av(u,22)}${dn(u)}</div>`).join('')).join('');
const mm=s.members.filter(u=>U(u)&&!banned(u)),og=u=>(U(u).b||[]).includes('og'),row=u=>`<div class="mrow ${online(u)?'':'offl'}" style="${pl(u)}" onclick="prof('${u}')"><div class="avw">${av(u,34)}<i class="dot ${online(u)?'on':''}"></i></div><div style="min-width:0"><div class="ell">${nameH(u)}${isA(u)?' <span style="color:#f0b232">♛</span>':''}</div>${act(u)?`<div class="mu ell">${act(u)}</div>`:''}</div></div>`;
mem='<aside class="mem">'+[['ADMIN',u=>isA(u)],['OG',u=>!isA(u)&&og(u)],['MEMBERS',u=>!isA(u)&&!og(u)]].map(([n,fn])=>{const l=mm.filter(fn).sort((a,b)=>online(b)-online(a));return l.length?`<div class="mg">${n} — ${l.length}</div>`+l.map(row).join(''):''}).join('')+'</aside>'}
else{if(view.t=='dm'){const o=view.id;m=chat(`${av(o,26)}<b>${dn(o)}</b>${badges(o)}<span class="sp"></span><button class="g" onclick="dcall('${o}')">📞 Call</button>`,db.dms[[me,o].sort().join('|')]||[],0,'Message @'+esc(o))}else m=friendsView();
side=`<div class="sh">Direct messages</div><div class="nav ${view.t=='friends'?'on':''}" onclick="go({t:'friends',tab:'online'})">👥 Friends</div><div class="nav" onclick="settings('shop')">✦ Shop</div><div class="dmh">DIRECT MESSAGES</div>`+x.friends.map(u=>`<div class="nav ${view.t=='dm'&&view.id==u?'on':''}" style="${pl(u)}background-size:cover" onclick="dm('${u}')"><div class="avw">${av(u,30)}<i class="dot ${online(u)?'on':''}"></i></div>${dn(u)}</div>`).join('')}
$('#root').innerHTML=`<div id="app"><nav class="rail"><div class="ri ${view.t!='srv'?'on':''}" onclick="go({t:'friends',tab:'online'})">🐾</div><div class="rs"></div><div class="ri ${view.t=='srv'?'on':''}" onclick="go({t:'srv',c:'general'})" title="Memocord">M</div></nav><aside class="side">${side}</aside><main>${m}</main>${mem}<div class="up"><div class="avw" style="cursor:pointer" onclick="prof('${me}')">${av(me,36)}<i class="dot on"></i></div><div style="min-width:0;flex:1"><b class="ell" style="display:block">${dn(me)}</b><span class="mu ell" style="display:block">${act(me)||'Online'}</span></div><button class="ib" onclick="settings('profile')" title="Settings">⚙</button><button class="ib" onclick="logout()" title="Log out">⏻</button></div></div>`;
const i=$('#inp');if(i){if(iv)i.value=iv;if(f)i.focus();i.onkeydown=e=>{const t=i.value.trim();if(e.key=='Enter'&&t){i.value='';send(t)}};const g=$('#msgs');g.scrollTop=g.scrollHeight}}

/* ===== settings ===== */
const T={profile:'My Profile',shop:'Shop & Decorations',activity:'Activity (RPC)'};
const prev=k=>{const[t,n]=k.split(':');return t=='ring'?`<span class="aw"><div class="av" style="width:52px;height:52px;font-size:24px;background:#5865f2">M</div>${ring(n,52)}</span>`:t=='plate'?`<div class="plp" style="background:${PLT[n]}">Username</div>`:'<div style="font-size:34px">✦</div>'};
const item=k=>{const[t,n]=k.split(':'),x=U(me),on=t=='ring'?x.deco==n:t=='plate'?x.plate==n:0;return`<div class="item"><div class="pvw">${prev(k)}</div><div class="im"><b>${SHOP[k][0]}</b><div class="mu" style="margin:2px 0 10px">${SHOP[k][1]}</div>${k=='memo'?(owns(k)?'<button class="g" disabled>Active</button>':'<button class="g" disabled>Redeem a key below</button>'):owns(k)?`<button class="${on?'g':''}" onclick="eq('${k}')">${on?'Unequip':'Equip'}</button>`:'<button class="g" disabled>🔒 Locked</button>'}</div></div>`};
const eq=k=>{const[t,n]=k.split(':'),x=U(me),p=t=='ring'?'deco':'plate';x[p]=x[p]==n?'':n;save();render();settings()};
function redeem(){const k=$('#rk').value.trim().toUpperCase(),h=uid(k),e=db.keys?.[h];if(!e)return toast('Invalid or used key');const x=U(me);if(e=='memo')x.memo=1;else x.owned=[...new Set([...(x.owned||[]),e])];delete db.keys[h];save();render();settings();toast('Redeemed '+SHOP[e][0]+'!')}
function genKey(){const it=$('#ki').value,k='MC-'+rid().toUpperCase()+'-'+rid().toUpperCase();db.keys[uid(k)]=it;save();navigator.clipboard?.writeText(k);modal(`<h2>Key for ${SHOP[it][0]}</h2><p class="mu">Send this to the user. One use. Copied to clipboard.</p><input readonly value="${k}" onclick="this.select()"><button style="width:100%" onclick="closeModal()">Done</button>`)}
const tb=(u,k)=>{const x=U(u);x.b=x.b||[];x.b.includes(k)?x.b.splice(x.b.indexOf(k),1):x.b.push(k);if(k=='memo')x.memo=x.b.includes('memo')?1:0;save();settings()};
const ban=(u,on)=>{U(u).banned=on;save();settings()};
function addLink(){let t=$('#lt').value.trim(),u=$('#lu').value.trim();if(!t||!u)return toast('Enter a title and URL');if(!/^https?:\/\//i.test(u))u='https://'+u;const x=U(me);x.links=x.links||[];if(x.links.length>=5)return toast('Max 5 links');x.links.push({t:t.slice(0,24),u});save();settings()}
function setGame(c){U(me).game=c?null:{n:$('#gn').value.trim().slice(0,40),ts:Date.now()};if(!c&&!U(me).game.n)U(me).game=null;save();render();settings()}
const PG={
profile:()=>{const x=U(me),m=hasMemo(me);return`<label>DISPLAY NAME ${isA(me)?'':'(changeable every 24 hours)'}</label><input id="ed" maxlength="32" value="${esc(x.display)}"><label>PROFILE PICTURE ${m?'(GIFs animate)':''}</label><input id="ea" type="file" accept="image/*"><label>BANNER ${m?'':'(needs Memo)'}</label><input id="eb" type="file" accept="image/*" ${m?'':'disabled'}><button onclick="saveProfile()">Save changes</button><hr><h2>Links</h2>${(x.links||[]).map((l,i)=>`<div class="row"><span>🔗 ${esc(l.t)}</span><span class="mu sp ell">${esc(l.u)}</span><button class="r" onclick="U(me).links.splice(${i},1);save();settings()">✕</button></div>`).join('')}<div class="row"><input id="lt" placeholder="Title (Youtube)" style="margin:0"><input id="lu" placeholder="https://…" style="margin:0"><button onclick="addLink()">Add</button></div>`},
shop:()=>`<h2>Redeem a key</h2><p class="mu">Got a key from a developer? Enter it to unlock the item for free.</p><div class="row"><input id="rk" placeholder="MC-XXXXXXXX-XXXXXXXX" style="margin:0"><button onclick="redeem()">Redeem</button></div><hr><h2>Memo</h2><div class="shop">${item('memo')}</div><h2>Profile rings</h2><div class="shop">${Object.keys(RING).map(k=>item('ring:'+k)).join('')}</div><h2>Nameplates</h2><div class="shop">${Object.keys(PLT).map(k=>item('plate:'+k)).join('')}</div>`,
activity:()=>{const g=U(me).game;return`<h2>Activity</h2><p class="mu" style="margin-bottom:12px">Browsers cannot see your running games, so set what you're playing here. It shows on your profile and in the member list.</p>${g?`<div class="ac">Playing <b>${esc(g.n)}</b> for ${ago(g.ts)}</div><button class="g" onclick="setGame(1)">Clear activity</button>`:`<input id="gn" maxlength="40" placeholder="Game or app name"><button onclick="setGame(0)">Set activity</button>`}`},
admin:()=>`<h2>Generate key</h2><div class="row"><select id="ki" style="margin:0">${Object.entries(SHOP).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select><button onclick="genKey()">Generate</button></div><hr><h2>Users</h2>`+Object.keys(db.users).filter(u=>u!=me).map(u=>`<div class="ac"><div class="row" style="margin-top:0"><b>${esc(U(u).display||u)}</b><span class="mu">@${esc(u)} · ${uid(u)}</span><span class="sp"></span>${U(u).banned?`<button class="g" onclick="ban('${u}',0)">Unban</button>`:`<button class="r" onclick="ban('${u}',1)">Ban</button>`}</div><div class="row" style="margin-bottom:0">${GIVE.map(k=>`<button class="${(U(u).b||[]).includes(k)?'':'g'}" onclick="tb('${u}','${k}')">${B[k][0]}</button>`).join('')}</div></div>`).join('')};
function settings(p){if(p)sp=p;if(sp=='admin'&&!isA(me))sp='profile';let o=$('.stg');if(!o){o=document.createElement('div');o.className='stg pop';document.body.append(o)}const t={...T,...(isA(me)?{admin:'Admin Panel'}:{})};
o.innerHTML=`<div class="sn">${Object.entries(t).map(([k,v])=>`<div class="si ${sp==k?'on':''}" onclick="settings('${k}')">${v}</div>`).join('')}<hr><div class="si" style="color:#f2575c" onclick="logout()">Log out</div></div><div class="sr"><div class="srh"><b>${t[sp]}</b><button class="g" onclick="$('.stg').remove()">✕</button></div><div class="sbody"><div class="sin">${PG[sp]()}</div></div></div>`}
async function up(f,max,anim,kind){const d=await img(f,max,anim);try{const b=await(await fetch(d)).blob(),path=`${kind}/${uid(me)}-${Date.now()}.${b.type=='image/gif'?'gif':'jpg'}`;const{error}=await sb.storage.from('media').upload(path,b,{contentType:b.type,upsert:true});if(error)throw error;return sb.storage.from('media').getPublicUrl(path).data.publicUrl}catch{return d}}
async function saveProfile(){const x=U(me),m=hasMemo(me),n=$('#ed').value.trim(),a=$('#ea').files[0],b=$('#eb').files[0];
if(n&&n!=x.display){const w=864e5-(Date.now()-(x.nameAt||0));if(!isA(me)&&w>0)return toast('You can change your name again in '+Math.ceil(w/36e5)+'h')}
try{if(a)x.avatar=await up(a,256,m,'avatar');if(b&&m)x.banner=await up(b,960,m,'banner')}catch{return toast('Image failed. GIFs must be under 1.5 MB.')}
if(n&&n!=x.display){x.display=n;x.nameAt=Date.now()}clearTimeout(saveT);await push();render();settings();toast('Profile saved')}
boot();
</script></body></html>
