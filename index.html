function verify(id){const s=db.servers[id||sid()];if(!s)return;s.ver=s.ver||[];if(s.ver.includes(me))return;s.ver.push(me);save();render();toast('You are verified!')}
function addMsg(m){const a=msgArr();if(view.t=='srv'){const c=ch(),s=cs();if(c.lock&&!(isA(me)||s.owner==me))return toast('Only admins can post in #'+c.n);if(!perm(s,me,c.id,'s'))return toast('You do not have permission to type here');if(/@everyone/.test(m.x||'')&&!(isA(me)||s.owner==me))return toast('Only admins can use @everyone')}
if(view.t=='dm'&&view.id==BOT)return toast('You cannot reply to this account');a.push(m);if(a.length>L.keep)a.splice(0,a.length-L.keep);save();render()}
async function sendNow(){const i=$('#inp');if(!i||i.disabled)return;const t=i.value.trim();if(!t&&!pend)return;
if(!pend&&t[0]=='!'){i.value='';return cmd(t)}if(!pend&&/^\/giveaway/i.test(t)){i.value='';return giveCmd(t)}if(!pend&&/^\/(embed|verify)\b/i.test(t)){i.value='';return slash(t)}
const m={u:me,x:t.slice(0,L.msg),ts:Date.now()};if(view.t==='srv'&&m.x){const mm=mentionsIn(m.x);if(mm.everyone){if(!(isA(me)||cs().owner===me))return toast('Only server admins can use @everyone');m.everyonePing=true}else m.mentions=mm.users.filter(u=>u!==me)}if(replyTo){m.re={ts:replyTo.ts,u:replyTo.u,x:(replyTo.x||'Image').slice(0,80)};replyTo=null}if(pend){try{m.img=pend.url||await uploadBlob(pend.blob,'messages',pend.ext)}catch(e){return toast('Upload failed. Check Supabase Storage permissions.')}}pend=null;i.value='';addMsg(m)}
function slash(t){const s=view.t=='srv'?cs():null;if(!s||!canEdit(s,sid()))return toast('Only server owners can use this command in a server');const c=t.trim().split(/\s+/)[0].toLowerCase();
let e,btn;if(c=='/embed'){const[a,...b]=t.slice(7).split('|');if(!a.trim())return toast('Usage: /embed Title | description');e={t:a.trim().slice(0,100),d:b.join('|').trim().slice(0,600)}}
else{e={t:'Verify to enter '+s.name,d:'Press the button below to confirm you are a real person and unlock the rest of the server.'};btn='VERIFY HERE!'}
e.by=(U(me).display||me)+' • '+new Date().toLocaleDateString();const m={u:BOT,ts:Date.now(),em:e};if(btn)m.btn=btn;msgArr().push(m);save();render()}
function cmd(t){const p=t.trim().split(/\s+/),c=p[0].toLowerCase();if(!['!ban','!unban','!banserver'].includes(c))return toast('Unknown command');if(!isA(me))return toast('You do not have permission');
if(c=='!banserver'){const id=p[1],s=db.servers[id];if(!s||id==SID)return toast('No server with that ID');delete db.servers[id];save();toast('Deleted '+s.name);if(view.s==id)view={t:'srv',s:SID,c:'general'};return render()}
const tg=findU(p[1]);if(!tg)return toast('No user with that ID');if(tg==OWNER||tg==BOT||tg==GB)return toast('You cannot do that to this user');U(tg).banned=c=='!ban'?1:0;save();toast((c=='!ban'?'Banned ':'Unbanned ')+tg);render()}
/* ----- images ----- */
async function prep(f,max){if(f.type=='image/gif')return{blob:f,ext:'gif'};return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const i=new Image();i.onerror=no;i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>ok({blob:b,ext:'jpg'}),'image/jpeg',.88)};i.src=r.result};r.readAsDataURL(f)})}
async function uploadBlob(b,kind,ext){const path=`${kind}/${uid(me)}-${Date.now()}-${rid()}.${ext}`,{error}=await sb.storage.from(CFG.supabase.bucket).upload(path,b,{contentType:b.type||'image/jpeg',upsert:false});if(error)throw error;return sb.storage.from(CFG.supabase.bucket).getPublicUrl(path).data.publicUrl}
async function upImg(f,max,kind){const p=await prep(f,max);return uploadBlob(p.blob,kind,p.ext)}
async function stage(f){if(!f||!f.type.startsWith('image/'))return toast('Choose an image');if(f.size>L.imgMB*1048576)return toast('Image must be under '+L.imgMB+' MB');try{const p=await prep(f,1400);pend={blob:p.blob,ext:p.ext};showPend()}catch{toast('Could not read image')}}
function showPend(){const p=$('#ap2');if(!p)return;if(!pend){p.innerHTML='';return}const u=pend.url||(pend.u2=pend.u2||URL.createObjectURL(pend.blob));p.innerHTML=`<div class="row"><img class="pvimg" src="${esc(u)}"><button class="g" onclick="pend=null;showPend()">Remove</button></div>`}
async function copyImg(src){try{const b=await(await fetch(src)).blob(),bm=await createImageBitmap(b),c=document.createElement('canvas');c.width=bm.width;c.height=bm.height;c.getContext('2d').drawImage(bm,0,0);const png=await new Promise(o=>c.toBlob(o,'image/png'));await navigator.clipboard.write([new ClipboardItem({'image/png':png})]);toast('Image copied — paste it in any app')}catch{toast('Copy blocked by browser. Use Save image.')}}
async function saveImg(src){try{const b=await(await fetch(src)).blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='memocord-'+Date.now()+'.'+((b.type.split('/')[1]||'png').replace('jpeg','jpg'));a.click()}catch{window.open(src,'_blank')}}

modal(pk('g')+`<input id="gs" placeholder="Search GIFs..." value="${esc(gq)}" style="margin-top:0" oninput="gifMenu(this.value);const e=$('#gs');e.focus();e.setSelectionRange(99,99)"><div class="gg">${l.map(([g,i])=>`<div class="gi" onclick="useGif(${i})"><img src="${esc(g.url)}" loading="lazy"><div>${esc(g.desc||'GIF')}</div></div>`).join('')||'<p class="mu">No GIFs found.</p>'}</div><div class="up2"><b>Submit a GIF</b><div class="mu" style="margin-bottom:8px">Developers review it before it shows up here (max 1.5 MB).</div><input id="gf" type="file" accept="image/gif"><input id="gd" maxlength="100" placeholder="Describe this GIF"><button style="width:100%" onclick="subGif()">${ic('plus',16)} Submit GIF</button></div>`,560)}

const gcard=m=>{const g=m.g,on=g.ent.includes(me);return`<div class="gv"><b>${ic('gift',18)} ${esc(g.prize)}</b><div class="mu" style="margin-top:4px">${g.done?'Ended':'Ends '+new Date(g.end).toLocaleString()} · ${g.w} winner${g.w>1?'s':''} · ${g.ent.length} entered</div>${g.done?`<div style="margin-top:8px">Winners: ${g.win.length?g.win.map(dn).join(', '):'nobody entered'}</div>`:`<button class="${on?'g':''}" onclick="enterG('${m.ts}')">${on?'Leave giveaway':'Enter giveaway'}</button>`}</div>`};
function enterG(ts){const m=findMsg(ts);if(!m?.g||m.g.done||Date.now()>m.g.end)return toast('This giveaway has ended');const e=m.g.ent;e.includes(me)?e.splice(e.indexOf(me),1):e.push(me);save();render()}
function giveCmd(t){const s=view.t=='srv'?cs():null;if(!s)return toast('Use /giveaway inside a server');if(!(isA(me)||s.owner==me))return toast('Only server owners can run giveaways');if(!isA(me)&&!(s.bots||[]).includes('giveaway'))return toast('Add the Giveaway bot in Server Settings → Bots');
const p=t.trim().split(/\s+/),mt=/^(\d+)([smhdw])$/i.exec(p[2]||'');if(p[1]?.toLowerCase()!='start'||!mt)return toast('Usage: /giveaway start 1d Memo free key 1');let w=1;if(p.length>4&&/^\d+$/.test(p[p.length-1]))w=Math.max(1,Math.min(20,+p.pop()));const prize=p.slice(3).join(' ');if(!prize)return toast('Add a prize');
gvp={prize:prize.slice(0,80),end:Date.now()+(+mt[1])*{s:1e3,m:6e4,h:36e5,d:864e5,w:6048e5}[mt[2].toLowerCase()],w,ent:[],done:0,by:me};
modal(`<h2>${ic('gift')} Giveaway preview</h2><div class="gv" style="max-width:none"><b>${esc(gvp.prize)}</b><div class="mu" style="margin-top:4px">Ends ${new Date(gvp.end).toLocaleString()} · ${w} winner${w>1?'s':''}</div></div><div class="row" style="margin-top:14px"><button class="g sp" onclick="closeModal()">Cancel</button><button class="sp" onclick="startG()">Start giveaway</button></div>`)}
function startG(){if(!gvp)return;closeModal();const a=msgArr();a.push({u:GB,x:'A new giveaway has started!',ts:Date.now(),g:gvp});gvp=null;save();render()}
function checkG(){let c=0;const now=Date.now();for(const s of Object.values(db.servers))for(const a of Object.values(s.msgs||{}))for(const m of a){const g=m.g;if(g&&!g.done&&now>g.end&&(g.by==me||now>g.end+3e4)){g.done=1;const e=g.ent.slice(),w=[];while(w.length<g.w&&e.length)w.push(e.splice(Math.random()*e.length|0,1)[0]);g.win=w;a.push({u:GB,x:w.length?`Congratulations ${w.map(u=>'@'+u).join(', ')}! You won: ${g.prize}`:`Nobody entered the giveaway for ${g.prize}.`,ts:Date.now()});c=1}}if(c)save();return c}
setInterval(()=>{if(me&&ready&&(checkG()||$('.gv')))render()},5000);
