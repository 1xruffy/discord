let pendingImage=null;
function sendFromComposer(){const i=$('#inp');if(!i)return;const t=i.value.trim();if(!t&&!pendingImage)return;if(t.startsWith('!')&&!pendingImage){i.value='';return cmd(t)}const m={u:me,x:t.slice(0,L.msg),ts:Date.now()};if(pendingImage)m.img=pendingImage;pendingImage=null;i.value='';if($('#attachpreview'))$('#attachpreview').innerHTML='';sendMessageObject(m)}
function sendMessageObject(m){if(view.t==='srv'){const c=ch(),s=cs();if(c.lock&&!(isA(me)||s.owner===me))return toast('Only admins can post here');(s.msgs[c.id]=s.msgs[c.id]||[]).push(m);s.msgs[c.id]=s.msgs[c.id].slice(-L.keep)}else{if(view.id===BOT)return toast('You cannot reply to this account');const k=[me,view.id].sort().join('|');(db.dms[k]=db.dms[k]||[]).push(m);db.dms[k]=db.dms[k].slice(-L.keep)}save();render()}
function copyImage(src){fetch(src).then(r=>r.blob()).then(b=>navigator.clipboard.write([new ClipboardItem({[b.type||'image/png']:b})])).then(()=>toast('Image copied')).catch(()=>toast('Image copy unavailable; use Save image'))}
function saveImage(src){const a=document.createElement('a');a.href=src;a.download='memocord-image';a.target='_blank';a.click()}
function deleteMsg(mid,where){const arr=where==='srv'?(cs().msgs[view.c]||[]):(db.dms[[me,view.id].sort().join('|')]||[]);const m=arr.find(x=>String(x.ts)===String(mid));if(!m)return;if(!isA(me)&&!(where==='srv'&&cs().owner===me)&&m.u!==me)return toast('You do not have permission to delete this message');arr.splice(arr.indexOf(m),1);save();render()}
function editChannelPrompt(sid0,cid){const s=db.servers[sid0],c=s?.ch.find(x=>x.id===cid);if(!c||!canEdit(s,sid0))return;const n=prompt('New channel name',c.n);if(!n||!n.trim())return;c.n=n.trim().replace(/[\s#]/g,'-').slice(0,24);const old=c.id;c.id=(c.t==='v'?'v-':'')+c.n.toLowerCase();if(view.c===old)view.c=c.id;save();render()}
function gifMenu(){modal(`<h2>GIFs</h2><div class="row"><span class="tab on">GIFs</span><span class="tab" onclick="emojiMenu()">Emojis</span></div><div class="shop">${(db.gifs||[]).map((g,i)=>`<div class="item"><img src="${esc(g.data)}" style="width:100%;max-height:120px;object-fit:contain"><div class="im"><button onclick="useGif(${i})">Use GIF</button></div></div>`).join('')||'<p class="mu">No approved GIFs yet.</p>'}</div><p class="mu">Submit a GIF for developer review.</p><input id="giffile" type="file" accept="image/gif"><input id="gifdesc" maxlength="100" placeholder="Describe this GIF"><button onclick="submitGifSuggestion()">Submit GIF suggestion</button>`)}
function useGif(i){pendingImage=(db.gifs||[])[i]?.data||null;closeModal();if($('#attachpreview'))$('#attachpreview').innerHTML=pendingImage?`<img class="preview-image" src="${esc(pendingImage)}">`:''}
function submitGifSuggestion(){const f=$('#giffile')?.files[0],desc=$('#gifdesc')?.value.trim()||'';if(!f||f.type!=='image/gif')return toast('Choose a GIF');if(f.size>L.gifBytes)return toast('GIF must be under 1.5 MB');const r=new FileReader();r.onload=()=>{db.gifSuggestions=db.gifSuggestions||[];db.gifSuggestions.push({by:me,desc,data:r.result,ts:Date.now()});save();closeModal();toast('Submitted for developer review')};r.readAsDataURL(f)}
function emojiMenu(){const es=['😀','😃','😄','😁','😆','😂','🤣','😊','😍','🥰','😎','😭','😡','🤔','🙄','💀','☠️','👻','🤖','👍','👎','👏','🙏','❤️','💔','🔥','✨','🎉','💯','✅','❌','⭐','🌈','🐻','🐱','🐶','🍕','🎮','🚀','⚡'];const custom=Object.entries(emAll());modal(`<h2>Emojis</h2><div class="emoji-grid">${es.map(e=>`<button onclick="insertComposerEmoji('${e}')">${e}</button>`).join('')}</div><hr><h3>Server custom emojis ${hasMemo(me)?'':'🔒 Memo'}</h3><div class="emoji-grid">${hasMemo(me)?custom.map(([n,u])=>`<button title=":${esc(n)}:" onclick="insertComposerEmoji(':${esc(n)}:')"><img src="${esc(u)}" style="width:24px;height:24px"></button>`).join(''):'<p class="mu">Custom emojis across servers require Memo.</p>'}</div>`)}
function insertComposerEmoji(e){const i=$('#inp');if(i)i.setRangeText(e,i.selectionStart,i.selectionEnd,'end');closeModal();i?.focus()}
function approveGif(i){if(!isA(me))return;db.gifs=db.gifs||[];const g=(db.gifSuggestions||[]).splice(i,1)[0];if(g)db.gifs.push(g);save();settings('admin')}
function rejectGif(i){if(!isA(me))return;(db.gifSuggestions||[]).splice(i,1);save();settings('admin')}
/* Replace the chat template with a multiline composer and image rendering. */
const oldChat=chat;
chat=function(head,msgs,lock,ph,s){const where=view.t==='srv'?'srv':'dm';return `<div class="top">${head}</div><div id="msgs" class="msgs">${msgs.filter(m=>U(m.u)).map(m=>`<div class="msg" data-ctx="message:${where}|${m.ts}"><span onclick="prof('${m.u}')">${av(m.u,40)}</span><div style="min-width:0;flex:1">${nameH(m.u)} <span class="mu">${new Date(m.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span><div class="msgtext">${fmt(m.x||'',m.u,s)}</div>${m.img?`<img class="msgimg" data-ctx="image:${esc(m.img)}" src="${esc(m.img)}" alt="Sent image">`:''}</div></div>`).join('')||'<p class="mu" style="padding:8px 16px">This is the start of the conversation.</p>'}</div><div class="inw"><div id="attachpreview"></div><div class="composer"><button class="toolbtn" onclick="$('#attach').click()" title="Upload image">＋</button><input id="attach" type="file" accept="image/*" hidden><textarea id="inp" rows="1" autocomplete="off" ${lock?'disabled':''} placeholder="${lock?CFG.text.lockedPost:ph}"></textarea><button class="toolbtn" onclick="gifMenu()" title="GIFs">GIF</button><button class="toolbtn" onclick="emojiMenu()" title="Emojis">☻</button><button onclick="sendFromComposer()" title="Send">➤</button></div></div>`};
/* Keep the existing renderer but wire the new composer and custom context actions. */
const oldDraw=draw;
draw=function(){oldDraw();const i=$('#inp');if(i){i.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendFromComposer()}};const af=$('#attach');if(af)af.onchange=()=>{const f=af.files[0];if(!f)return;if(!f.type.startsWith('image/'))return toast('Choose an image');const r=new FileReader();r.onload=()=>{pendingImage=r.result;$('#attachpreview').innerHTML=`<div class="row"><img class="preview-image" src="${r.result}"><button class="g" onclick="pendingImage=null;$('#attachpreview').innerHTML=''">Remove</button></div>`};r.readAsDataURL(f)}}};
const oldCtxItems=ctxItems;
ctxItems=function(k,id){if(k==='message'){const [where,mid]=id.split('|');const arr=where==='srv'?(cs().msgs[view.c]||[]):(db.dms[[me,view.id].sort().join('|')]||[]),m=arr.find(x=>String(x.ts)===mid);if(!m)return[];const a=[['Copy text',()=>copy(m.x||'')]];if(m.img)a.push(['Copy image',()=>copyImage(m.img)],['Save image',()=>saveImage(m.img)]);if(m.u===me||isA(me)||(where==='srv'&&cs().owner===me))a.push(['Delete message',()=>deleteMsg(mid,where),'dn']);return a}if(k==='image')return[['Copy image',()=>copyImage(id)],['Save image',()=>saveImage(id)]];if(k==='channel'){const [sid0,cid]=id.split('|');return canEdit(db.servers[sid0],sid0)?[['Edit channel name',()=>editChannelPrompt(sid0,cid)]]:[]}return oldCtxItems(k,id)};
const baseCtxListener=addEventListener;
addEventListener('contextmenu',e=>{const t=e.target.closest('.msgimg');if(t){e.preventDefault();e.stopPropagation();const it=[['Copy image',()=>copyImage(t.src)],['Save image',()=>saveImage(t.src)]];$('.cm')?.remove();cmf=it.map(x=>x[1]);const m=document.createElement('div');m.className='cm pop';m.innerHTML=it.map((x,j)=>`<div onclick="cmf[${j}]()">${x[0]}</div>`).join('');m.style.left=Math.min(e.clientX,innerWidth-200)+'px';m.style.top=Math.min(e.clientY,innerHeight-100)+'px';document.body.append(m);return}const t2=e.target.closest('.nav');if(t2&&view.t==='srv'&&canEdit(cs(),sid())){const label=t2.textContent.trim().replace(/^#|^🔊/,'').trim(),c=cs().ch.find(x=>x.n===label);if(c){e.preventDefault();$('.cm')?.remove();const m=document.createElement('div');m.className='cm pop';m.innerHTML=`<div onclick="editChannelPrompt('${sid()}','${c.id}')">Edit channel name</div>`;m.style.left=Math.min(e.clientX,innerWidth-200)+'px';m.style.top=Math.min(e.clientY,innerHeight-80)+'px';document.body.append(m)}}});

const adminBase=PG.admin;
PG.admin=()=>adminBase()+`<hr><h2>GIF submissions</h2>`+((db.gifSuggestions||[]).map((g,i)=>`<div class="ac"><b>${esc(g.desc||'GIF suggestion')}</b><img src="${esc(g.data)}" style="display:block;max-width:220px;max-height:120px;margin:8px 0"><div class="mu">Submitted by @${esc(g.by)}</div><button onclick="approveGif(${i})">Approve GIF</button> <button class="r" onclick="rejectGif(${i})">Reject</button></div>`).join('')||'<p class="mu">No GIF submissions.</p>');

boot();
</script></body></html>
