<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chatcord</title>
<style>
:root{--bg:#1e1f22;--bg2:#2b2d31;--bg3:#313338;--tx:#f2f3f5;--mu:#949ba4;--br:#5865f2;--rd:#da373c}
*{box-sizing:border-box;margin:0}
body{font:15px/1.4 "gg sans","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);height:100vh;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:6px;padding:8px 14px;background:var(--br);transition:.15s}
button:hover{filter:brightness(1.15);transform:translateY(-1px)}button:active{transform:scale(.97)}
button.g{background:#4e5058}button.r{background:var(--rd)}
input,select{background:#1e1f22;border:1px solid #0004;border-radius:6px;padding:10px;width:100%;outline:0;transition:.15s;margin:4px 0 10px}
input:focus{box-shadow:0 0 0 2px var(--br)}select{background:var(--bg3);padding:4px;width:auto;margin:0}
label{font-size:12px;font-weight:700;color:var(--mu)}h2{margin-bottom:10px}hr{border:0;border-top:1px solid #ffffff14;margin:12px 0}
a{color:#00a8fc;cursor:pointer}.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:8px;align-items:center;margin:8px 0}.sp{flex:1}
.pop{animation:pop .18s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{opacity:0;transform:scale(.9) translateY(8px)}}
.slide{animation:sl .3s ease}@keyframes sl{from{opacity:0;transform:translateY(12px)}}
.auth{height:100vh;display:grid;place-items:center;background:linear-gradient(130deg,#5865f2,#1e1f22,#eb459e,#1e1f22);background-size:300% 300%;animation:bg 14s ease infinite}
@keyframes bg{50%{background-position:100% 100%}}
.card{width:min(420px,92vw);background:var(--bg3);padding:30px;border-radius:8px;box-shadow:0 8px 40px #0008}.card h1{text-align:center}.card button{width:100%;margin:6px 0 12px}.card p{text-align:center}
#app{display:flex;height:100vh}
.rail{width:72px;background:var(--bg);padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:8px;overflow-y:auto}
.ri{width:48px;height:48px;border-radius:50%;background:var(--bg3);display:grid;place-items:center;cursor:pointer;overflow:hidden;font-weight:700;position:relative;transition:border-radius .2s,background .2s,transform .2s;flex:none}
.ri img{width:100%;height:100%;object-fit:cover}.ri:hover,.ri.on{border-radius:16px;background:var(--br)}.ri:hover{transform:scale(1.06)}
.ri.on::before{content:"";position:fixed;left:0;width:4px;height:36px;background:#fff;border-radius:0 4px 4px 0;animation:pop .2s}
.ri.add{color:#23a55a;font-size:24px}.ri.add:hover{background:#23a55a;color:#fff}.rs{width:32px}
.side{width:240px;background:var(--bg2);display:flex;flex-direction:column}.sc{flex:1;overflow-y:auto;padding:8px}
.sh{padding:12px 8px;font-weight:700;border-bottom:1px solid #0003;margin:-8px -8px 8px}
.find{background:var(--bg);padding:7px;border-radius:4px;color:var(--mu);font-size:13px;margin-bottom:8px;text-align:center}
.nav,.ch{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:5px;cursor:pointer;color:var(--mu);transition:.12s}
.nav:hover,.ch:hover{background:#ffffff0f;color:var(--tx);transform:translateX(2px)}.nav.on,.ch.on{background:#ffffff1c;color:var(--tx)}
.up{height:56px;background:#232428;display:flex;align-items:center;padding:0 8px}
#upb{display:flex;gap:10px;align-items:center;padding:5px 8px;border-radius:6px;cursor:pointer;flex:1;transition:.15s}#upb:hover{background:#ffffff14}
#upb b{font-size:14px;display:block;line-height:1.1}
main{flex:1;display:flex;flex-direction:column;background:var(--bg3);min-width:0}
.top{height:48px;border-bottom:1px solid #0003;display:flex;align-items:center;gap:14px;padding:0 16px;flex:none}
.tab{padding:3px 10px;border-radius:5px;cursor:pointer;color:var(--mu);transition:.15s}.tab:hover,.tab.on{background:#ffffff1c;color:var(--tx)}.tab.add{background:var(--br);color:#fff}.tab.add.on2{background:none;color:#23a55a}
.body{padding:20px;overflow-y:auto}.fr{display:flex;align-items:center;gap:12px;padding:10px;border-top:1px solid #ffffff10;border-radius:6px;animation:sl .25s}.fr:hover{background:#ffffff0d}
.msgs{flex:1;overflow-y:auto;padding:16px}.msg{display:flex;gap:14px;padding:6px 8px;border-radius:4px}.msg:hover{background:#0000001a}.msg>span{cursor:pointer;flex:none;height:40px}.msg div{word-break:break-word}
.inw{padding:0 16px 20px}.inw input{padding:12px;background:#383a40;margin:0}
.mem{width:240px;background:var(--bg2);padding:14px 8px;overflow-y:auto}.mrow{display:flex;gap:10px;align-items:center;padding:5px 8px;border-radius:5px;cursor:pointer}.mrow:hover{background:#ffffff0f}.offl{opacity:.45}
.av{border-radius:50%;object-fit:cover;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}.avw{position:relative;display:inline-flex}
.dot{position:absolute;right:-2px;bottom:-2px;width:13px;height:13px;border-radius:50%;border:3px solid var(--bg2);background:#80848e}.dot.online{background:#23a55a}.dot.idle{background:#f0b232}.dot.dnd{background:#f23f43}
.bd{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font-size:11px;vertical-align:middle;margin-left:2px}
.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:50;animation:fi .2s}@keyframes fi{from{opacity:0}}
.md{background:var(--bg3);padding:22px;border-radius:10px;width:min(420px,92vw);max-height:90vh;overflow-y:auto}.md .pc{margin:-22px -22px 0}
.pc{background:var(--bg2);border-radius:10px;overflow:hidden}.bn{height:100px;background-size:cover;background-position:center}
.pav{margin:-42px 0 0 16px;display:inline-flex;position:relative}.pav .av,.pav img{border:6px solid var(--bg2)}.pav .dot{right:4px;bottom:4px;width:22px;height:22px;border-width:4px}
.pb{padding:6px 16px 16px}.big{font-size:20px}
.upop{position:fixed;left:12px;bottom:66px;width:300px;z-index:40;border-radius:10px;box-shadow:0 8px 30px #000b;background:var(--bg2);transform-origin:bottom left}
.pm{padding:6px 10px 10px}.mi{padding:8px 10px;border-radius:4px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}.mi:hover{background:var(--br)}.mi.dng{color:#f23f43}.mi.dng:hover{background:var(--rd);color:#fff}
.menu{position:fixed;z-index:60;background:#111214;padding:6px;border-radius:6px;min-width:180px;box-shadow:0 6px 24px #000c}.menu hr{margin:4px 0}
.sw{width:18px;height:18px;border-radius:50%;display:inline-block}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111214;padding:10px 18px;border-radius:8px;z-index:99;animation:pop .2s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:700px){.mem,.side{display:none}}
</style></head><body><div id="root"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K='chatcord_v1',SK='chatcord_seen',MEMO_KEY='MEMO-PLACEHOLDER-KEY',BTC='bc1qPLACEHOLDERADDRESS0000000000000000000';
let db;try{db=JSON.parse(localStorage[K])}catch{}db=db||{users:{},servers:{},dms:{},inv:{}};
let me=sessionStorage.me||null,view={t:'friends',tab:'online'};
const save=()=>{try{localStorage[K]=JSON.stringify(db)}catch{toast('Storage full. Use a smaller image.')}};
const U=u=>db.users[u],dn=u=>esc(U(u)?.display||u),rid=()=>Math.random().toString(36).slice(2,10);
const sha=async t=>{try{return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('cc:'+t)))].map(b=>b.toString(16).padStart(2,'0')).join('')}catch{return btoa(t)}};
const hasMemo=u=>u==='9584'||U(u)?.memo;
const seen=()=>{try{return JSON.parse(localStorage[SK]||'{}')}catch{return{}}};
const online=u=>U(u)&&U(u).status!=='invisible'&&Date.now()-(seen()[u]||0)<30000;
const dot=u=>online(u)?(U(u).status||'online'):'off';
const ST={online:'Online',idle:'Idle',dnd:'Do Not Disturb',invisible:'Invisible'};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)}
const B={own:['👑','#f0b232','Server Owner'],dev:['🛠','#5865f2','Active Developer'],bird:['☁','#e3e5e8','Early Supporter'],memo:['✦','#eb459e','Memo']};
const badges=u=>(u==='9584'?['own','dev','bird','memo']:U(u)?.memo?['memo']:[]).map(k=>`<span class="bd" style="background:${B[k][1]}" title="${B[k][2]}">${B[k][0]}</span>`).join('');
const av=(u,s=40)=>{const x=U(u);return x?.avatar?`<img class="av" src="${x.avatar}" style="width:${s}px;height:${s}px">`:`<div class="av" style="width:${s}px;height:${s}px;font-size:${s/2}px;background:hsl(${[...u].reduce((a,c)=>a+c.charCodeAt(0),0)*37%360} 50% 45%)">${esc((x?.display||u)[0].toUpperCase())}</div>`};
const card=u=>{const x=U(u);return`<div class="pc"><div class="bn" style="${x.banner?`background-image:url(${x.banner})`:'background:var(--br)'}"></div><div class="pav">${av(u,84)}<i class="dot ${dot(u)}"></i></div><div class="pb"><b class="big">${dn(u)}</b> ${badges(u)}<div class="mu">${esc(u)}</div></div></div>`};
const showProfile=u=>modal(card(u));
const rc=(s,u)=>(s&&(s.mr[u]||[]).map(i=>s.roles.find(r=>r.id==i)).find(Boolean)?.color)||'#f2f3f5';

/* ---------- overlays ---------- */
function modal(h){closeModal();const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="md pop">${h}</div>`;o.onmousedown=e=>{if(e.target==o)o.remove()};document.body.append(o)}
const closeModal=()=>$('.ov')?.remove(),closeMenu=()=>document.querySelectorAll('.menu').forEach(m=>m.remove());
function menu(e,items){e.preventDefault();closeMenu();const m=document.createElement('div');m.className='menu pop';m.innerHTML=items.map((i,n)=>i==='-'?'<hr>':`<div class="mi ${i.d?'dng':''}" data-n="${n}">${i.l}</div>`).join('');document.body.append(m);const r=m.getBoundingClientRect();m.style.left=Math.min(e.clientX,innerWidth-r.width-8)+'px';m.style.top=Math.min(e.clientY,innerHeight-r.height-8)+'px';m.onclick=ev=>{const n=ev.target.dataset.n;if(n!=null){closeMenu();items[n].f()}}}
document.addEventListener('click',e=>{closeMenu();if(!e.target.closest('.upop,#upb'))$('.upop')?.remove()});
document.addEventListener('contextmenu',e=>{const t=e.target.closest('[data-ctx]');if(!t||!me)return;const[k,id]=t.dataset.ctx.split(':');ctx[k](e,id)});
const img=(f,max,anim)=>new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{if(f.type=='image/gif'&&anim){f.size<1.5e6?ok(r.result):no();return}const i=new Image();i.onerror=no;i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.85))};i.src=r.result};r.readAsDataURL(f)});

/* ---------- auth ---------- */
function authView(mode='login'){const L=mode=='login';
$('#root').innerHTML=`<div class="auth"><div class="card pop"><h1>${L?'Welcome back':'Create an account'}</h1><p class="mu" style="margin:6px 0 18px">${L?'Log in to pick up your conversations.':'Pick a username and password.'}</p><label>USERNAME</label><input id="au" autocomplete="username"><label>PASSWORD</label><input id="ap" type="password"><button id="ab">${L?'Log in':'Register'}</button><p class="mu">${L?'Need an account? <a onclick="authView(\'reg\')">Register</a>':'<a onclick="authView()">Already have an account?</a>'}</p></div></div>`;
$('#ap').onkeydown=e=>e.key=='Enter'&&$('#ab').click();
$('#ab').onclick=async()=>{const u=$('#au').value.trim(),p=$('#ap').value;
if(!/^[\w.-]{3,32}$/.test(u)||/^(__proto__|constructor|prototype)$/.test(u))return toast('Username: 3-32 letters, numbers, _ . -');
const h=await sha(p);
if(L){if(!db.users[u]||db.users[u].pass!==h)return toast('Wrong username or password')}
else{if(p.length<6)return toast('Password needs at least 6 characters');if(db.users[u])return toast('That username is taken');db.users[u]={pass:h,display:u,friends:[],blocked:[],status:'online'};save()}
me=sessionStorage.me=u;view={t:'friends',tab:'online'};render()}}

/* ---------- profile ---------- */
function pop(){if($('.upop'))return $('.upop').remove();const d=document.createElement('div');d.className='upop pop';
d.innerHTML=card(me)+`<div class="pm"><div class="mi" onclick="editProfile()">✏️ Edit Profile</div><div class="mi">Status <select onchange="setStatus(this.value)">${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${U(me).status==k?'selected':''}>${v}</option>`).join('')}</select></div><div class="mi" onclick="memoModal()">✦ ${hasMemo(me)?'Memo active':'Get Memo'}</div><div class="mi dng" onclick="logout()">Log out</div></div>`;document.body.append(d)}
const setStatus=v=>{U(me).status=v;save();$('.upop')?.remove();render()};
function logout(){delete sessionStorage.me;me=null;$('.upop')?.remove();authView()}
function editProfile(){$('.upop')?.remove();const x=U(me),m=hasMemo(me);
modal(`<h2>Edit Profile</h2><label>DISPLAY NAME</label><input id="ed" maxlength="32" value="${esc(x.display)}"><label>PROFILE PICTURE ${m?'(GIFs animate ✦)':'(static image)'}</label><input id="ea" type="file" accept="image/*"><label>BANNER ${m?'✦':'(needs Memo)'}</label><input id="eb" type="file" accept="image/*" ${m?'':'disabled'}>${m?'':'<p class="mu">Custom banners and animated avatars need Memo. <a onclick="memoModal()">Get Memo</a></p>'}<div class="row"><span class="sp"></span><button class="g" onclick="closeModal()">Cancel</button><button id="es">Save changes</button></div>`);
$('#es').onclick=async()=>{const n=$('#ed').value.trim(),a=$('#ea').files[0],b=$('#eb').files[0];try{if(a)x.avatar=await img(a,128,m);if(b&&m)x.banner=await img(b,640,m)}catch{return toast('Image failed. Animated GIFs must be under 1.5 MB.')}if(n)x.display=n;save();closeModal();render()}}
function memoModal(){$('.upop')?.remove();modal(`<h2>✦ Memo</h2><p class="mu" style="margin-bottom:12px">Unlock custom banners and animated profile pictures. Send BTC to this address, then enter the license key you receive.</p><label>BTC ADDRESS (placeholder)</label><input readonly value="${BTC}" onclick="this.select()"><button class="g" onclick="navigator.clipboard?.writeText('${BTC}');toast('Address copied')">Copy address</button><hr><label>LICENSE KEY</label><input id="mk"><div class="row"><span class="sp"></span><button class="g" onclick="closeModal()">Close</button><button id="mb">Activate</button></div>`);
$('#mb').onclick=()=>{if($('#mk').value.trim()===MEMO_KEY){U(me).memo=1;save();closeModal();render();toast('Memo activated')}else toast('Invalid license key')}}

/* ---------- friends ---------- */
const dm=u=>{view={t:'dm',id:u};render()};
function blk(u,on){const x=U(me);if(on){x.blocked.includes(u)||x.blocked.push(u);x.friends=x.friends.filter(f=>f!=u);U(u).friends=U(u).friends.filter(f=>f!=me)}else x.blocked=x.blocked.filter(f=>f!=u);save();toast(on?'Blocked '+u:'Unblocked '+u);render()}
function unf(u){U(me).friends=U(me).friends.filter(f=>f!=u);U(u).friends=U(u).friends.filter(f=>f!=me);save();render()}
function addFriend(){const x=U(me),n=$('#af').value.trim(),y=U(n);if(!y||n==me)return toast('No user with that username');if(y.blocked.includes(me)||x.blocked.includes(n))return toast('You cannot add this user');if(!x.friends.includes(n)){x.friends.push(n);y.friends.push(me)}save();toast('Added '+n);render()}
function friendsView(){const x=U(me),t=view.tab;
let h=`<div class="top"><b>👥 Friends</b>${['online','all','blocked'].map(k=>`<span class="tab ${t==k?'on':''}" onclick="view.tab='${k}';render()">${k[0].toUpperCase()+k.slice(1)}</span>`).join('')}<span class="tab add ${t=='add'?'on2':''}" onclick="view.tab='add';render()">Add Friend</span></div><div class="body">`;
if(t=='add')h+=`<h2>Add Friend</h2><p class="mu">Enter their exact username.</p><div class="row"><input id="af" placeholder="Username" style="margin:0"><button id="ab2" style="white-space:nowrap">Add friend</button></div>`;
else{const l=(t=='blocked'?x.blocked:x.friends).filter(u=>U(u)&&(t!='online'||online(u)));
h+=`<div class="mu" style="margin-bottom:8px">${t=='online'?'Online':t=='all'?'All friends':'Blocked'}: ${l.length}</div>`+(l.map(u=>`<div class="fr" data-ctx="friend:${u}"><div class="avw">${av(u,38)}<i class="dot ${dot(u)}"></i></div><div><b>${dn(u)}</b> ${badges(u)}<div class="mu">${esc(u)}</div></div><span class="sp"></span>${t=='blocked'?`<button class="g" onclick="blk('${u}',0)">Unblock</button>`:`<button class="g" onclick="dm('${u}')">💬</button>`}</div>`).join('')||`<p class="mu">${t=='online'?'No friends online right now.':t=='blocked'?'You have not blocked anyone.':'Add a friend to get started.'}</p>`)}
return h+'</div>'}

/* ---------- servers ---------- */
function addServer(){modal(`<h2>Create a server</h2><label>SERVER NAME</label><input id="sn" maxlength="32"><label>SERVER ICON</label><input id="si" type="file" accept="image/*"><button id="sc" style="width:100%">Create server</button><hr><h2>Join a server</h2><label>INVITE CODE</label><input id="sj"><button class="g" id="sjb" style="width:100%">Join server</button>`);
$('#sc').onclick=async()=>{const n=$('#sn').value.trim();if(!n)return toast('Give your server a name');let ic='';const f=$('#si').files[0];if(f)try{ic=await img(f,128,0)}catch{}const id=rid(),c=rid().toUpperCase();db.servers[id]={name:n,icon:ic,owner:me,members:[me],bans:[],timeouts:{},roles:[],mr:{},msgs:[],code:c};db.inv[c]=id;save();closeModal();view={t:'srv',id};render()};
$('#sjb').onclick=()=>{const id=db.inv[$('#sj').value.trim().toUpperCase()],s=db.servers[id];if(!s)return toast('Invalid invite code');if(s.bans.includes(me))return toast('You are banned from this server');if(!s.members.includes(me))s.members.push(me);save();closeModal();view={t:'srv',id};render()}}
function invite(id){const c=db.servers[id].code;navigator.clipboard?.writeText(c);modal(`<h2>Invite friends</h2><p class="mu">Send this code. They choose + then Join a server. Copied to your clipboard.</p><input readonly value="${c}" onclick="this.select()" style="font-size:20px;text-align:center;letter-spacing:3px"><button style="width:100%" onclick="closeModal()">Done</button>`)}
function roles(id){const s=db.servers[id];modal(`<h2>Roles</h2>${s.roles.map(r=>`<div class="row"><i class="sw" style="background:${r.color}"></i><span style="color:${r.color}">${esc(r.name)}</span><span class="sp"></span><button class="r" onclick="delRole('${id}','${r.id}')">Delete</button></div>`).join('')||'<p class="mu">No roles yet. Create one below, then right-click a member to assign it.</p>'}<hr><label>NEW ROLE</label><input id="rn" maxlength="24" placeholder="Role name"><div class="row"><input id="rc" type="color" value="#5865f2" style="height:40px;margin:0"><button id="ra">Add role</button></div>${s.bans.length?`<hr><label>BANNED</label>${s.bans.map(b=>`<div class="row"><span>${esc(b)}</span><span class="sp"></span><button class="g" onclick="unban('${id}','${b}')">Unban</button></div>`).join('')}`:''}`);
$('#ra').onclick=()=>{const n=$('#rn').value.trim();if(!n)return toast('Name the role');s.roles.push({id:rid(),name:n,color:$('#rc').value});save();roles(id);render()}}
const delRole=(id,r)=>{const s=db.servers[id];s.roles=s.roles.filter(x=>x.id!=r);for(const u in s.mr)s.mr[u]=s.mr[u].filter(x=>x!=r);save();roles(id);render()};
const unban=(id,u)=>{const s=db.servers[id];s.bans=s.bans.filter(x=>x!=u);save();roles(id)};
function kick(s,u,ban){s.members=s.members.filter(m=>m!=u);delete s.mr[u];if(ban)s.bans.push(u);save();toast((ban?'Banned ':'Kicked ')+u);render()}
const tmo=(s,u,min)=>{min?s.timeouts[u]=Date.now()+min*6e4:delete s.timeouts[u];save();toast(min?`Timed out ${u}`:'Timeout removed');render()};
function togRole(s,u,r){const a=s.mr[u]=s.mr[u]||[];a.includes(r)?a.splice(a.indexOf(r),1):a.push(r);save();render()}
const ctx={
friend:(e,u)=>{const b=U(me).blocked.includes(u);menu(e,[{l:'Message',f:()=>dm(u)},{l:'Profile',f:()=>showProfile(u)},'-',b?{l:'Unblock',f:()=>blk(u,0)}:{l:'Block',d:1,f:()=>blk(u,1)},...(!b&&U(me).friends.includes(u)?[{l:'Remove friend',d:1,f:()=>unf(u)}]:[])])},
srv:(e,id)=>{const s=db.servers[id],o=s.owner==me;menu(e,[{l:'Invite',f:()=>invite(id)},...(o?[{l:'Manage roles',f:()=>roles(id)},'-',{l:'Delete server',d:1,f:()=>{if(confirm('Delete this server for everyone?')){delete db.inv[s.code];delete db.servers[id];save();view={t:'friends',tab:'online'};render()}}}]:['-',{l:'Leave server',d:1,f:()=>{s.members=s.members.filter(m=>m!=me);save();render()}}])])},
mem:(e,u)=>{const s=db.servers[view.id];if(!s)return;const it=[{l:'Profile',f:()=>showProfile(u)}];
if(s.owner==me&&u!=me)it.push('-',...s.roles.map(r=>({l:`${(s.mr[u]||[]).includes(r.id)?'✓ ':''}Role: ${esc(r.name)}`,f:()=>togRole(s,u,r.id)})),'-',{l:'Timeout 5 minutes',f:()=>tmo(s,u,5)},{l:'Timeout 1 hour',f:()=>tmo(s,u,60)},{l:'Timeout 1 day',f:()=>tmo(s,u,1440)},{l:'Remove timeout',f:()=>tmo(s,u,0)},'-',{l:'Kick',d:1,f:()=>kick(s,u,0)},{l:'Ban',d:1,f:()=>kick(s,u,1)});
menu(e,it)}};

/* ---------- chat ---------- */
function chat(title,msgs,s,lock){const x=U(me),l=msgs.filter(m=>!x.blocked.includes(m.u));
return`<div class="top"><b>${title}</b></div><div id="msgs" class="msgs">${l.map((m,i)=>`<div class="msg ${i==l.length-1?'slide':''}"><span onclick="showProfile('${m.u}')">${av(m.u,40)}</span><div><b style="color:${rc(s,m.u)}">${dn(m.u)}</b> ${badges(m.u)}<span class="mu"> ${new Date(m.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span><div>${esc(m.x)}</div></div></div>`).join('')||'<p class="mu">This is the start of the conversation.</p>'}</div><div class="inw"><input id="inp" autocomplete="off" ${lock?'disabled':''} placeholder="${lock||'Message'}"></div>`}
function send(t){const m={u:me,x:t.slice(0,2000),ts:Date.now()};
if(view.t=='srv'){const s=db.servers[view.id];if(s.timeouts[me]>Date.now()||!s.members.includes(me))return;s.msgs.push(m);s.msgs=s.msgs.slice(-300)}
else{const o=view.id;if(U(me).blocked.includes(o)||U(o).blocked.includes(me))return;const k=[me,o].sort().join('|');(db.dms[k]=db.dms[k]||[]).push(m);db.dms[k]=db.dms[k].slice(-300)}
save();render();$('#inp')?.focus()}

/* ---------- main render ---------- */
function render(){if(!me||!U(me))return authView();
const iv=$('#inp')?.value,f=document.activeElement?.id=='inp';
if(view.t=='srv'){const s=db.servers[view.id];if(!s||!s.members.includes(me))view={t:'friends',tab:'online'}}
const x=U(me),s=db.servers[view.id];let m,side;
if(view.t=='srv'){m=chat('# general',s.msgs,s,s.timeouts[me]>Date.now()?'You are timed out':'');
side=`<div class="sh">${esc(s.name)}</div><div class="ch on"># general</div>${s.owner==me?`<div class="ch" onclick="roles('${view.id}')">⚙ Manage roles</div>`:''}`}
else{if(view.t=='dm'){const o=view.id,k=[me,o].sort().join('|');m=chat('@ '+dn(o),db.dms[k]||[],null,x.blocked.includes(o)?'You blocked this user':U(o).blocked.includes(me)?'You cannot message this user':'')}else m=friendsView();
side=`<div class="find">Find or start a conversation</div><div class="nav ${view.t=='friends'?'on':''}" onclick="view={t:'friends',tab:'online'};render()">👥 Friends</div><div class="mu" style="padding:14px 10px 4px">Direct messages</div>${x.friends.map(u=>`<div class="nav ${view.t=='dm'&&view.id==u?'on':''}" data-ctx="friend:${u}" onclick="dm('${u}')"><div class="avw">${av(u,32)}<i class="dot ${dot(u)}"></i></div>${dn(u)}</div>`).join('')}`}
const rail=`<div class="ri ${view.t!='srv'?'on':''}" onclick="view={t:'friends',tab:'online'};render()" title="Home">💬</div><hr class="rs">${Object.entries(db.servers).filter(([i,v])=>v.members.includes(me)).map(([i,v])=>`<div class="ri ${view.t=='srv'&&view.id==i?'on':''}" data-ctx="srv:${i}" onclick="view={t:'srv',id:'${i}'};render()" title="${esc(v.name)}">${v.icon?`<img src="${v.icon}">`:esc(v.name.slice(0,2))}</div>`).join('')}<div class="ri add" onclick="addServer()" title="Create or join a server">+</div>`;
const mem=view.t=='srv'?`<aside class="mem"><div class="mu" style="padding:0 8px 8px">Members: ${s.members.length}</div>${s.members.map(u=>`<div class="mrow ${online(u)?'':'offl'}" data-ctx="mem:${u}" onclick="showProfile('${u}')"><div class="avw">${av(u,32)}<i class="dot ${dot(u)}"></i></div><span style="color:${rc(s,u)}">${dn(u)}${u==s.owner?' 👑':''}</span></div>`).join('')}</aside>`:'';
$('#root').innerHTML=`<div id="app"><nav class="rail">${rail}</nav><aside class="side"><div class="sc">${side}</div><div class="up"><div id="upb" onclick="pop()"><div class="avw">${av(me,32)}<i class="dot ${dot(me)}"></i></div><div><b>${dn(me)}</b><span class="mu">${ST[x.status||'online']}</span></div></div></div></aside><main>${m}</main>${mem}</div>`;
const i=$('#inp');if(i){if(iv)i.value=iv;if(f)i.focus();i.onkeydown=e=>{const t=i.value.trim();if(e.key=='Enter'&&t){i.value='';send(t)}};const g=$('#msgs');g.scrollTop=g.scrollHeight}
$('#ab2')&&($('#ab2').onclick=addFriend,$('#af').onkeydown=e=>e.key=='Enter'&&addFriend())}
addEventListener('storage',e=>{if(e.key==K&&e.newValue){db=JSON.parse(e.newValue);render()}});
const beat=()=>{if(me){const s=seen();s[me]=Date.now();localStorage[SK]=JSON.stringify(s)}};beat();setInterval(beat,10000);
setInterval(()=>{if(me&&view.t=='friends'&&view.tab!='add')render()},20000);
render();
</script></body></html>
