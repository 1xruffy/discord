main=`<div class="top"><span style="color:var(--mu)">${ic(c.lock?'mega':'hash',22)}</span><b>${esc(c.n)}</b><span class="sp"></span><button class="ib ${muted[S]?'red':''}" onclick="muted['${S}']=!muted['${S}'];render()" title="Mute">${ic('bell',20)}</button><button class="ib ${onlyPins?'on':''}" onclick="onlyPins=!onlyPins;render()" title="Pinned only">${ic('pin',20)}</button><button class="ib" onclick="pinsModal()" title="Pins list">${ic('flag'in IC?'flag':'users',20)}</button><button class="ib ${showMem?'on':''}" onclick="showMem=!showMem;render()" title="Members">${ic('users',20)}</button><div class="srch">${ic('search',16)}<input id="fq" placeholder="Search ${esc(s.name)}" value="${esc(fq)}" oninput="fq=this.value;render()"></div></div><div id="msgs" class="msgs">${listH(arr,s,c)}</div>${composer(canPost(),canPost()?'Message #'+c.n:'Only certain roles can post in #'+c.n+'. You can still read and react.')}`;
side=`<div class="sh" onclick="srvMenu()" style="${s.banner?`background-image:linear-gradient(#0000,#000a),url(${esc(s.banner)})`:''}"><span class="ell">${esc(s.name)}</span>${ic('chev')}</div><button class="inv" style="width:100%" onclick="inviteCopy()">${ic('link',16)} Invite people</button>`+cats.map(cat=>`${cat?`<div class="cat" onclick="col['${esc(cat)}']=!col['${esc(cat)}'];render()">${ic(col[cat]?'chevr':'chev',12)} ${esc(cat)}</div>`:''}`+(col[cat]?'':chs().filter(k=>(k.cat||'')==cat).map(k=>`<div class="nav ${k.id==c.id?'on':''}" onclick="go({t:'srv',s:'${S}',c:'${k.id}'})">${ic(k.lock?'mega':'hash',18)} <span class="ell sp">${esc(k.n)}</span>${k.lock?ic('lock',12):''}</div>`).join(''))).join('');
const mm=s.members.filter(u=>U(u)&&!banned(u)),ver=s.ver||[],bt=u=>U(u).b?.includes('bot'),
row=u=>`<div class="mrow ${online(u)?'':'offl'}" onclick="prof('${u}',event)"><div class="avw">${av(u,34)}<i class="dot ${online(u)?'on':''}"></i></div><div style="min-width:0" class="ell"><div class="ell">${nameH(u)}</div>${U(u).status?`<div class="st ell">${esc(U(u).status)}</div>`:''}</div></div>`;
if(showMem)mem='<aside class="mem">'+[['OWNER',u=>u==s.owner],['ADMIN',u=>u!=s.owner&&isA(u)],['BOTS',u=>bt(u)&&u!=s.owner&&!isA(u)],['VERIFIED',u=>ver.includes(u)&&u!=s.owner&&!isA(u)&&!bt(u)],['MEMBERS',u=>!ver.includes(u)&&u!=s.owner&&!isA(u)&&!bt(u)]].map(([n,fn])=>{const l=mm.filter(fn).sort((a,b)=>online(b)-online(a));return l.length?`<div class="mg">${n} — ${l.length}</div>`+l.map(row).join(''):''}).join('')+'</aside>'}
else{if(view.t=='dm'){const o=view.id,arr=db.dms[dmk(o)]||[];main=`<div class="top">${av(o,26)}<b>${dn(o)}</b>${tags(o)}<span class="sp"></span><div class="srch">${ic('search',16)}<input id="fq" placeholder="Search" value="${esc(fq)}" oninput="fq=this.value;render()"></div></div><div id="msgs" class="msgs">${listH(arr,s,null)||'<p class="mu" style="padding:16px">This is the start of the conversation.</p>'}</div>${composer(o!=BOT,o==BOT?'You cannot reply to this account':'Message @'+o)}`}
else main=friendsView();
const dl=dmList().sort((a,b)=>{const l=u=>(db.dms[dmk(u)]||[]).slice(-1)[0]?.ts||0;return l(b)-l(a)});
side=`<div class="sh">Direct messages</div><div class="nav ${view.t=='home'?'on':''}" onclick="go({t:'home'})">${ic('users')} Friends</div><div class="cat" style="cursor:default">DIRECT MESSAGES</div>`+dl.map(u=>{const n=unread(u);return`<div class="nav ${view.t=='dm'&&view.id==u?'on':''} ${n?'u':''}" onclick="dm('${u}')"><div class="avw">${av(u,28)}<i class="dot ${online(u)?'on':''}"></i></div><span class="ell sp">${dn(u)}</span>${n?`<span class="nb" style="position:static;border:0">${n}</span>`:''}</div>`}).join('')}
const srvs=Object.entries(db.servers).filter(([,v])=>v.members.includes(me));
$('#root').innerHTML=`<div id="app"><nav class="rail"><div class="ri home ${view.t!='srv'?'on':''}" onclick="go({t:'home'})" title="Home">${bear(30)}${T?`<span class="nb">${T}</span>`:''}</div><div class="rs"></div>${srvs.map(([id,v])=>`<div class="ri ${view.t=='srv'&&S==id?'on':''}" onclick="go({t:'srv',s:'${id}',c:'general'})" title="${esc(v.name)}">${v.banner&&id!=SID?`<img src="${esc(v.banner)}">`:id==SID?bear(28):esc(v.name[0].toUpperCase())}</div>`).join('')}<div class="ri gn" onclick="newSrv()" title="Create or join">${ic('plus',24)}</div><div class="ri gn" onclick="discover()" title="Explore">${ic('compass',24)}</div></nav><aside class="side">${side}</aside><main>${main}</main>${mem}
<div class="up"><div class="avw" style="cursor:pointer" onclick="prof('${me}',event)">${av(me,36)}<i class="dot on"></i></div><div style="min-width:0;flex:1"><b class="ell" style="display:block">${dn(me)}</b><span class="mu ell" style="display:block">${esc(x.status||'Online')}</span></div><button class="ib" onclick="settings()" title="Settings">${ic('gear',20)}</button><button class="ib" onclick="logout()" title="Log out">${ic('power',20)}</button></div></div>`;
const i=$('#inp');if(i){if(aid=='inp'&&aval)i.value=aval;if(aid=='inp')i.focus();
i.onkeydown=e=>{if(e.key=='Enter'&&!e.shiftKey){e.preventDefault();sendNow()}};
i.onpaste=e=>{const it=[...(e.clipboardData?.items||[])].find(y=>y.type.startsWith('image/'));if(it){e.preventDefault();stage(it.getAsFile());toast('Image pasted — press send')}};
const fl=$('#fl');fl.onchange=()=>{stage(fl.files[0]);fl.value=''};showRep()}
const g=$('#msgs');if(g&&!fq)g.scrollTop=g.scrollHeight;
if(aid=='fq'||aid=='af'){const e2=$('#'+aid);if(e2){e2.value=aval;e2.focus();try{e2.setSelectionRange(asel,asel)}catch{}}}}
boot();
</script></body></html>
