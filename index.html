/* Phase 1: Profiles */
.av-dec-gradient{box-shadow:0 0 0 2.5px #ff5a36,0 0 10px #a855f7;animation:ringGlow 3s ease infinite alternate}
.av-dec-neon{box-shadow:0 0 0 2.5px #00f0ff,0 0 12px #00f0ff,0 0 20px #00b4d8;animation:neonPulse 2s ease-in-out infinite alternate}
.av-dec-flame{box-shadow:0 0 0 2.5px #ff4500,0 0 12px #ff8c00,0 0 20px #e63946;animation:flamePulse 1.5s ease-in-out infinite alternate}
.av-dec-sparkle{box-shadow:0 0 0 2.5px #ffd700,0 0 12px #ffc300,0 0 18px #ffd700;animation:sparklePulse 2s ease-in-out infinite alternate}
.av-dec-cyber{box-shadow:0 0 0 2.5px #ff007f,0 0 12px #00f0ff,0 0 20px #ff007f;animation:cyberGlow 2.5s ease-in-out infinite alternate}
.av-dec-sakura{box-shadow:0 0 0 2.5px #ffb7b2,0 0 12px #ff9aa2,0 0 18px #ffb7b2;animation:sakuraFloat 3s ease-in-out infinite alternate}
.av-dec-toxic{box-shadow:0 0 0 2.5px #39ff14,0 0 12px #39ff14,0 0 20px #1fa50e;animation:toxicPulse 2s ease-in-out infinite alternate}
.av-dec-cosmic{box-shadow:0 0 0 2.5px #9d4edd,0 0 14px #7b2cbf,0 0 24px #3c096c;animation:cosmicPulse 3s ease-in-out infinite alternate}
.av-dec-royal{box-shadow:0 0 0 2.5px #f7c948,0 0 12px #c99700;animation:goldShine 2.5s ease-in-out infinite alternate}
.av-dec-frost{box-shadow:0 0 0 2.5px #e0f2fe,0 0 12px #38bdf8,0 0 22px #0284c7;animation:frostGlow 2.5s ease-in-out infinite alternate}

@keyframes neonPulse{from{box-shadow:0 0 0 2px #00f0ff,0 0 8px #00f0ff}to{box-shadow:0 0 0 3.5px #00f0ff,0 0 16px #00f0ff,0 0 26px #00b4d8}}
@keyframes flamePulse{from{box-shadow:0 0 0 2px #ff4500,0 0 8px #ff8c00}to{box-shadow:0 0 0 3.5px #ff3300,0 0 18px #ff7700,0 0 28px #ff0000}}
@keyframes sparklePulse{from{box-shadow:0 0 0 2px #ffd700,0 0 8px #ffae00}to{box-shadow:0 0 0 3.5px #fff,0 0 16px #ffd700,0 0 24px #ffc300}}
@keyframes ringGlow{from{box-shadow:0 0 0 2.5px #ff5a36,0 0 8px #ff5a36}to{box-shadow:0 0 0 3.5px #a855f7,0 0 16px #a855f7}}
@keyframes cyberGlow{from{box-shadow:0 0 0 2px #ff007f,0 0 10px #00f0ff}to{box-shadow:0 0 0 3.5px #00f0ff,0 0 18px #ff007f}}
@keyframes sakuraFloat{from{box-shadow:0 0 0 2px #ffb7b2,0 0 8px #ff9aa2}to{box-shadow:0 0 0 3.5px #ff9aa2,0 0 16px #ffb7b2}}
@keyframes toxicPulse{from{box-shadow:0 0 0 2px #39ff14,0 0 8px #39ff14}to{box-shadow:0 0 0 3.5px #39ff14,0 0 18px #39ff14,0 0 28px #20cc00}}
@keyframes cosmicPulse{from{box-shadow:0 0 0 2px #9d4edd,0 0 10px #7b2cbf}to{box-shadow:0 0 0 3.5px #c77dff,0 0 20px #9d4edd,0 0 30px #3c096c}}
@keyframes goldShine{from{box-shadow:0 0 0 2.5px #f7c948,0 0 8px #c99700}to{box-shadow:0 0 0 3.5px #ffd700,0 0 18px #f7c948}}
@keyframes frostGlow{from{box-shadow:0 0 0 2px #e0f2fe,0 0 8px #38bdf8}to{box-shadow:0 0 0 3.5px #bae6fd,0 0 18px #0284c7}}

.pfx-overlay{position:absolute;inset:0;pointer-events:none;border-radius:inherit;overflow:hidden;z-index:1}
.pfx-sparkles{background-image:radial-gradient(circle,#ffd700 1.5px,transparent 1.5px),radial-gradient(circle,#ffffff 2px,transparent 2px),radial-gradient(circle,#ffae00 1.5px,transparent 1.5px);background-size:90px 90px,140px 140px,110px 110px;animation:pfxSparkle 5s ease-in-out infinite alternate}
.pfx-snow{background-image:radial-gradient(circle,#ffffff 1.8px,transparent 1.8px),radial-gradient(circle,#ffffffa0 2.2px,transparent 2.2px);background-size:120px 120px,180px 180px;animation:pfxSnow 7s linear infinite}
.pfx-hearts{background-image:radial-gradient(circle,#ff4d6d 2px,transparent 2px),radial-gradient(circle,#ff758f 2.5px,transparent 2.5px);background-size:80px 80px,120px 120px;animation:pfxHearts 6s linear infinite}
.pfx-fireflies{background-image:radial-gradient(circle,#ccff00 2.5px,transparent 3px),radial-gradient(circle,#99ff33 2.5px,transparent 3.5px);background-size:110px 110px,150px 150px;animation:pfxFireflies 4s ease-in-out infinite alternate}
.pfx-matrix{background:linear-gradient(180deg,rgba(0,255,100,0) 0%,rgba(0,255,100,0.08) 80%,rgba(0,255,100,0.18) 100%),repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,255,70,0.12) 3px,rgba(0,255,70,0.12) 6px);animation:pfxScan 9s linear infinite}

@keyframes pfxSparkle{from{transform:translateY(0) scale(1)}to{transform:translateY(-12px) scale(1.05)}}
@keyframes pfxSnow{from{background-position:0 0,0 0}to{background-position:30px 240px,-20px 360px}}
@keyframes pfxHearts{from{background-position:0 0,0 0}to{background-position:-20px -200px,30px -300px}}
@keyframes pfxFireflies{from{opacity:.4;transform:scale(.98)}to{opacity:.9;transform:scale(1.04)}}
@keyframes pfxScan{from{background-position:0 0}to{background-position:0 300px}}
.noanim .pfx-overlay{display:none!important}

.pronoun-pill{display:inline-block;background:#ffffff1f;color:var(--mu);border-radius:10px;padding:1px 8px;font-size:11px;font-weight:600;vertical-align:middle;margin-left:4px}
.role-chip{display:inline-flex;align-items:center;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:700}
.prof-tabs{display:flex;gap:6px;border-bottom:1px solid rgba(255,255,255,0.1);margin-bottom:14px}
.prof-tab{padding:6px 14px;border-radius:8px 8px 0 0;cursor:pointer;font-weight:700;font-size:13px;color:var(--mu);transition:.15s}
.prof-tab:hover{color:var(--tx);background:#ffffff0d}
.prof-tab.on{color:#fff;border-bottom:2px solid var(--br);background:#ffffff14}
.prof-link-chip{display:inline-flex;align-items:center;gap:6px;background:#00000044;border:1px solid var(--line);border-radius:8px;padding:5px 10px;color:var(--tx);font-size:12px;text-decoration:none}
.prof-link-chip:hover{background:#ffffff14;color:#fff}
.note-inp{background:#00000033;border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--tx);resize:vertical;min-height:54px;margin:4px 0 0;width:100%}
.note-inp:focus{border-color:var(--br)}
.act-banner{background:#00000044;border-radius:10px;padding:8px 12px;margin-top:8px;font-size:13px;display:flex;align-items:center;gap:8px}
.full-prof-card{box-shadow:0 20px 60px #000c}

/* Phase 2: Links, Embeds & Leave Warning */
.leave-url-box{overflow-wrap:anywhere;background:var(--input-bg);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;margin:12px 0;font-family:monospace;line-height:1.4}
.leave-risk-banner{background:#da373c22;border:1px solid #da373c;border-radius:8px;padding:10px 12px;margin:12px 0;display:flex;align-items:center;gap:10px;color:#ff8589;font-size:13px;line-height:1.4}
.yt-thumb-wrap{position:relative;cursor:pointer;border-radius:8px;overflow:hidden;max-width:400px;background:#000}
.yt-play-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:52px;height:36px;border-radius:10px;background:rgba(0,0,0,0.75);display:grid;place-items:center;color:#fff;transition:.15s}
.yt-thumb-wrap:hover .yt-play-btn{transform:translate(-50%,-50%) scale(1.1);background:#ff0000}
.emb-close{position:absolute;top:6px;right:8px;background:none;border:0;color:var(--mu);font-size:16px;cursor:pointer;padding:2px 6px;opacity:0;transition:.15s;border-radius:4px;line-height:1}
.emb:hover .emb-close,.embed-item:hover .emb-close{opacity:1}
.emb-close:hover{background:#ffffff1f;color:#fff}
.embed-orig-link{font-size:11px;margin-top:3px;display:inline-flex;align-items:center;gap:4px;text-decoration:none}
.embed-orig-link:hover{text-decoration:underline;color:var(--tx)}

/* Phase 3: Chat Features */
.jump-present{position:fixed;right:270px;bottom:80px;background:var(--pop);border:1px solid var(--line);border-radius:20px;padding:6px 14px;cursor:pointer;font-size:12px;font-weight:700;color:#fff;box-shadow:0 4px 16px #000a;display:inline-flex;align-items:center;gap:6px;z-index:25;transition:.15s}
.jump-present:hover{background:var(--br)}
.thread-badge{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 10px;margin-top:6px;cursor:pointer;font-size:12px;color:var(--tx)}
.thread-badge:hover{background:var(--card2);border-color:var(--br)}
.thread-panel{width:320px;flex:none;background:var(--side);border-left:1px solid var(--line);display:flex;flex-direction:column}
.poll-card{background:var(--card);border-left:4px solid var(--br);border-radius:10px;padding:12px 14px;margin-top:6px;max-width:440px}
.ch-mention{background:#ff5a3622;color:#ff8a70;border-radius:4px;padding:1px 5px;font-weight:600;cursor:pointer}
.ch-mention:hover{background:#ff5a3644;color:#fff}
.role-mention{border-radius:4px;padding:1px 5px;font-weight:700}
.audio-msg{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:6px;width:fit-content;min-width:240px;max-width:360px}
.audio-msg button{width:32px;height:32px;padding:0;border-radius:50%;flex:none}
.audio-prog-bar{flex:1;height:6px;background:#ffffff22;border-radius:3px;overflow:hidden;cursor:pointer}
.audio-fill{height:100%;width:0;background:var(--br);transition:width .1s linear}
.stk-msg{display:inline-block;margin-top:6px;cursor:pointer;max-width:160px;max-height:160px}
.stk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;max-height:280px;overflow-y:auto;padding:8px 0}
.stk-item{border-radius:8px;padding:6px;cursor:pointer;display:grid;place-items:center;transition:.15s}
.stk-item:hover{background:#ffffff14;transform:scale(1.08)}

function cleanUrlAndTrailing(rawUrl){
  let url=rawUrl,trailing='';
  while(url.length&&/[.,;?!:)\]]$/.test(url)){
    if(url.endsWith(')')){
      const oc=(url.match(/\(/g)||[]).length,cc=(url.match(/\)/g)||[]).length;
      if(oc>=cc)break;
    }
    trailing=url.slice(-1)+trailing;url=url.slice(0,-1);
  }
  return{url,trailing};
}

function fmt(t,u,s){
  let raw=esc(t);const cb=[],icd=[],lks=[],ems=[];
  raw=raw.replace(/```(?:[a-z0-9_-]+)?\n?([\s\S]*?)```/g,(a,b)=>{cb.push(b);return `\x00CB${cb.length-1}\x00`});
  raw=raw.replace(/`([^`\n]+)`/g,(a,b)=>{icd.push(b);return `\x00IC${icd.length-1}\x00`});
  raw=raw.replace(/\|\|([\s\S]+?)\|\|/g,'<span class="spoiler" onclick="this.classList.toggle(\'revealed\')">$1</span>');
  raw=raw.replace(/(?:^|\n)&gt; (.*)/g,'<blockquote class="quote">$1</blockquote>'); raw=raw.replace(/(?:^|\n)#{1}\s+([^\n]+)/g,'<div class="md-h1">$1</div>'); raw=raw.replace(/(?:^|\n)#{2}\s+([^\n]+)/g,'<div class="md-h2">$1</div>'); raw=raw.replace(/(?:^|\n)#{3}\s+([^\n]+)/g,'<div class="md-h3">$1</div>');
  raw=raw.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
  raw=raw.replace(/__([^_\n]+)__/g,'<u>$1</u>');
  raw=raw.replace(/\*([^*\n]+)\*/g,'<i>$1</i>');
  raw=raw.replace(/~~([^~\n]+)~~/g,'<s>$1</s>');
  raw=raw.replace(/@(everyone|[\w.-]{1,32})/g,(a,n)=>{
  if(n.toLowerCase()=='everyone'||resolveMentionName(n))return `<span class="mn">${a}</span>`;
  if(s&&db.servers[s]){
    const sObj=db.servers[s];
    const r=(sObj.roles||[]).find(rl=>rl.name.toLowerCase()===n.toLowerCase());
    if(r&&(r.mentionable||isA(me)||sObj.owner===me))return `<span class="role-mention" style="color:${esc(r.color||'#ff8a70')};background:${esc(r.color||'#ff8a70')}22">@${esc(r.name)}</span>`;
  }
  return a;
});
if(s&&db.servers[s]){
  raw=raw.replace(/#([\w-]{1,32})/g,(a,cn)=>{
    const chObj=(db.servers[s].ch||[]).find(c=>c.t==='t'&&c.n.toLowerCase()===cn.toLowerCase());
    if(chObj)return `<span class="ch-mention" onclick="go({t:'srv',s:'${s}',c:'${chObj.id}'})">#${esc(chObj.n)}</span>`;
    return a;
  });
}
  raw=raw.replace(/:(\w{2,32}):/g,(a,n)=>{if(EURL[n]){ems.push(eimg(n));return `\x00EM${ems.length-1}\x00`;}const e=emFor(u,s,n);if(e){ems.push(`<img class="em" src="${esc(e)}" alt=":${esc(n)}:" title=":${esc(n)}:">`);return `\x00EM${ems.length-1}\x00`;}return a;});
  
  // 1. memocord.invite links
  raw=raw.replace(/(?:https?:\/\/)?memocord\.invite\/([\w-]{2,40})/gi,(a,c)=>{
    lks.push(`<a onclick="joinInvite('${c}')">${a}</a>`);
    return `\x00LK${lks.length-1}\x00`;
  });

  // 2. Markdown links: [label](url)
  raw=raw.replace(/\[([^\]]+)\]\((https?:\/\/[^\s\)]+)\)/gi,(match,lbl,dest)=>{
    const c=cleanUrlAndTrailing(dest);
    if(!/^https?:\/\//i.test(c.url))return match;
    let maskAttr='';
    const cleanLbl=lbl.toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').split('/')[0];
    if(cleanLbl.includes('.')){
      try{
        const destHost=new URL(c.url).hostname.toLowerCase().replace(/^www\./,'');
        if(cleanLbl!==destHost)maskAttr=` data-masked-label="${esc(lbl)}"`;
      }catch{}
    }
    lks.push(`<a href="${esc(c.url)}" target="_blank" rel="noopener noreferrer nofollow ugc"${maskAttr}>${lbl}</a>`+c.trailing);
    return `\x00LK${lks.length-1}\x00`;
  });

  // 3. Suppressed embed links: <url> (which became &lt;url&gt;)
  raw=raw.replace(/&lt;(https?:\/\/[^\s&]+)&gt;/gi,(match,u0)=>{
    const c=cleanUrlAndTrailing(u0);
    if(!/^https?:\/\//i.test(c.url))return match;
    lks.push(`<a href="${esc(c.url)}" target="_blank" rel="noopener noreferrer nofollow ugc" data-no-embed="true">${esc(c.url)}</a>`+c.trailing);
    return `\x00LK${lks.length-1}\x00`;
  });

  // 4. Bare www. links
  raw=raw.replace(/(^|[\s(])www\.([a-z0-9-]+(?:\.[a-z0-9-]+)+(?:[^\s<"'>]*[^\s<"'`.,;?!:())(])?)/gi,(match,pfx,rest)=>{
    const c=cleanUrlAndTrailing('https://www.'+rest);
    lks.push(`<a href="${esc(c.url)}" target="_blank" rel="noopener noreferrer nofollow ugc">www.${esc(c.url.replace(/^https:\/\/www\./,''))}</a>`+c.trailing);
    return pfx+`\x00LK${lks.length-1}\x00`;
  });

  // 5. Raw http(s) links
  raw=raw.replace(/(https?:\/\/[^\s<"'>]+[^\s<"'`.,;?!:())(])/gi,match=>{
    const c=cleanUrlAndTrailing(match);
    if(!/^https?:\/\//i.test(c.url))return match;
    lks.push(`<a href="${esc(c.url)}" target="_blank" rel="noopener noreferrer nofollow ugc">${esc(c.url)}</a>`+c.trailing);
    return `\x00LK${lks.length-1}\x00`;
  });

  // Restore links, codeblocks and inline code
  raw=raw.replace(/\x00LK(\d+)\x00/g,(a,i)=>lks[+i]); raw=raw.replace(/\x00EM(\d+)\x00/g,(a,i)=>ems[+i]);
  raw=raw.replace(/\x00CB(\d+)\x00/g,(a,i)=>`<pre class="codeblock"><code>${cb[+i]}</code></pre>`);
  raw=raw.replace(/\x00IC(\d+)\x00/g,(a,i)=>`<code class="inlinecode">${icd[+i]}</code>`);
  return raw;
}
function extractUrls(text){
  if(!text)return[];
  const suppressed=new Set();
  for(const m of String(text).matchAll(/<(https?:\/\/[^\s>]+)>/gi)){
    suppressed.add(m[1].toLowerCase());
  }
  const found=[];
  for(const m of String(text).matchAll(/(https?:\/\/[^\s<"'>]+[^\s<"'`.,;?!:())(])/gi)){
    const u=m[1].replace(/[.,;?!:)\]]+$/,'');
    if(!suppressed.has(u.toLowerCase())&&!found.includes(u)){
      found.push(u);
    }
  }
  return found.slice(0,3);
}

async function saveServerProfile(sid0){
  const s=db.servers[sid0];if(!s)return;
  s.profiles=s.profiles||{};s.profiles[me]=s.profiles[me]||{};
  const n=($('#esNick')?.value||'').trim().slice(0,32);

function friendsView(){const x=U(me),t=view.tab||'online';
const pendingCount=(x.freq_in||[]).length;
const tabs=[['online','Online'],['all','All'],['pending','Pending'+(pendingCount?` (${pendingCount})`:'')],['suggested','Suggested'],['blocked','Blocked']].map(([k,label])=>`<span class="tab ${t==k?'on':''}" onclick="view.tab='${k}';render()">${label}</span>`).join('');let b;
if(t=='add')b=`<h2>Add Friend</h2><p class="mu" style="margin-bottom:12px">You can add friends with their Memocord username.</p><div class="row"><input id="af" placeholder="Enter a username"><button onclick="sendFriendReq($('#af').value.trim())">Send Friend Request</button></div>`;
else if(t=='pending'){const inc=x.freq_in||[],out=x.freq_out||[];b=`<div class="mu" style="font-weight:700;padding-bottom:10px">INCOMING - ${inc.length}</div>`+(inc.map(u=>`<div class="fr" data-ctx="usr:${u}" onclick="prof('${u}',event)"><div class="avw">${av(u,40)}<i class="${dotCls(u)}"></i></div><div>${nameH(u)}<div class="mu">@${esc(u)}</div></div><span class="sp"></span><button class="gr" onclick="event.stopPropagation();acceptFriendReq('${u}')">Accept</button><button class="g" onclick="event.stopPropagation();declineFriendReq('${u}')">Decline</button></div>`).join('')||'<p class="mu" style="margin-bottom:20px">No incoming friend requests.</p>')+`<hr><div class="mu" style="font-weight:700;padding:10px 0">OUTGOING - ${out.length}</div>`+(out.map(u=>`<div class="fr" data-ctx="usr:${u}" onclick="prof('${u}',event)"><div class="avw">${av(u,40)}<i class="${dotCls(u)}"></i></div><div>${nameH(u)}<div class="mu">@${esc(u)}</div></div><span class="sp"></span><button class="g" onclick="event.stopPropagation();cancelFriendReq('${u}')">Cancel Request</button></div>`).join('')||'<p class="mu">No outgoing friend requests.</p>');}
else if(t=='blocked'){const bl=x.blocked||[];b=`<div class="mu" style="font-weight:700;padding-bottom:10px">BLOCKED USERS - ${bl.length}</div>`+(bl.map(u=>`<div class="fr" data-ctx="usr:${u}" onclick="prof('${u}',event)"><div class="avw">${av(u,40)}</div><div>${nameH(u)}<div class="mu">@${esc(u)}</div></div><span class="sp"></span><button class="r" onclick="event.stopPropagation();unblockUser('${u}')">Unblock</button></div>`).join('')||'<p class="mu">No blocked users.</p>');}

  `).join('')||'<p class="mu">No friend suggestions found from shared servers.</p>');

else{const l=(x.friends||[]).filter(u=>U(u)&&(t!='online'||online(u)));b=`<div class="mu" style="font-weight:700;padding-bottom:10px">${t.toUpperCase()} - ${l.length}</div>`+(l.map(u=>{

}).join('')||'<p class="mu">Nobody here yet.</p>')}
return`<div class="top"><button class="ib mobile-btn" onclick="toggleMobileSidebar()">${ic('menu',20)}</button><b>Friends</b>${tabs}<span class="tab add ${t=='add'?'on':''}" onclick="view.tab='add';render()">Add Friend</span></div><div class="fl">${b}</div>`}

function listH(arr,s,c){let last='',prev=null,out='';for(const m of arr){if(!U(m.u)||isBlocked(m.u,me))continue;if(fq&&!msgMatchesFilter(m,fq,s,c))continue;const d=new Date(m.ts).toDateString();let chg=false;if(d!=last){last=d;chg=true;out+=`<div class="dd">${dayf(m.ts)}</div>`}const fol=!chg&&prev&&prev.u===m.u&&!m.re&&!prev.em&&!m.em&&!m.g&&!prev.g&&!m.btn&&!prev.btn&&(m.ts-prev.ts<300000);out+=msgH(m,s,fol);prev=m}

  return`<div class="top">${head}</div><div style="flex:1;display:flex;min-height:0;position:relative"><div id="msgs" class="msgs">${listH(msgsList,s,c)}</div>${renderThreadPanel(s,c)}<button id="jumpPresent" class="jump-present" onclick="jumpToPresent()" style="display:none">${ic('chev',16)} Jump to present</button></div>${comp}`}
function react(ts,e){const m=findMsg(ts);if(!m)return;m.r=m.r||{};const a=m.r[e]=m.r[e]||[];a.includes(me)?a.splice(a.indexOf(me),1):a.push(me);save();render()}
function delMsg(ts){const a=msgArr(),i=a.findIndex(m=>String(m.ts)==String(ts));if(i<0)return;const m=a[i];const canDel=m.u===me||isMod()||(view.t==='srv'&&(cs()?.owner===me||perm(cs(),me,null,'manage_messages')));if(!canDel)return toast('You can only delete your own messages');const previewTxt=esc(m.x||m.em?.t||(m.audio?'Voice message':m.img?'Image':'Attachment')).slice(0,180);modal(`<h2>Delete Message</h2><p class="mu" style="margin-bottom:14px">Are you sure you want to delete this message? This cannot be undone.</p><div class="ac" style="padding:10px 14px;border-left:3px solid var(--br);margin-bottom:18px;max-height:120px;overflow-y:auto"><b>${dn(m.u)}</b> <span class="mu" style="font-size:12px;margin-left:4px">${tsf(m.ts)}</span><div style="margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere">${previewTxt}</div></div><div class="row" style="justify-content:flex-end;gap:10px"><button class="g" onclick="closeModal()">Cancel</button><button class="r" onclick="confirmDelMsg('${ts}')">Delete</button></div>`,420);}

function verify(id){const s=db.servers[id||sid()];if(!s)return;s.ver=s.ver||[];if(s.ver.includes(me))return;s.ver.push(me);save();render();toast('You are verified!')}
function addMsg(m){
  const a=msgArr();
  if(view.t=='srv'){
    const c=ch(),s=cs();
    if(isTimedOut(s,me)){toast('You are currently timed out in this server.');return false;}
    if(s?.automod?.enabled&&!isStaff(s,me)){
      const am=s.automod,txt=(m.x||'').toLowerCase();
      const badWord=(am.words||[]).find(w=>w&&txt.includes(w));
      if(badWord){
        if(am.action==='timeout'){s.timeouts=s.timeouts||{};s.timeouts[me]=Date.now()+600000;save();render();}
        if(am.action==='warn'){db.userWarnings=db.userWarnings||{};db.userWarnings[me]=db.userWarnings[me]||[];db.userWarnings[me].push({by:'AutoMod',reason:'Blocked word: '+badWord,ts:Date.now()});save();}
        toast('Message blocked by AutoMod (prohibited word).');
        return false;
      }
      const urls=extractUrls(m.x||'');
      if(urls.length&&am.linkFilter!=='off'){
        if(am.linkFilter==='all'){toast('Message blocked by AutoMod (links not allowed).');return false;}
        if(am.linkFilter==='whitelist'){
          const allowed=(am.whitelist||[]).map(d=>d.toLowerCase());
          const disallowed=urls.some(u=>{try{return!allowed.includes(new URL(u).hostname.toLowerCase().replace(/^www\./,''))}catch{return true;}});
          if(disallowed){toast('Message blocked by AutoMod (link domain not whitelisted).');return false;}
        }
      }
      const myRecent=(s.msgs[c.id]||[]).filter(x=>x.u===me&&Date.now()-x.ts<10000);
      if(myRecent.length>=(am.spamLimit||5)){toast('Slow down! You are sending messages too quickly.');return false;}
    }
    if(c.lock&&!(isA(me)||s.owner==me||perm(s,me,null,'manage_channels'))){toast('Only admins can post in #'+c.n);return false;}
    if(!perm(s,me,c.id,'s')){toast('You do not have permission to type here');return false;}
    if(/@everyone/.test(m.x||'')&&!(isA(me)||s.owner==me||perm(s,me,null,'mention_everyone'))){toast('Only admins can use @everyone');return false;}
    if(c.slowmode&&!(isA(me)||s.owner==me||perm(s,me,null,'manage_messages'))){
      const myPrev=(s.msgs[c.id]||[]).filter(x=>x.u===me).slice(-1)[0];
      if(myPrev&&Date.now()-myPrev.ts<c.slowmode*1000){
        const left=Math.ceil((c.slowmode*1000-(Date.now()-myPrev.ts))/1000);
        toast('Slowmode is active. Wait '+left+'s to post again.');
        return false;
      }
    }
  }
  if(view.t=='dm'){
    if(isBlocked(view.id,me)){toast('You have blocked this user');return false;}
    if(isBlocked(me,view.id)){toast('Cannot send message to this user');return false;}
    if(view.id==BOT){toast('You cannot reply to this account');return false;}
  }
  a.push(m);
  if(a.length>L.keep){
    let over=a.length-L.keep;
    for(let i=0;i<a.length&&over>0;i++){
      if(!a[i].pin){a.splice(i,1);i--;over--;}
    }
  }
  save();render();
  return true;
}

async function sendNow(){
  if(isSending)return;
  const i=$('#inp');if(!i||i.disabled)return;
  let t=i.value.trim();
  if(editingTs){
    const m=findMsg(editingTs);
    if(m&&m.u===me){
      if(!t&&!m.img&&!m.imgs?.length)return delMsg(editingTs);
      const newX=t.slice(0,L.msg);
      if(newX!==m.x){m.x=newX;m.ed=Date.now();save();}
    }
    editingTs=null;i.value='';render();return;
  }
  if(!t&&!pends.length)return;
  if(!pends.length&&t[0]==='!'){i.value='';return cmd(t);}
  if(!pends.length&&t[0]==='/'){
    if(/^\/poll\b/i.test(t)){i.value='';return pollCmd(t);}
    if(/^\/giveaway\b/i.test(t)){i.value='';return giveCmd(t);}
    if(/^\/(embed|verify)\b/i.test(t)){i.value='';return slash(t);}
    if(/^\/shrug\b/i.test(t)){t=t.replace(/^\/shrug\s*/i,'')+' \u00AF\\_(\u30C4)_/\u00AF';}
    else if(/^\/tableflip\b/i.test(t)){t=t.replace(/^\/tableflip\s*/i,'')+' (\u256F\u00B0\u25A1\u00B0)\u256F\uFE35 \u253B\u2501\u253B';}
    else if(/^\/unflip\b/i.test(t)){t=t.replace(/^\/unflip\s*/i,'')+' \u252C\u2500\u252C\u30CE( \u00BA _ \u00BA\u30CE)';}
    else if(/^\/me\b/i.test(t)){t='*'+dn(me)+' '+t.replace(/^\/me\s*/i,'')+'*';}
    else if(/^\/spoiler\b/i.test(t)){t='||'+t.replace(/^\/spoiler\s*/i,'')+'||';}
  }
  isSending=true;
  try{

function pollCmd(t){
  const parts=t.slice(5).split('|').map(s=>s.trim()).filter(Boolean);
  if(parts.length<3)return toast('Usage: /poll Question | Option 1 | Option 2 [| 1h/4h/1d]');
  const q=parts[0];let duration=0;
  const last=parts[parts.length-1];let opts=parts.slice(1);
  if(/^(\d+)([hmwd])$/i.test(last)){
    const mt=/^(\d+)([hmwd])$/i.exec(last);
    duration=(+mt[1])*{h:36e5,m:6e4,d:864e5,w:6048e5}[mt[2].toLowerCase()];
    opts=parts.slice(1,-1);
  }
  if(opts.length<2)return toast('Poll needs at least 2 options');
  const poll={q:q.slice(0,100),opts:opts.slice(0,10).map(o=>({t:o.slice(0,50),v:[]})),end:duration?Date.now()+duration:0,by:me};
  addMsg({u:me,ts:Date.now(),poll});
}

// 7. Voice Messages
let mediaRec=null,audioChunks=[],recTimer=null,recStart=0;
async function toggleVoiceRec(){
  if(mediaRec&&mediaRec.state==='recording'){
    stopVoiceRec(true);
    return;
  }
  if(!navigator.mediaDevices?.getUserMedia)return toast('Voice recording is not supported in this browser');
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    audioChunks=[];
    mediaRec=new MediaRecorder(stream);
    mediaRec.ondataavailable=e=>{if(e.data?.size)audioChunks.push(e.data);};
    mediaRec.onstop=async()=>{
      stream.getTracks().forEach(tr=>tr.stop());
      clearInterval(recTimer);
      $('#voicePill')?.remove();
      if(!audioChunks.length)return;
      const blob=new Blob(audioChunks,{type:'audio/webm'});
      try{
        toast('Uploading voice message...');
        const url=await uploadBlob(blob,'messages','webm');
        addMsg({u:me,ts:Date.now(),audio:url});
      }catch(err){toast('Voice upload failed.');}
    };
    mediaRec.start();
    recStart=Date.now();
    showVoicePill();
    recTimer=setInterval(updateVoiceTimer,500);
  }catch(err){toast('Microphone permission denied.');}
}

function showVoicePill(){
  $('#voicePill')?.remove();
  const d=document.createElement('div');
  d.id='voicePill';
  d.className='rowc';
  d.style.cssText='position:absolute;left:16px;right:16px;bottom:100%;background:var(--pop);border:1px solid var(--br);padding:8px 14px;z-index:30;display:flex;align-items:center;gap:12px;margin:0 0 6px;border-radius:8px';
  d.innerHTML=`<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#da373c;animation:neonPulse 1s infinite"></span><b style="color:#fff" id="vTime">0:00</b><span class="mu sp">Recording voice message...</span><button class="g" onclick="cancelVoiceRec()">Cancel</button><button class="r" onclick="stopVoiceRec(true)">Stop & Send</button>`;
  $('.inw')?.prepend(d);
}

function updateVoiceTimer(){
  const s=Math.floor((Date.now()-recStart)/1000);
  const m=Math.floor(s/60),sec=s%60;
  const t=$('#vTime');if(t)t.textContent=`${m}:${sec<10?'0':''}${sec}`;
}

function stopVoiceRec(send){
  if(mediaRec&&mediaRec.state==='recording'){
    if(!send)audioChunks=[];
    mediaRec.stop();
  }
}

function cancelVoiceRec(){
  stopVoiceRec(false);
  $('#voicePill')?.remove();
}

  const pct=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));

  const fill=wrap.querySelector('.audio-fill'),time=wrap.querySelector('.audio-time');

// 11. Search Filter Helper
function msgMatchesFilter(m, q, s, c){
  if(!q) return true;
  const tokens = q.match(/(?:[^\s"]+|"[^"]*")+/g) || [];
  for(let tok of tokens){
    tok = tok.trim();
    if(!tok) continue;
    if(tok.startsWith('from:')){
      const u = tok.slice(5).replace(/^@/,'').toLowerCase();
      if(m.u.toLowerCase() !== u && (U(m.u)?.display||'').toLowerCase() !== u) return false;
    } else if(tok.startsWith('in:')){
      const chName = tok.slice(3).replace(/^#/,'').toLowerCase();
      if(c && c.n.toLowerCase() !== chName) return false;
    } else if(tok === 'has:image'){
      if(!m.img && (!m.imgs||!m.imgs.length) && !imgUrlsIn(m.x||'').length) return false;
    } else if(tok === 'has:link'){
      if(!extractUrls(m.x||'').length && !m.lk?.length) return false;
    } else if(tok === 'mentions:me'){
      if(!mentions(m)) return false;
    } else if(tok.startsWith('before:')){
      const d = Date.parse(tok.slice(7));
      if(!isNaN(d) && m.ts >= d) return false;
    } else if(tok.startsWith('after:')){
      const d = Date.parse(tok.slice(6));
      if(!isNaN(d) && m.ts <= d) return false;
    } else {
      const plain = tok.replace(/^"(.*)"$/, '$1').toLowerCase();
      const txt = (m.x || m.em?.t || m.em?.d || '').toLowerCase();
      if(!txt.includes(plain)) return false;
    }
  }
  return true;
}

// 3. Timeouts
function isTimedOut(s, u=me){
  if(!s||!s.timeouts||!s.timeouts[u])return false;
  return Date.now()<s.timeouts[u];
}

function applyTimeout(sid0, u){
  const s=db.servers[sid0];if(!s)return;
  const dur=+($('#toDuration')?.value||0);
  s.timeouts=s.timeouts||{};
  if(dur===0){
    delete s.timeouts[u];
    toast('Timeout removed for @'+u);
  }else{
    s.timeouts[u]=Date.now()+(dur*1000);
    toast(`Timed out @${u} for ${dur<3600?(dur/60)+'m':(dur/3600)+'h'}`);
  }
  save();closeModal();render();
}

    if(audioCtx.state === 'suspended') audioCtx.resume();
    const soundType = set(me).soundType || 'beep';
    const now = audioCtx.currentTime;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(vol * 0.3, now);
    gain.connect(audioCtx.destination);
    
    if(soundType === 'chime'){
      const osc1 = audioCtx.createOscillator(), osc2 = audioCtx.createOscillator();
      osc1.frequency.setValueAtTime(523.25, now);
      osc2.frequency.setValueAtTime(659.25, now + 0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      osc1.connect(gain); osc2.connect(gain);
      osc1.start(now); osc1.stop(now + 0.2);
      osc2.start(now + 0.08); osc2.stop(now + 0.4);
    } else if(soundType === 'pop'){
      const osc = audioCtx.createOscillator();
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      osc.connect(gain);
      osc.start(now); osc.stop(now + 0.1);
    } else if(soundType === 'echo'){
      [0, 0.08, 0.16].forEach((delay, idx) => {
        const osc = audioCtx.createOscillator();
        osc.frequency.setValueAtTime(700 + idx * 150, now + delay);
        osc.connect(gain);
        osc.start(now + delay);
        osc.stop(now + delay + 0.1);
      });
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
    } else { // beep
      const osc = audioCtx.createOscillator();
      osc.frequency.setValueAtTime(880, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      osc.connect(gain);
      osc.start(now); osc.stop(now + 0.2);
    }
  }catch{}
}

const MEMOCORD_HOME = 'https://memocord.vercel.app/';
function isLinkRisky(uObj,maskedLabel){
  const host=uObj.hostname.toLowerCase(),shorteners=['bit.ly','tinyurl.com','t.co','goo.gl','is.gd','cutt.ly','rb.gy'];
  if(/^(?:\d{1,3}\.){3}\d{1,3}$/.test(host))return'This link uses an IP address instead of a domain name.';
  if(uObj.port&&uObj.port!=='80'&&uObj.port!=='443')return`This link uses a non-standard port (${uObj.port}).`;
  if(host.includes('xn--'))return'This link contains special internationalized characters (punycode).';
  if(uObj.href.length>250)return'This URL is unusually long.';
  if(uObj.username||uObj.password)return'This link contains embedded login credentials.';
  if(shorteners.some(s=>host===s||host.endsWith('.'+s)))return'This link uses a known URL shortener which may obscure the true destination.';
  if(maskedLabel){
    const cleanLabel=maskedLabel.toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').split('/')[0];
    const cleanHost=host.replace(/^www\./,'');
    if(cleanLabel.includes('.')&&cleanLabel!==cleanHost){
      return`The link text displays "${esc(cleanLabel)}" but actually points to "${esc(cleanHost)}"!`;
    }
  }
  return false;
}

function externalLeaveModal(url,maskedLabel){
  let uObj;
  try{uObj=new URL(url);}catch{return window.open(url,'_blank','noopener,noreferrer');}
  if(uObj.origin===location.origin)return window.open(url,'_blank','noopener,noreferrer');
  
  const riskMsg=isLinkRisky(uObj,maskedLabel);
  const cleanDomain=uObj.hostname.toLowerCase().replace(/^www\./,'');
  const isTrusted=!riskMsg&&((U(me)?.trust||[]).includes(cleanDomain));
  if(isTrusted){
    window.open(url,'_blank','noopener,noreferrer');
    return;
  }

  const old=document.getElementById('external-leave-overlay');if(old)old.remove();
  const overlay=document.createElement('div');overlay.id='external-leave-overlay';
  overlay.className='ov';
  overlay.innerHTML=`<div class="md leave-dialog pop" role="dialog" aria-modal="true" aria-labelledby="leave-title" tabindex="-1" style="max-width:500px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
      <div style="width:40px;height:40px;border-radius:12px;background:#da373c22;color:#ff8589;display:grid;place-items:center;font-size:22px">${riskMsg?ic('alert',22,1):ic('link',20)}</div>
      <div>
        <h2 id="leave-title" style="margin:0;font-size:20px">${riskMsg?'Suspicious Link Warning':'Leaving Memocord?'}</h2>
        <div class="mu" style="font-size:12px">You're about to visit an external website that Memocord doesn't control.</div>
      </div>
    </div>
    ${riskMsg?`<div class="leave-risk-banner">${ic('alert',20,1)}<div><b>Caution:</b> ${esc(riskMsg)}</div></div>`:''}
    <div class="leave-url-box">
      <span class="mu">${esc(uObj.protocol)}//</span><b style="color:#ff8a70;font-size:15px">${esc(uObj.hostname)}</b><span class="mu">${esc(uObj.pathname+uObj.search+uObj.hash)}</span>
    </div>
    ${!riskMsg?`<label class="chk" style="margin:14px 0 6px"><input type="checkbox" id="trustDomainChk"> Trust links from <b>${esc(cleanDomain)}</b> from now on</label>`:''}
    <div class="leave-actions" style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px">
      <button type="button" class="g leave-no" id="leaveCancelBtn">Go back</button>
      <button type="button" class="leave-yes" id="leaveConfirmBtn">Visit site</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);

  const cancelBtn=overlay.querySelector('#leaveCancelBtn');
  const confirmBtn=overlay.querySelector('#leaveConfirmBtn');
  const trustChk=overlay.querySelector('#trustDomainChk');

  cancelBtn.onclick=()=>overlay.remove();
  confirmBtn.onclick=()=>{
    if(trustChk?.checked){
      U(me).trust=U(me).trust||[];
      if(!U(me).trust.includes(cleanDomain)){
        if(U(me).trust.length>=100)U(me).trust.shift();
        U(me).trust.push(cleanDomain);
        save();
      }
    }
    overlay.remove();
    window.open(url,'_blank','noopener,noreferrer');
  };

  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  overlay.addEventListener('keydown',e=>{
    if(e.key==='Escape'){e.preventDefault();overlay.remove();}
    if(e.key==='Tab'){
      const focusables=[cancelBtn,confirmBtn,trustChk].filter(Boolean);
      const idx=focusables.indexOf(document.activeElement);
      if(e.shiftKey&&idx<=0){e.preventDefault();focusables[focusables.length-1].focus();}
      else if(!e.shiftKey&&idx===focusables.length-1){e.preventDefault();focusables[0].focus();}
    }
  });
  cancelBtn.focus();
}

document.addEventListener('click',function(e){
  const a=e.target.closest&&e.target.closest('a[href]');
  if(!a)return;
  const href=a.getAttribute('href');
  if(!href||href.startsWith('#')||href.startsWith('javascript:'))return;
  try{
    const url=new URL(a.href,location.href);
    if(url.origin!==location.origin&&!a.hasAttribute('data-skip-external-confirm')){
      e.preventDefault();e.stopImmediatePropagation();
      const masked=a.getAttribute('data-masked-label');
      externalLeaveModal(url.href,masked);
    }
  }catch{}
},true);
