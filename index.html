async function toggleVoiceCamera() {
  if (!currentVoice) return;
  if (currentVoice.cameraActive) {
    try { currentVoice.cameraStream?.getTracks().forEach(t => t.stop()); } catch(_) {}
    currentVoice.cameraActive = false;
    currentVoice.cameraStream = null;
    toast('Camera turned off');
    render();
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    currentVoice.cameraActive = true;
    currentVoice.cameraStream = stream;
    stream.getVideoTracks()[0].onended = () => {
      if (currentVoice) {
        currentVoice.cameraActive = false;
        currentVoice.cameraStream = null;
        render();
      }
    };
    toast('Camera turned on');
    render();
  } catch(err) {
    if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
      toast('Camera permission was denied. Please allow camera access in browser settings.');
    } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
      toast('No camera device found on this system.');
    } else {
      toast('Could not access camera: ' + err.message);
    }
  }
}
window.toggleVoiceCamera = toggleVoiceCamera;

function chDragStart(e, chId, sid0, catName) {
  draggedItem = { type: 'channel', id: chId, sid: sid0, cat: catName };
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', chId);
  e.target.classList.add('drag-ghost');
}
function chDragOver(e, targetChId, sid0, targetCat) {
  if (!draggedItem || draggedItem.type !== 'channel' || draggedItem.sid !== sid0) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const target = e.currentTarget;
  const rect = target.getBoundingClientRect();
  const relY = e.clientY - rect.top;
  target.classList.remove('drop-indicator-top', 'drop-indicator-bottom');
  if (relY < rect.height / 2) {
    target.classList.add('drop-indicator-top');
  } else {
    target.classList.add('drop-indicator-bottom');
  }
}
function chDragLeave(e) {
  e.currentTarget.classList.remove('drop-indicator-top', 'drop-indicator-bottom', 'drop-indicator-cat');
}
async function chDrop(e, targetChId, sid0, targetCat) {
  e.preventDefault();
  e.currentTarget.classList.remove('drop-indicator-top', 'drop-indicator-bottom', 'drop-indicator-cat');
  $('.drag-ghost')?.classList.remove('drag-ghost');
  if (!draggedItem || draggedItem.type !== 'channel' || draggedItem.sid !== sid0) return;
  const s = db.servers[sid0];
  if (!s || (!canEdit(s, sid0) && !perm(s, me, null, 'manage_channels'))) {
    return toast('You lack permission to manage channels in this server');
  }
  const oldCh = JSON.parse(JSON.stringify(s.ch || []));
  const srcIdx = s.ch.findIndex(c => c.id === draggedItem.id);
  if (srcIdx < 0) return;
  const [movedCh] = s.ch.splice(srcIdx, 1);
  movedCh.cat = targetCat;

  if (targetChId) {
    const tgtIdx = s.ch.findIndex(c => c.id === targetChId);
    const rect = e.currentTarget.getBoundingClientRect();
    const insertAfter = (e.clientY - rect.top) >= rect.height / 2;
    const destIdx = tgtIdx < 0 ? s.ch.length : (insertAfter ? tgtIdx + 1 : tgtIdx);
    s.ch.splice(destIdx, 0, movedCh);
  } else {
    s.ch.push(movedCh);
  }

  draggedItem = null;
  render();

  try {
    clearTimeout(saveT);
    await push();
    chan?.send({type:'broadcast', event:'server_channels_reordered', payload:{sid:sid0, ch:s.ch, categories:s.categories}});
  } catch(err) {
    s.ch = oldCh;
    render();
    toast('Failed to reorder channel: ' + err.message);
  }
}

function catDragStart(e, catName, sid0) {
  draggedItem = { type: 'category', cat: catName, sid: sid0 };
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', catName);
  e.target.classList.add('drag-ghost');
}
function catDragOver(e, targetCat, sid0) {
  if (!draggedItem || draggedItem.sid !== sid0) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  if (draggedItem.type === 'category') {
    e.currentTarget.classList.add('drop-indicator-top');
  } else if (draggedItem.type === 'channel') {
    e.currentTarget.classList.add('drop-indicator-cat');
  }
}
async function catDrop(e, targetCat, sid0) {
  e.preventDefault();
  e.currentTarget.classList.remove('drop-indicator-top', 'drop-indicator-bottom', 'drop-indicator-cat');
  $('.drag-ghost')?.classList.remove('drag-ghost');
  if (!draggedItem || draggedItem.sid !== sid0) return;
  const s = db.servers[sid0];
  if (!s || (!canEdit(s, sid0) && !perm(s, me, null, 'manage_channels'))) {
    return toast('You lack permission to manage channels in this server');
  }

  if (draggedItem.type === 'channel') {
    // Drop channel directly into category
    return chDrop(e, null, sid0, targetCat);
  }

  if (draggedItem.type === 'category') {
    s.categories = s.categories || [];
    const oldCats = [...s.categories];
    const srcIdx = s.categories.indexOf(draggedItem.cat);
    const tgtIdx = s.categories.indexOf(targetCat);
    if (srcIdx < 0 || tgtIdx < 0 || srcIdx === tgtIdx) return;
    s.categories.splice(srcIdx, 1);
    s.categories.splice(tgtIdx, 0, draggedItem.cat);

    draggedItem = null;
    render();
    try {
      clearTimeout(saveT);
      await push();
      chan?.send({type:'broadcast', event:'server_channels_reordered', payload:{sid:sid0, ch:s.ch, categories:s.categories}});
    } catch(err) {
      s.categories = oldCats;
      render();
      toast('Failed to reorder category: ' + err.message);
    }
  }
}

function serverBoostCount(s) {
  if (!s) return 0;
  let count = (s.powers || s.power || []).length;
  const allUsers = Object.values(db.users || {});
  for (const u of allUsers) {
    const list = u.boosts || [];
    count += list.filter(b => b.serverId === s.id).length;
  }
  return count;
}

function serverBoostLvl(s) {
  const count = serverBoostCount(s);
  if (count >= 14) return 3;
  if (count >= 7) return 2;
  if (count >= 2) return 1;
  return 0;
}

  if (!b) return toast('Boost not found');
  if (b.serverId === sid0) return toast('Boost already applied to this server');
  
  if (b.appliedAt && Date.now() - b.appliedAt < 7 * 86400000) {
    const daysLeft = Math.ceil((7 * 86400000 - (Date.now() - b.appliedAt)) / 86400000);
    return toast(`Boost move cooldown active. Wait ${daysLeft} days before transferring again.`);

  b.serverId = sid0;
  b.appliedAt = Date.now();

function saveFolder(fId){
  U(me).folders=U(me).folders||[];
  const name=($('#fName')?.value||'').trim().slice(0,24)||'Folder';

  const idx=U(me).folders.findIndex(x=>x.id===fId);
  if(idx>=0){
    U(me).folders[idx].name=name;
    U(me).folders[idx].color=color;
    U(me).folders[idx].servers=srvs;
  }else{
    U(me).folders.push({id:fId,name,color,servers:srvs,collapsed:false});
  }

}

function deleteFolder(fId){
  U(me).folders=(U(me).folders||[]).filter(x=>x.id!==fId);

}

function toggleFolder(fId){
  const f=(U(me).folders||[]).find(x=>x.id===fId);

}

function saveUpdateConfig(){if(!isA(me))return;CFG.updateLog.enabled=!!$('#updateEnabled')?.checked;CFG.updateLog.version=($('#updateVersion')?.value||'1').trim().slice(0,40)||'1';CFG.updateLog.title=($('#updateTitle')?.value||'Memocord Update').trim().slice(0,80)||'Memocord Update';CFG.updateLog.message=($('#updateMessage')?.value||'').trim().slice(0,1500);db.updateLog={...CFG.updateLog};save();toast('Update log settings saved for the website.');settings('admin')}

/* ================= Phase 5: User Settings & Extras ================= */

// 1. Audio Notification Synthesizer (Zero dependencies, Web Audio API)
let audioCtx = null;
function playNotifySound(overrideType){
  if(set(me).sound === false && !overrideType) return;
  if(getPresence(me) === 'dnd' && !overrideType) return;
  const vol = (set(me).soundVol !== undefined ? set(me).soundVol : 0.6);
  if(vol <= 0) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const soundType = overrideType || set(me).soundType || 'discord';
    const now = audioCtx.currentTime;
    const masterGain = audioCtx.createGain();
    masterGain.gain.setValueAtTime(vol * 0.35, now);
    masterGain.connect(audioCtx.destination);

    if(soundType === 'discord'){
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const g1 = audioCtx.createGain();
      const g2 = audioCtx.createGain();
      osc1.type = 'sine';
      osc2.type = 'sine';
      osc1.frequency.setValueAtTime(587.33, now);
      osc2.frequency.setValueAtTime(880.00, now + 0.08);

      g1.gain.setValueAtTime(0.001, now);
      g1.gain.exponentialRampToValueAtTime(1.0, now + 0.015);
      g1.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

      g2.gain.setValueAtTime(0.001, now + 0.08);
      g2.gain.exponentialRampToValueAtTime(1.0, now + 0.095);
      g2.gain.exponentialRampToValueAtTime(0.001, now + 0.32);

      osc1.connect(g1); g1.connect(masterGain);
      osc2.connect(g2); g2.connect(masterGain);

      osc1.start(now); osc1.stop(now + 0.18);
      osc2.start(now + 0.08); osc2.stop(now + 0.32);
    } else if(soundType === 'bubble'){
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(960, now + 0.08);

      g.gain.setValueAtTime(0.001, now);
      g.gain.linearRampToValueAtTime(1.0, now + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

      osc.connect(g); g.connect(masterGain);
      osc.start(now); osc.stop(now + 0.18);
    } else if(soundType === 'marimba'){
      [ { f: 659.25, t: now }, { f: 880.00, t: now + 0.07 } ].forEach(note => {
        const osc = audioCtx.createOscillator();
        const harm = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'sine';
        harm.type = 'triangle';
        osc.frequency.setValueAtTime(note.f, note.t);
        harm.frequency.setValueAtTime(note.f * 2, note.t);

        g.gain.setValueAtTime(0.001, note.t);
        g.gain.linearRampToValueAtTime(0.9, note.t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.001, note.t + 0.22);

        osc.connect(g);
        harm.connect(g);
        g.connect(masterGain);

        osc.start(note.t); osc.stop(note.t + 0.22);
        harm.start(note.t); harm.stop(note.t + 0.22);
      });
    } else if(soundType === 'pop'){
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(500, now);
      osc.frequency.exponentialRampToValueAtTime(1400, now + 0.03);

      g.gain.setValueAtTime(0.001, now);
      g.gain.linearRampToValueAtTime(1.0, now + 0.008);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

      osc.connect(g); g.connect(masterGain);
      osc.start(now); osc.stop(now + 0.09);
    } else if(soundType === 'retro'){
      [ { f: 987.77, t: now, dur: 0.06 }, { f: 1318.51, t: now + 0.065, dur: 0.16 } ].forEach(note => {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(note.f, note.t);

        g.gain.setValueAtTime(0.001, note.t);
        g.gain.linearRampToValueAtTime(0.5, note.t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.001, note.t + note.dur);

        osc.connect(g); g.connect(masterGain);
        osc.start(note.t); osc.stop(note.t + note.dur);
      });
    } else if(soundType === 'cyber'){
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc1.type = 'sine';
      osc2.type = 'triangle';
      osc1.frequency.setValueAtTime(740, now);
      osc2.frequency.setValueAtTime(746, now);

      g.gain.setValueAtTime(0.001, now);
      g.gain.linearRampToValueAtTime(0.8, now + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.28);

      osc1.connect(g); osc2.connect(g);
      g.connect(masterGain);
      osc1.start(now); osc1.stop(now + 0.28);
      osc2.start(now); osc2.stop(now + 0.28);
    } else if(soundType === 'subtle'){
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, now);

      g.gain.setValueAtTime(0.001, now);
      g.gain.exponentialRampToValueAtTime(0.4, now + 0.03);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

      osc.connect(g); g.connect(masterGain);
      osc.start(now); osc.stop(now + 0.2);
    } else {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, now);

      g.gain.setValueAtTime(0.001, now);
      g.gain.linearRampToValueAtTime(0.8, now + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

      osc.connect(g); g.connect(masterGain);
      osc.start(now); osc.stop(now + 0.2);
    }
  }catch(_){}
}

function getSavedAccounts(){
  try{return JSON.parse(localStorage.getItem('memocord_accounts')||'[]')}catch{return []}
}
function saveCurrentAccount(u = me){
  if(!u||!U(u))return;
  const list = getSavedAccounts().filter(a=>a.u!==u);
  list.unshift({u, dn: dn(u), avatar: U(u).avatar||'', lastSeen: Date.now()});
  try{localStorage.setItem('memocord_accounts', JSON.stringify(list.slice(0, 10)))}catch{}
}
function removeSavedAccount(u){
  const list = getSavedAccounts().filter(a=>a.u!==u);
  try{localStorage.setItem('memocord_accounts', JSON.stringify(list))}catch{}
  switchAccountModal();
}
function updateAccountSwitcherEntry(oldU, newU){
  const list = getSavedAccounts().map(a=>a.u===oldU?{...a, u: newU, dn: dn(newU)}:a);
  try{localStorage.setItem('memocord_accounts', JSON.stringify(list))}catch{}
}

if(window.PasswordCredential && navigator.credentials?.store){

    used: history.length,
    remaining: Math.max(0, 5 - history.length),
    history
  };

async function submitUsernameChange(){
  const info = getMonthlyNameChanges(me);
  if(info.remaining <= 0) return toast('Monthly limit of 5 username changes reached');
  const newU = ($('#newUName')?.value||'').trim();
  const p = ($('#changeUNamePass')?.value||'').trim();
  const uErr = checkUsernameAppropriateness(newU);
  if(uErr) return toast(uErr);
  if(newU.toLowerCase() === me.toLowerCase()) return toast('Username is identical to current one');
  const taken = Object.keys(db.users).find(k=>k.toLowerCase()===newU.toLowerCase());
  if(taken && taken !== me) return toast('That username is already taken');
  if(!p) return toast('Please enter your current password');

  try{
    const {error: authErr} = await sb.auth.signInWithPassword({email: em(me), password: p});
    if(authErr) return toast('Incorrect password');
    const {error: upErr} = await sb.auth.updateUser({email: em(newU), data: {username: newU}});
    if(upErr) return toast('Failed to update credentials: ' + upErr.message);

    const oldU = me;
    db.users[newU] = db.users[oldU];
    db.users[newU].nameChanges = [...info.history, Date.now()];
    if(db.users[newU].display === oldU) db.users[newU].display = newU;
    delete db.users[oldU];

    for(const s of Object.values(db.servers||{})){
      if(s.owner === oldU) s.owner = newU;
      if(s.members?.includes(oldU)) s.members = s.members.map(u=>u===oldU?newU:u);
      if(s.powers?.includes(oldU)) s.powers = s.powers.map(u=>u===oldU?newU:u);
      if(s.roles){
        for(const r of Object.values(s.roles)){
          if(r.members?.includes(oldU)) r.members = r.members.map(u=>u===oldU?newU:u);
        }
      }
      for(const c of Object.values(s.channels||{})){
        for(const m of (c.msgs||[])){
          if(m.u === oldU) m.u = newU;
          if(m.rx){
            for(const emj of Object.keys(m.rx)){
              if(m.rx[emj]?.includes(oldU)) m.rx[emj] = m.rx[emj].map(u=>u===oldU?newU:u);
            }
          }
        }
      }
    }

    for(const g of Object.values(db.groups||{})){
      if(g.owner === oldU) g.owner = newU;
      if(g.members?.includes(oldU)) g.members = g.members.map(u=>u===oldU?newU:u);
      for(const m of (g.msgs||[])){ if(m.u === oldU) m.u = newU; }
    }

    const newDMs = {};
    for(const [k, arr] of Object.entries(db.dms||{})){
      const parts = k.split('|');
      if(parts.includes(oldU)){
        const newKey = parts.map(u=>u===oldU?newU:u).sort().join('|');
        for(const m of (arr||[])){ if(m.u === oldU) m.u = newU; }
        newDMs[newKey] = arr;
      } else {
        newDMs[k] = arr;
      }
    }
    db.dms = newDMs;

    for(const u of Object.values(db.users||{})){
      if(u.friends?.includes(oldU)) u.friends = u.friends.map(f=>f===oldU?newU:f);
      if(u.freq_in?.includes(oldU)) u.freq_in = u.freq_in.map(f=>f===oldU?newU:f);
      if(u.freq_out?.includes(oldU)) u.freq_out = u.freq_out.map(f=>f===oldU?newU:f);
      if(u.notes && u.notes[oldU]){ u.notes[newU] = u.notes[oldU]; delete u.notes[oldU]; }
      if(u.friendNicks && u.friendNicks[oldU]){ u.friendNicks[newU] = u.friendNicks[oldU]; delete u.friendNicks[oldU]; }
    }

    updateAccountSwitcherEntry(oldU, newU);
if(window.PasswordCredential && navigator.credentials?.store){
  try{ await navigator.credentials.store(new PasswordCredential({id: newU, password: p, name: dn(newU) || newU})); }catch{}
}
    me = newU;
    await push();
    save();
    render();
    closeModal();
    settings('account');
    toast(`Username changed to @${newU}!`);
  }catch(err){ toast('Error changing username: ' + err.message); }
}

/* --- TOTP & 2FA Implementation --- */
function base32Decode(str){
  const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  let bits = 0, value = 0, index = 0;
  const output = new Uint8Array(Math.floor((str.length * 5) / 8));
  for(let i=0; i<str.length; i++){
    const val = alphabet.indexOf(str.charAt(i).toUpperCase());
    if(val === -1) continue;
    value = (value << 5) | val;
    bits += 5;
    if(bits >= 8){
      output[index++] = (value >>> (bits - 8)) & 255;
      bits -= 8;
    }
  }
  return output.slice(0, index);
}

function generateBase32Secret(len = 16){
  const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  const arr = new Uint8Array(len);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(b=>alphabet[b % alphabet.length]).join('');
}

async function generateTOTPCode(secret, epochSec = Math.floor(Date.now() / 1000)){
  const keyBytes = base32Decode(secret.replace(/[\s-]/g, ''));
  const counter = Math.floor(epochSec / 30);
  const counterBytes = new Uint8Array(8);
  let tmp = counter;
  for(let i=7; i>=0; i--){
    counterBytes[i] = tmp & 0xff;
    tmp = Math.floor(tmp / 256);
  }
  const cryptoKey = await crypto.subtle.importKey('raw', keyBytes, {name: 'HMAC', hash: {name: 'SHA-1'}}, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', cryptoKey, counterBytes);
  const hash = new Uint8Array(sig);
  const offset = hash[hash.length - 1] & 0xf;
  const binary = ((hash[offset] & 0x7f) << 24) |
                 ((hash[offset + 1] & 0xff) << 16) |
                 ((hash[offset + 2] & 0xff) << 8) |
                 (hash[offset + 3] & 0xff);
  return String(binary % 1000000).padStart(6, '0');
}

async function verifyTOTP(secret, inputCode){
  const now = Math.floor(Date.now() / 1000);
  for(let offset of [-30, 0, 30]){
    const code = await generateTOTPCode(secret, now + offset);
    if(code === inputCode.trim()) return true;
  }
  return false;
}

function generateBackupCodes(){
  const codes = [];
  for(let i=0; i<8; i++){
    const bytes = new Uint8Array(4);
    crypto.getRandomValues(bytes);
    const hex = Array.from(bytes).map(b=>b.toString(16).padStart(2,'0').toUpperCase()).join('');
    codes.push(hex.slice(0,4) + '-' + hex.slice(4,8));
  }
  return codes;
}

async function verify2FALogin(key){
  const input = ($('#twoFactorCodeInput')?.value||'').trim();
  if(!input) return toast('Please enter your code');
  const tf = U(key).twoFactor || {};
  let ok = false;

  const normInput = input.replace(/[\s-]/g, '').toUpperCase();
  const backupIdx = (tf.backupCodes||[]).findIndex(c=>c.replace(/[\s-]/g,'').toUpperCase()===normInput);
  if(backupIdx !== -1){
    tf.backupCodes.splice(backupIdx, 1);
    save();
    ok = true;
  } else if(tf.type === 'app'){
    ok = await verifyTOTP(tf.secret, input);
  } else if(tf.type === 'sms' || tf.type === 'email'){
    ok = (input === window._active2FALoginCode);
  }

  if(!ok){
    return toast('Invalid verification code. Please try again.');
  }

  try{ sessionStorage.setItem('mc_2fa_ok_' + key, '1'); localStorage.setItem('mc_2fa_trust_' + key, String(Date.now() + 30 * 86400000)); }catch(_){}
  me = key;
  ready = 1;
  ensure();
  saveCurrentAccount(key);
  connect();
  go({t: 'srv', s: SID, c: 'general'});
  inviteFromUrl();
  toast('Welcome back, @' + key + '!');
}

function isLinkRisky(uObj,maskedLabel){
  const host=uObj.hostname.toLowerCase(),shorteners=['bit.ly','tinyurl.com','t.co','goo.gl','is.gd','cutt.ly','rb.gy'];
  if(/^(?:\d{1,3}\.){3}\d{1,3}$/.test(host))return'This link uses an IP address instead of a domain name.';
  if(uObj.port&&uObj.port!=='80'&&uObj.port!=='443')return`This link uses a non-standard port (${uObj.port}).`;
  if(host.includes('xn--'))return'This link contains special internationalized characters (punycode).';
  if(uObj.href.length>250)return'This URL is unusually long.';
  if(uObj.username||uObj.password)return'This link contains embedded login credentials.';
  if(shorteners.some(s=>host===s||host.endsWith('.'+s)))return'This link uses a known URL shortener which may obscure the true destination.';
  if(maskedLabel){
    const cleanLabel=maskedLabel.toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').split('/')[0];
    const cleanHost=host.replace(/^www\./,'');
    if(cleanLabel.includes('.')&&cleanLabel!==cleanHost){
      return`The link text displays "${esc(cleanLabel)}" but actually points to "${esc(cleanHost)}"!`;
    }
  }
  return false;
}

function openExternalUrl(url){
  if(window.memocordDesktop && typeof window.memocordDesktop.openExternal === 'function'){
    window.memocordDesktop.openExternal(url);
  }else{
    window.open(url,'_blank','noopener,noreferrer');
  }
}
function externalLeaveModal(url,maskedLabel){
  let uObj;
  try{uObj=new URL(url);}catch{return window.open(url,'_blank','noopener,noreferrer');}
  if(uObj.origin===location.origin)return window.open(url,'_blank','noopener,noreferrer');
  
  const riskMsg=isLinkRisky(uObj,maskedLabel);
  const cleanDomain=uObj.hostname.toLowerCase().replace(/^www\./,'');
  const isTrusted=!riskMsg&&((U(me)?.trust||[]).includes(cleanDomain));
  if(isTrusted){
    openExternalUrl(url);
    return;
  }

  const old=document.getElementById('external-leave-overlay');if(old)old.remove();
  const overlay=document.createElement('div');overlay.id='external-leave-overlay';
  overlay.className='ov';
  overlay.innerHTML=`<div class="md leave-dialog pop" role="dialog" aria-modal="true" aria-labelledby="leave-title" tabindex="-1" style="max-width:500px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
      <div style="width:40px;height:40px;border-radius:12px;background:#da373c22;color:#ff8589;display:grid;place-items:center;font-size:22px">${riskMsg?ic('alert',22,1):ic('link',20)}</div>
      <div>
        <h2 id="leave-title" style="margin:0;font-size:20px">${riskMsg?'Suspicious Link Warning':'Leaving Memocord?'}</h2>
        <div class="mu" style="font-size:12px">You're about to visit an external website that Memocord doesn't control.</div>
      </div>
    </div>
    ${riskMsg?`<div class="leave-risk-banner">${ic('alert',20,1)}<div><b>Caution:</b> ${esc(riskMsg)}</div></div>`:''}
    <div class="leave-url-box">
      <span class="mu">${esc(uObj.protocol)}//</span><b style="color:#ff8a70;font-size:15px">${esc(uObj.hostname)}</b><span class="mu">${esc(uObj.pathname+uObj.search+uObj.hash)}</span>
    </div>
    ${!riskMsg?`<label class="chk" style="margin:14px 0 6px"><input type="checkbox" id="trustDomainChk"> Trust links from <b>${esc(cleanDomain)}</b> from now on</label>`:''}
    <div class="leave-actions" style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px">
      <button type="button" class="g leave-no" id="leaveCancelBtn">Go back</button>
      <button type="button" class="leave-yes" id="leaveConfirmBtn">Visit site</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);

  const cancelBtn=overlay.querySelector('#leaveCancelBtn');
  const confirmBtn=overlay.querySelector('#leaveConfirmBtn');
  const trustChk=overlay.querySelector('#trustDomainChk');

  cancelBtn.onclick=()=>overlay.remove();
  confirmBtn.onclick=()=>{
    if(trustChk?.checked){
      U(me).trust=U(me).trust||[];
      if(!U(me).trust.includes(cleanDomain)){
        if(U(me).trust.length>=100)U(me).trust.shift();
        U(me).trust.push(cleanDomain);
        save();
      }
    }
    overlay.remove();
    openExternalUrl(url);
  };

  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  overlay.addEventListener('keydown',e=>{
    if(e.key==='Escape'){e.preventDefault();overlay.remove();}
    if(e.key==='Tab'){
      const focusables=[cancelBtn,confirmBtn,trustChk].filter(Boolean);
      const idx=focusables.indexOf(document.activeElement);
      if(e.shiftKey&&idx<=0){e.preventDefault();focusables[focusables.length-1].focus();}
      else if(!e.shiftKey&&idx===focusables.length-1){e.preventDefault();focusables[0].focus();}
    }
  });
  cancelBtn.focus();
}

document.addEventListener('click',function(e){
  const a=e.target.closest&&e.target.closest('a[href]');
  if(!a)return;
  const href=a.getAttribute('href');
  if(!href||href.startsWith('#')||href.startsWith('javascript:'))return;
  if(href.startsWith('memocord://')){
    e.preventDefault();e.stopImmediatePropagation();
    handleAppInvite(href);
    return;
  }
  const codeCand=parseInviteCode(href);
  if(codeCand&&findInviteServer(codeCand)){
    e.preventDefault();e.stopImmediatePropagation();
    handleAppInvite(href);
    return;
  }
  try{
    const url=new URL(a.href,location.href);
    if(url.origin!==location.origin&&!a.hasAttribute('data-skip-external-confirm')){
      e.preventDefault();e.stopImmediatePropagation();
      const masked=a.getAttribute('data-masked-label');
      externalLeaveModal(url.href,masked);
    }
  }catch{}
},true);
