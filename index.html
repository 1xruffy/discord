$('#root').innerHTML=`<div class="auth"><div class="card pop"><h1>${L?'Welcome back!':'Create an account'}</h1><p class="mu" style="margin:6px 0 20px">${L?'We are so excited to see you again!':'Pick a username and password.'}</p><label>USERNAME</label><input id="au" autocomplete="username">${L?'':'<label>EMAIL</label><input id="ae" type="email" autocomplete="email">'}<label>PASSWORD</label><input id="ap" type="password" autocomplete="${L?'current-password':'new-password'}">${L?'':'<div id="acw" style="display:none"><label>VERIFICATION CODE</label><input id="ac" inputmode="numeric" maxlength="6" placeholder="6-digit code"></div>'}<button id="ab">${L?'Log In':'Continue'}</button><p class="mu">${L?'Need an account? <a onclick="authView(0)">Register</a>':'<a onclick="authView(1)">Already have an account?</a>'}</p></div></div>`;
$('#ap').onkeydown=$('#au').onkeydown=e=>{if(e.key=='Enter')$('#ab').click()};$('#au').focus();
$('#ab').onclick=async()=>{try{const u=$('#au').value.trim(),p=$('#ap').value;
if(!/^[\w.-]{3,32}$/.test(u)||/^(__proto__|constructor|prototype)$/.test(u))return toast('Username: 3-32 letters, numbers, _ . -');
let key=u,r;
if(!L){const e0=($('#ae').value||'').trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(e0))return toast('Enter a valid email');if(p.length<6)return toast('Password needs at least 6 characters');if(u===OWNER&&e0!==ADMIN_EMAIL)return toast('That username is reserved');
if(!vc||vc.e!==e0||vc.u!==u){vc={e:e0,u,c:String(100000+Math.floor(Math.random()*9e5))};notif(vc.c);$('#acw').style.display='block';$('#ab').textContent='Verify and create account';$('#ac').focus();return toast('Verification code sent')}
if($('#ac').value.trim()!==vc.c)return toast('Incorrect verification code')}
if(L){r=await sb.auth.signInWithPassword({email:em(u),password:p});if(r.error)return toast('Wrong username or password');await pull();key=Object.keys(db.users).find(k=>k.toLowerCase()==u.toLowerCase())||u;if(!db.users[key])return toast('Account data missing');if(U(key).banned){await sb.auth.signOut();return toast('This account has been banned')}}
else{if(p.length<6)return toast('Password needs at least 6 characters');r=await sb.auth.signUp({email:em(u),password:p,options:{data:{username:u,email:vc.e}}});if(r.error)return toast(r.error.message.includes('registered')?'That username is taken':r.error.message);if(!r.data.session)return toast('Turn off Confirm email in Supabase Auth settings');await pull();db.users[u]={display:u,friends:[],blocked:[],status:'online'}}
me=key;ready=1;isAdmin=key===OWNER&&((r.data.user?.user_metadata?.email)||'').toLowerCase()==ADMIN_EMAIL;if(!L)save();await loadOrders();connect();go({t:'friends',tab:'online'})}catch(e){toast('Error: '+e.message)}}}

/* ===== friends ===== */
const dm=u=>go({t:'dm',id:u});
function blk(u,on){const x=U(me);if(on){x.blocked.includes(u)||x.blocked.push(u);x.friends=x.friends.filter(f=>f!=u);U(u).friends=U(u).friends.filter(f=>f!=me)}else x.blocked=x.blocked.filter(f=>f!=u);save();toast(on?'Blocked '+u:'Unblocked '+u);render()}
function unf(u){U(me).friends=U(me).friends.filter(f=>f!=u);U(u).friends=U(u).friends.filter(f=>f!=me);save();render()}
function addFriend(){const x=U(me),n=$('#af').value.trim(),y=U(n);if(!y||n==me)return toast('No user with that username');if(y.blocked.includes(me)||x.blocked.includes(n))return toast('You cannot add this user');if(!x.friends.includes(n)){x.friends.push(n);y.friends.push(me)}save();toast('Added '+n);render()}
function friendsView(){const x=U(me),t=view.tab;
const tabs=['online','all','blocked'].map(k=>`<span class="tab ${t==k?'on':''}" onclick="view.tab='${k}';render()">${k[0].toUpperCase()+k.slice(1)}</span>`).join('');
let b;
if(t=='add')b=`<h2>Add Friend</h2><p class="mu" style="margin-bottom:12px">You can add friends with their username.</p><div class="row"><input id="af" placeholder="Enter a username" style="margin:0"><button id="ab2">Add friend</button></div>`;
else{const l=(t=='blocked'?x.blocked:x.friends).filter(u=>U(u)&&(t!='online'||online(u)));
b=`<div class="mu" style="font-weight:700;padding-bottom:12px">${t=='online'?'Online':t=='all'?'All friends':'Blocked'} — ${l.length}</div>`+(l.map(u=>`<div class="fr" data-ctx="friend:${u}" ${t=='blocked'?'':`onclick="dm('${u}')"`}><div class="avw">${av(u,40)}<i class="dot ${dot(u)}"></i></div><div><b>${dn(u)}</b>${badges(u)}<div class="mu">${esc(u)}</div></div><span class="sp"></span>${t=='blocked'?`<button class="g" onclick="blk('${u}',0)">Unblock</button>`:`<button class="cb" onclick="event.stopPropagation();dm('${u}')">${I('logo',18)}</button><button class="cb" onclick="ctx.friend(event,'${u}')">${I('dots',18)}</button>`}</div>`).join('')||`<p class="mu">${t=='online'?'No friends online right now.':t=='blocked'?'You have not blocked anyone.':'Add a friend to get started.'}</p>`)}
return`<div class="top">${I('friends',22)}<b>Friends</b>${tabs}<span class="tab add ${t=='add'?'on':''}" onclick="view.tab='add';render()">Add Friend</span></div><div class="fl">${b}</div>`}

/* ===== servers ===== */
function addServer(){modal(`<h2>Create a server</h2><label>SERVER NAME</label><input id="sn" maxlength="32"><label>SERVER ICON</label><input id="si" type="file" accept="image/*"><button id="sc" style="width:100%">Create server</button><hr><h2>Join a server</h2><label>INVITE CODE</label><input id="sj"><button class="g" id="sjb" style="width:100%">Join server</button>`);
$('#sc').onclick=async()=>{const n=$('#sn').value.trim();if(!n)return toast('Give your server a name');let ic='';const f=$('#si').files[0];if(f)try{ic=await img(f,128,0)}catch{}const id=rid();db.servers[id]={name:n,icon:ic,owner:me,members:[me],bans:[],timeouts:{},roles:[],mr:{},msgs:[],code:rid().toUpperCase()};save();closeModal();go({t:'srv',id})};
$('#sjb').onclick=()=>{const c=$('#sj').value.trim().toUpperCase(),e=Object.entries(db.servers).find(([i,v])=>v.code==c);if(!e)return toast('Invalid invite code');const[id,s]=e;if(s.bans.includes(me))return toast('You are banned from this server');if(!s.members.includes(me))s.members.push(me);save();closeModal();go({t:'srv',id})}}
function invite(id){const c=db.servers[id].code;navigator.clipboard?.writeText(c);modal(`<h2>Invite friends</h2><p class="mu" style="margin-bottom:10px">Send this code. They click + then Join a server. Copied to your clipboard.</p><input readonly value="${c}" onclick="this.select()" style="font-size:20px;text-align:center;letter-spacing:3px"><button style="width:100%" onclick="closeModal()">Done</button>`)}
function roles(id){const s=db.servers[id];modal(`<h2>Roles</h2>${s.roles.map(r=>`<div class="row"><i class="sw" style="background:${r.color}"></i><span style="color:${r.color}">${esc(r.name)}</span><span class="sp"></span><button class="r" onclick="delRole('${id}','${r.id}')">Delete</button></div>`).join('')||'<p class="mu">No roles yet. Right-click a member to assign one.</p>'}<hr><input id="rn" maxlength="24" placeholder="Role name"><div class="row"><input id="rc" type="color" value="#5865f2" style="height:42px;margin:0"><button id="ra">Add role</button></div>${s.bans.length?`<hr><label>BANNED</label>${s.bans.map(b=>`<div class="row"><span>${esc(b)}</span><span class="sp"></span><button class="g" onclick="unban('${id}','${b}')">Unban</button></div>`).join('')}`:''}`);
$('#ra').onclick=()=>{const n=$('#rn').value.trim();if(!n)return toast('Name the role');s.roles.push({id:rid(),name:n,color:$('#rc').value});save();roles(id);render()}}
const delRole=(id,r)=>{const s=db.servers[id];s.roles=s.roles.filter(x=>x.id!=r);for(const u in s.mr)s.mr[u]=s.mr[u].filter(x=>x!=r);save();roles(id);render()};
const unban=(id,u)=>{const s=db.servers[id];s.bans=s.bans.filter(x=>x!=u);save();roles(id)};
function kick(s,u,ban){s.members=s.members.filter(m=>m!=u);delete s.mr[u];if(ban)s.bans.push(u);save();toast((ban?'Banned ':'Kicked ')+u);render()}
const tmo=(s,u,min)=>{min?s.timeouts[u]=Date.now()+min*6e4:delete s.timeouts[u];save();toast(min?'Timed out '+u:'Timeout removed');render()};
function togRole(s,u,r){const a=s.mr[u]=s.mr[u]||[];a.includes(r)?a.splice(a.indexOf(r),1):a.push(r);save();render()}
const ctx={
usr:(e,u)=>menu(e,[{l:'Profile',f:()=>prof(u)},...(U(me).beta?[{l:'Copy User ID',f:()=>cid(u)}]:[])]),
friend:(e,u)=>{const b=U(me).blocked.includes(u);menu(e,[{l:'Message',f:()=>dm(u)},{l:'Profile',f:()=>prof(u)},...(U(me).beta?[{l:'Copy User ID',f:()=>cid(u)}]:[]),'-',b?{l:'Unblock',f:()=>blk(u,0)}:{l:'Block',d:1,f:()=>blk(u,1)},...(!b&&U(me).friends.includes(u)?[{l:'Remove friend',d:1,f:()=>unf(u)}]:[])])},
srv:(e,id)=>{const s=db.servers[id],o=s.owner==me;menu(e,[{l:'Invite',f:()=>invite(id)},...(o?[{l:'Manage roles',f:()=>roles(id)},'-',{l:'Delete server',d:1,f:()=>{if(confirm('Delete this server for everyone?')){delete db.servers[id];save();go({t:'friends',tab:'online'})}}}]:['-',{l:'Leave server',d:1,f:()=>{s.members=s.members.filter(m=>m!=me);save();render()}}])])},
mem:(e,u)=>{const s=db.servers[view.id];if(!s)return;const it=[{l:'Profile',f:()=>prof(u)},...(U(me).beta?[{l:'Copy User ID',f:()=>cid(u)}]:[])];
if(s.owner==me&&u!=me)it.push('-',...s.roles.map(r=>({l:`${(s.mr[u]||[]).includes(r.id)?'✓ ':''}Role: ${esc(r.name)}`,f:()=>togRole(s,u,r.id)})),'-',{l:'Timeout 5 minutes',f:()=>tmo(s,u,5)},{l:'Timeout 1 hour',f:()=>tmo(s,u,60)},{l:'Timeout 1 day',f:()=>tmo(s,u,1440)},{l:'Remove timeout',f:()=>tmo(s,u,0)},'-',{l:'Kick',d:1,f:()=>kick(s,u,0)},{l:'Ban',d:1,f:()=>kick(s,u,1)});
menu(e,it)}};

/* ===== icons, decorations, shop, emoji, commands ===== */
const IC={logo:'<path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-9l-5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>',plus:'<path d="M13 5h-2v6H5v2h6v6h2v-6h6v-2h-6z"/>',friends:'<path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm7 1a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM2 20c0-3 3-5 7-5s7 2 7 5v1H2zm15-5c3 0 5 1.5 5 4v2h-4v-2c0-1.500-.4-3-1-4z"/>',spark:'<path d="M12 2l2.300 6.700L21 11l-6.700 2.300L12 20l-2.300-6.700L3 11l6.700-2.300z"/>',gear:'<path d="M19.400 13a7.500 7.500 0 0 0 0-2l2-1.600-2-3.400-2.400 1a7.600 7.600 0 0 0-1.700-1L15 3h-4l-.4 3a7.600 7.600 0 0 0-1.700 1l-2.400-1-2 3.400 2 1.600a7.500 7.500 0 0 0 0 2l-2 1.600 2 3.400 2.400-1c.5.400 1.100.7 1.700 1l.4 3h4l.4-3c.6-.3 1.200-.6 1.700-1l2.400 1 2-3.400zM13 15.500a3.500 3.500 0 1 1 0-7 3.500 3.500 0 0 1 0 7z"/>',hash:'<path d="M5 9h14V7H5zm0 8h14v-2H5zM9 3L7 21h2l2-18zm6 0l-2 18h2l2-18z"/>',invite:'<path d="M15 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM3 20c0-3 3-5 8-5s8 2 8 5v1H3zM6 8H4V6H2V4h2V2h2v2h2v2H6z"/>',crown:'<path d="M3 8l4 3 5-6 5 6 4-3-2 10H5z"/>',dots:'<circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>',x:'<path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" fill="none"/>'};
const I=(n,s=20)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="currentColor">${IC[n]}</svg>`;
const BI={own:['linear-gradient(135deg,#f7c948,#d4900f)','<path d="M3 8l4 3 5-6 5 6 4-3-2 10H5z"/>'],dev:['linear-gradient(135deg,#6d7bff,#3a45c9)','<path d="M9 7l-5 5 5 5M15 7l5 5-5 5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>'],bird:['linear-gradient(135deg,#43c978,#1f8f4f)','<path d="M12 3l2.500 5.500 6 .7-4.500 4 1.300 5.800L12 15.200 6.700 19l1.300-5.800-4.500-4 6-.7z"/>'],memo:['linear-gradient(135deg,#f06bb5,#b5278a)','<path d="M12 2l2.300 6.700L21 11l-6.700 2.300L12 20l-2.300-6.700L3 11l6.700-2.300z"/>']};
const DECO={crows:s=>`<svg class="deco" viewBox="0 0 100 100" style="width:${s*1.5}px;height:${s*1.5}px"><defs><linearGradient id="dmg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b6cff"/><stop offset="1" stop-color="#2a1b52"/></linearGradient><path id="crw" d="M0 6c4-1 7-4 9-8 2 4 5 7 9 8-3 0-6 1-9 4-3-3-6-4-9-4z"/></defs><circle cx="50" cy="50" r="38" fill="none" stroke="url(#dmg)" stroke-width="3.500"/><g class="cw"><use href="#crw" transform="translate(41 6) scale(.9)" fill="#0b0814"/><use href="#crw" transform="translate(78 62) scale(.8)" fill="#0b0814"/><use href="#crw" transform="translate(6 56) scale(.85)" fill="#0b0814"/></g><path d="M80 10a11 11 0 1 0 11 17 8 8 0 1 1-11-17z" fill="#f4e9c8"/></svg>`};
const PLATE="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 40" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#120a22"/><stop offset=".6" stop-color="#2c1d57"/><stop offset="1" stop-color="#4a3492"/></linearGradient></defs><rect width="240" height="40" fill="url(#g)"/><path d="M214 6a13 13 0 1 0 12 20 10 10 0 1 1-12-20z" fill="#f4e9c8" opacity=".9"/><g fill="#07040f" opacity=".85"><path d="M150 14c4-1 7-4 9-8 2 4 5 7 9 8-3 0-6 1-9 4-3-3-6-4-9-4z"/><path d="M178 26c3-1 5-3 7-6 1 3 4 5 7 6-2 0-5 1-7 3-2-2-4-3-7-3z"/><path d="M196 10c2-1 4-2 5-5 1 3 3 4 5 5-2 0-3 1-5 2-1-1-3-2-5-2z"/></g></svg>');
const pl=u=>U(u)?.plate&&!banned(u)?`background:url('${PLATE}') center/cover;`:'';
const uid=u=>{let h=5381,g=52711;for(const c of u){h=(h*33^c.codePointAt(0))>>>0;g=(g*31+c.codePointAt(0))>>>0}return String(h).padStart(10,'0')+String(g).padStart(9,'0')};
const cid=u=>{navigator.clipboard?.writeText(uid(u));toast('User ID copied')};
function notif(c){document.querySelector('.notif')?.remove();const n=document.createElement('div');n.className='notif';n.innerHTML=`<div class="nh">${I('logo',16)}<b>Memocord</b><span class="mu" style="margin-left:auto">now</span></div><div class="mu">Your verification code is</div><div class="code">${c}</div>`;document.body.append(n);setTimeout(()=>n.remove(),120000)}
function cmd(t){const[c,a]=t.trim().split(/\s+/);if(c!='!ban')return toast('Unknown command');
const tg=Object.keys(db.users).find(u=>uid(u)==a);if(!tg)return toast('No user with that ID');if(tg==me||tg==OWNER)return toast('You cannot ban that user');
if(isAdmin){U(tg).banned=1;save();toast('Banned '+tg+' from Memocord');return render()}
if(view.t=='srv'){const s=db.servers[view.id];if(s.owner!=me)return toast('Only the server owner can do that');return kick(s,tg,1)}
toast('You do not have permission')}
const fmt=(t,u,s)=>{let h=esc(t);if(s&&hasMemo(u)&&s.members.includes(u))h=h.replace(/:(\w{2,24}):/g,(a,n)=>{const e=(s.emojis||[]).find(e=>e.name==n);return e?`<img class="emo" src="${e.img}" alt="${a}" title="${a}">`:a});return h};
const pimg=(f,max)=>new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const i=new Image();i.onerror=no;i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.max(1,i.width*k);c.height=Math.max(1,i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/png'))};i.src=r.result};r.readAsDataURL(f)});
function emojis(id){const s=db.servers[id];s.emojis=s.emojis||[];modal(`<h2>Server emoji</h2><p class="mu" style="margin-bottom:10px">Members with Memo can use these as :name: in this server.</p>${s.emojis.map((e,i)=>`<div class="row"><img class="emo" style="width:32px;height:32px" src="${e.img}"><b>:${esc(e.name)}:</b><span class="sp"></span><button class="g" onclick="renEmo('${id}',${i})">Rename</button><button class="r" onclick="delEmo('${id}',${i})">Delete</button></div>`).join('')||'<p class="mu">No emoji yet.</p>'}<hr><label>NAME</label><input id="en2" maxlength="24" placeholder="monkey"><label>IMAGE</label><input id="ei" type="file" accept="image/*"><button id="ea2" style="width:100%">Upload emoji</button>`);
$('#ea2').onclick=async()=>{const n=$('#en2').value.trim(),f=$('#ei').files[0];if(!/^\w{2,24}$/.test(n))return toast('Name: 2-24 letters, numbers or _');if(!f)return toast('Choose an image');if(s.emojis.length>=50)return toast('Emoji limit reached');if(s.emojis.some(e=>e.name==n))return toast('Name already used');try{s.emojis.push({name:n,img:await pimg(f,64)})}catch{return toast('Image failed')}save();emojis(id);render()}}
const renEmo=(id,i)=>{const s=db.servers[id],n=prompt('New name',s.emojis[i].name);if(n==null)return;if(!/^\w{2,24}$/.test(n)||s.emojis.some((e,j)=>j!=i&&e.name==n))return toast('Invalid or duplicate name');s.emojis[i].name=n;save();emojis(id);render()};
const delEmo=(id,i)=>{db.servers[id].emojis.splice(i,1);save();emojis(id);render()};
const SHOP={crows:{n:'Dark Moon Crows',d:'Avatar decoration with orbiting crows',p:'£10.00',t:'shop'},plate:{n:'Dark Moon Nameplate',d:'Nameplate behind your name in lists',p:'£7.99',t:'shop'},bundle:{n:'Dark Moon Bundle',d:'Crows decoration and nameplate together',p:'£14.99',t:'bundles'},memo:{n:'Memo',d:''}};
const owns=id=>(U(me).owned||[]).includes(id);
const pvw=id=>{const a=`<span class="aw"><div class="av" style="width:64px;height:64px;font-size:30px;background:#5865f2">M</div>${DECO.crows(64)}</span>`,p=`<div class="plp" style="background:url('${PLATE}') center/cover">Username</div>`;return id=='crows'?a:id=='plate'?p:`<div style="display:flex;flex-direction:column;gap:16px;align-items:center;width:100%">${a}${p.replace('class="plp"','class="plp" style="height:34px;width:80%;border-radius:6px;background:url(\''+PLATE+'\') center/cover"')}</div>`};
const shopGrid=t=>`<div class="shop">${Object.entries(SHOP).filter(([k,v])=>v.t==t).map(([k,v])=>{const own=k=='bundle'?owns('crows')&&owns('plate'):owns(k),eqd=k=='crows'?!!U(me).deco:k=='plate'?!!U(me).plate:0;return`<div class="item"><div class="pvw">${pvw(k)}</div><div class="im"><b>${v.n}</b><div class="pr">${v.p}</div><div class="mu" style="margin-bottom:12px">${v.d}</div>${own?(k=='bundle'?'<button class="g" disabled>Owned</button>':`<button class="${eqd?'g':''}" onclick="eq('${k}')">${eqd?'Unequip':'Equip'}</button>`):`<button onclick="buyModal('${k}')">Buy with BTC</button>`}</div></div>`}).join('')}</div>`;
const eq=k=>{const x=U(me);if(k=='crows')x.deco=x.deco?'':'crows';else x.plate=x.plate?0:1;save();render();settings()};
const memoMain=()=>hasMemo(me)?`<div class="ac"><b>Memo is active</b><span class="mu">Banners, animated avatars and server emoji are unlocked.</span></div>`:`<div class="ac"><b>Get Memo</b><span class="mu">Unlock custom banners, animated profile pictures and server emoji.</span><button style="margin-top:12px" onclick="buyModal('memo')">Buy with BTC</button></div>`;
function buyModal(id){const it=SHOP[id];modal(`<h2>${it.n}</h2><p class="mu" style="margin-bottom:12px">${it.p?`Price: ${it.p}. Pay the BTC equivalent to the address below, then submit your transaction ID.`:'Send BTC to the address below, then submit your transaction ID.'}</p><label>BTC ADDRESS</label><input readonly value="${BTC}" onclick="this.select()"><button class="g" style="width:100%;margin-bottom:12px" onclick="navigator.clipboard?.writeText('${BTC}');toast('Address copied')">Copy address</button><label>TRANSACTION ID</label><input id="tx" placeholder="Paste your BTC transaction ID"><button style="width:100%" onclick="buyItem('${id}')">I have paid</button>`)}
async function buyItem(id){const t=$('#tx').value.trim();if(t.length<10)return toast('Enter your transaction ID');const{error}=await sb.from('orders').insert({username:me,txid:t,item:id});if(error)return toast(error.message);closeModal();await loadOrders();settings();toast('Order submitted')}
const ordersList=()=>{const l=orders.filter(o=>o.username==me);return l.length?`<hr style="margin:28px 0"><h2>Your orders</h2>${l.map(o=>`<div class="row"><div><b>${SHOP[o.item||'memo']?.n}</b><div class="mu">${o.status=='pending'?'Waiting for payment confirmation':'Key: '+esc(o.license_key||'')}</div></div><span class="sp"></span>${o.status=='approved'&&!(U(me).redeemed||[]).includes(o.id)?`<button onclick="redeem('${o.id}')">Redeem</button>`:o.status=='approved'?'<span class="mu">Redeemed</span>':''}</div>`).join('')}<button class="g" onclick="loadOrders().then(()=>settings())">Refresh</button>`:''};
function redeem(id){const o=orders.find(x=>x.id==id),x=U(me);if(!o||o.status!='approved'||(x.redeemed||[]).includes(id))return;x.redeemed=[...(x.redeemed||[]),id];const it=o.item||'memo';if(it=='memo')x.memo=1;else x.owned=[...new Set([...(x.owned||[]),...(it=='bundle'?['crows','plate']:[it])])];save();render();settings();toast('Redeemed')}

/* ===== chat ===== */
function chat(head,msgs,s,lock){const x=U(me),l=msgs.filter(m=>!x.blocked.includes(m.u));
return`<div class="top">${head}</div><div id="msgs" class="msgs">${l.map((m,i)=>`<div class="msg ${i==l.length-1&&Date.now()-m.ts<1500?'slide':''}"><span data-ctx="usr:${m.u}" onclick="prof('${m.u}')">${av(m.u,40)}</span><div><b style="color:${rc(s,m.u)}">${dn(m.u)}</b>${badges(m.u)} <span class="mu">${new Date(m.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span><div>${fmt(m.x,m.u,s)}</div></div></div>`).join('')||'<p class="mu" style="padding:8px 16px">This is the start of the conversation.</p>'}</div><div class="inw"><input id="inp" autocomplete="off" ${lock?'disabled':''} placeholder="${lock||'Message'}"></div>`}
function send(t){if(t[0]=='!')return cmd(t);const m={u:me,x:t.slice(0,2000),ts:Date.now()};
if(view.t=='srv'){const s=db.servers[view.id];if(s.timeouts[me]>Date.now()||!s.members.includes(me))return;s.msgs.push(m);s.msgs=s.msgs.slice(-300)}
else{const o=view.id;if(U(me).blocked.includes(o)||U(o).blocked.includes(me))return;const k=[me,o].sort().join('|');(db.dms[k]=db.dms[k]||[]).push(m);db.dms[k]=db.dms[k].slice(-300)}
save();render()}
const setStatus=v=>{U(me).status=v;save();render()};
const userMenu=e=>menu(e,[...Object.entries(ST).map(([k,v])=>({l:`<i class="sd" style="background:${v[1]}"></i>${v[0]}`,f:()=>setStatus(k)})),'-',{l:'Edit profile',f:()=>settings('profile')},{l:'Log out',d:1,f:logout}]);

let rq=0;function render(){if(rq)return;rq=1;requestAnimationFrame(()=>{rq=0;draw()})}
function draw(){if(!me||!U(me))return authView();
document.documentElement.style.setProperty('--br',U(me).accent||'#5865f2');document.documentElement.classList.toggle('rm',!!U(me).rm);
const iv=$('#inp')?.value,f=document.activeElement?.id=='inp';
if(view.t=='srv'){const s=db.servers[view.id];if(!s||!s.members.includes(me))view={t:'friends',tab:'online'}}
const x=U(me),s=db.servers[view.id];let m,side;
if(view.t=='srv'){m=chat(I('hash',22)+'<b>general</b>',s.msgs,s,s.timeouts[me]>Date.now()?'You are timed out':'');
side=`<div class="sh">${esc(s.name)}</div><div class="nav on">${I('hash')}general</div><div class="nav" onclick="invite('${view.id}')">${I('invite')}Invite people</div>${s.owner==me?`<div class="nav" onclick="roles('${view.id}')">${I('gear')}Roles</div><div class="nav" onclick="emojis('${view.id}')">${I('spark')}Emoji</div>`:''}`}
else{if(view.t=='dm'&&!U(view.id))view={t:'friends',tab:'online'};
if(view.t=='dm'){const o=view.id,k=[me,o].sort().join('|');m=chat(`${av(o,26)}<b>${dn(o)}</b>${badges(o)}`,db.dms[k]||[],null,x.blocked.includes(o)?'You blocked this user':U(o).blocked.includes(me)?'You cannot message this user':'')}else m=friendsView();
side=`<div class="nav ${view.t=='friends'?'on':''}" onclick="go({t:'friends',tab:'online'})">${I('friends')}Friends</div><div class="nav" onclick="settings('memo')">${I('spark')}Memo</div><div class="dmh">DIRECT MESSAGES</div>${x.friends.map(u=>`<div class="nav ${view.t=='dm'&&view.id==u?'on':''}" style="${pl(u)}" data-ctx="friend:${u}" onclick="dm('${u}')"><div class="avw">${av(u,32)}<i class="dot ${dot(u)}"></i></div>${dn(u)}</div>`).join('')}`}
const rail=`<div class="ri home ${view.t!='srv'?'on':''}" onclick="go({t:'friends',tab:'online'})" title="Home">${I('logo',28)}</div><div class="rs"></div>${Object.entries(db.servers).filter(([i,v])=>v.members.includes(me)).map(([i,v])=>`<div class="ri ${view.t=='srv'&&view.id==i?'on':''}" data-ctx="srv:${i}" onclick="go({t:'srv',id:'${i}'})" title="${esc(v.name)}">${v.icon?`<img src="${v.icon}">`:esc(v.name.slice(0,2))}</div>`).join('')}<div class="ri add" onclick="addServer()" title="Create or join a server">${I('plus',22)}</div>`;
const members=view.t=='srv'?`<aside class="mem"><div class="mu" style="padding:0 8px 8px">Members — ${s.members.length}</div>${s.members.map(u=>`<div class="mrow ${online(u)?'':'offl'}" style="${pl(u)}" data-ctx="mem:${u}" onclick="prof('${u}')"><div class="avw">${av(u,32)}<i class="dot ${dot(u)}"></i></div><span style="color:${rc(s,u)}">${dn(u)}${u==s.owner?`<span style="color:#f0b232;margin-left:4px;display:inline-flex;vertical-align:-3px">${I('crown',14)}</span>`:''}</span></div>`).join('')}</aside>`:'';
$('#root').innerHTML=`<div id="app" class="${nav?'go':''}"><nav class="rail">${rail}</nav><aside class="side">${side}</aside><main class="${nav?'fade':''}">${m}</main>${members}<div class="up"><div id="upb" onclick="userMenu(event)"><div class="avw">${av(me,36)}<i class="dot ${dot(me)}"></i></div><div style="min-width:0"><b>${dn(me)}</b><span class="mu">${ST[x.status||'online'][0]}</span></div></div><button class="ib" title="User settings" onclick="settings('profile')">${I('gear')}</button></div></div>`;
nav=0;
const i=$('#inp');if(i){if(iv)i.value=iv;if(f)i.focus();i.onkeydown=e=>{const t=i.value.trim();if(e.key=='Enter'&&t){i.value='';send(t)}};const g=$('#msgs');g.scrollTop=g.scrollHeight}
if($('#ab2')){$('#ab2').onclick=addFriend;$('#af').onkeydown=e=>{if(e.key=='Enter')addFriend()}}}

/* ===== settings ===== */
const T={profile:'My Profile',account:'Account',memo:'Memo',look:'Appearance'};
const tgRow=(l,d,k)=>`<div class="row"><div style="flex:1"><b>${l}</b><div class="mu">${d}</div></div><div class="tg ${U(me)[k]?'on':''}" onclick="U(me)['${k}']=!U(me)['${k}'];save();render();settings()"></div></div>`;
const memoBuy=()=>{const o=myOrder;if(!o)return`<p class="mu" style="margin-bottom:14px">Unlock custom banners and animated profile pictures. Send BTC to the address below, then submit your transaction ID. Your license key is generated once the owner confirms payment.</p><label>BTC ADDRESS</label><input readonly value="${BTC}" onclick="this.select()"><button class="g" onclick="navigator.clipboard?.writeText('${BTC}');toast('Address copied')">Copy address</button><hr><label>TRANSACTION ID</label><input id="tx" placeholder="Paste your BTC transaction ID"><button onclick="buyMemo()">I have paid</button>`;
return o.status=='pending'?`<div class="ac"><b>Payment pending</b><span class="mu">Order ${esc(o.id.slice(0,8))} is waiting for confirmation. Your key will appear here.</span></div><button class="g" style="margin-top:12px" onclick="loadOrders().then(()=>settings())">Refresh</button>`:`<label>YOUR LICENSE KEY</label><input readonly id="mk" value="${esc(o.license_key||'')}" onclick="this.select()"><button onclick="actMemo()">Activate Memo</button>`};
const ownerPanel=()=>`<hr style="margin:32px 0"><h2>Owner: pending orders</h2>${orders.filter(o=>o.status=='pending').map(o=>`<div class="row"><div style="min-width:0"><b>${esc(o.username)}</b> <span class="mu">— ${SHOP[o.item||'memo']?.n}</span><div class="mu" style="word-break:break-all">${esc(o.txid)}</div></div><span class="sp"></span><button onclick="approve('${o.id}')">Approve</button></div>`).join('')||'<p class="mu">No pending orders.</p>'}<button class="g" onclick="loadOrders().then(()=>settings())">Refresh</button>`;
const PG={
profile:()=>{const x=U(me),m=hasMemo(me);return`<div class="prof"><div class="pf"><label>DISPLAY NAME</label><input id="ed" maxlength="32" value="${esc(x.display)}"><label>PROFILE PICTURE ${m?'(GIFs animate)':''}</label><input id="ea" type="file" accept="image/*"><label>BANNER ${m?'':'(needs Memo)'}</label><input id="eb" type="file" accept="image/*" ${m?'':'disabled'}><label>ABOUT ME</label><input id="eo" maxlength="190" value="${esc(x.bio||'')}" placeholder="Tell people about yourself"><label>NOTE</label><input id="en" maxlength="60" value="${esc(x.note||'')}" placeholder="What have you been reading?"><button onclick="saveProfile()">Save changes</button></div><div class="pv">${card(me)}</div></div>`},
account:()=>`<h2>Change password</h2><label>CURRENT PASSWORD</label><input id="p0" type="password"><label>NEW PASSWORD</label><input id="p1" type="password"><button onclick="chgPw()">Update password</button><hr style="margin:32px 0"><h2>Delete account</h2><p class="mu" style="margin-bottom:10px">Removes your profile and any servers you own. Enter your password to confirm.</p><input id="dp" type="password"><button class="r" onclick="delAcct()">Delete account</button>`,
memo:()=>`<div class="tabs">${['memo','shop','bundles'].map(k=>`<span class="tab ${mt==k?'on':''}" onclick="mt='${k}';settings()">${k[0].toUpperCase()+k.slice(1)}</span>`).join('')}</div>`+(mt=='memo'?memoMain():shopGrid(mt))+ordersList()+(isAdmin?ownerPanel():''),
look:()=>{const a=U(me).accent||'#5865f2';return`<h2>Appearance</h2><b>Accent color</b><div class="row" style="gap:10px;margin:10px 0 18px">${['#5865f2','#eb459e','#23a55a','#f0b232','#f23f43','#00a8fc','#9b59b6'].map(c=>`<i class="sw" style="background:${c};width:32px;height:32px;cursor:pointer;outline:${a==c?'3px solid #fff':'none'}" onclick="U(me).accent='${c}';save();render();settings()"></i>`).join('')}</div>${tgRow('Reduce motion','Turns off animations and transitions.','rm')}<hr style="margin:28px 0"><h2>Beta features <span class="beta">BETA</span></h2>${tgRow('Developer mode','Right-click anyone to copy their User ID. App admins can type !ban userid in any chat, and server owners can type it in their own server.','beta')}`}};
function settings(p){if(p)sp=p;let o=$('.stg');if(!o){o=document.createElement('div');o.className='stg pop';document.body.append(o)}
o.innerHTML=`<div class="sn"><div class="sg">User Settings</div>${Object.entries(T).map(([k,v])=>`<div class="si ${sp==k?'on':''}" onclick="settings('${k}')">${v}${k=='memo'&&!hasMemo(me)?`<span class="nw">${I('spark',14)}</span>`:''}</div>`).join('')}<hr><div class="si dngt" onclick="logout()">Log out</div></div><div class="sr"><div class="srh"><b>${T[sp]}</b><button class="g" onclick="$('.stg').remove()">${I('x')}</button></div><div class="sbody"><div class="sin">${PG[sp]()}</div></div></div>`}
async function saveProfile(){const x=U(me),m=hasMemo(me),n=$('#ed').value.trim(),a=$('#ea').files[0],b=$('#eb').files[0];try{if(a)x.avatar=await img(a,128,m);if(b&&m)x.banner=await img(b,640,m)}catch{return toast('Image failed. Animated GIFs must be under 1.5 MB.')}if(n)x.display=n;x.note=$('#en').value.trim().slice(0,60);x.bio=$('#eo').value.trim().slice(0,190);save();render();settings();toast('Profile saved')}
async function buyMemo(){const t=$('#tx').value.trim();if(t.length<10)return toast('Enter your transaction ID');const{error}=await sb.from('orders').insert({username:me,txid:t});if(error)return toast(error.message);await loadOrders();settings();toast('Order submitted')}
async function approve(id){const h=crypto.randomUUID().replace(/-/g,'').slice(0,16).toUpperCase(),k='MEMO-'+h.match(/.{4}/g).join('-');const{error}=await sb.from('orders').update({status:'approved',license_key:k}).eq('id',id);if(error)return toast(error.message);await loadOrders();settings();toast('Approved. Key: '+k)}
const actMemo=()=>{if(myOrder&&myOrder.status=='approved'&&$('#mk').value.trim()===myOrder.license_key){U(me).memo=1;save();render();settings();toast('Memo activated')}else toast('Invalid license key')};
async function chgPw(){const ck=await sb.auth.signInWithPassword({email:em(me),password:$('#p0').value});if(ck.error)return toast('Current password is wrong');const n=$('#p1').value;if(n.length<6)return toast('New password needs at least 6 characters');const up=await sb.auth.updateUser({password:n});toast(up.error?up.error.message:'Password changed')}
async function delAcct(){const ck=await sb.auth.signInWithPassword({email:em(me),password:$('#dp').value});if(ck.error)return toast('Wrong password');const u=me;
for(const[id,v]of Object.entries(db.servers)){if(v.owner==u)delete db.servers[id];else{v.members=v.members.filter(m=>m!=u);delete v.mr[u];delete v.timeouts[u]}}
for(const o of Object.values(db.users)){o.friends=o.friends.filter(f=>f!=u);o.blocked=o.blocked.filter(f=>f!=u)}
delete db.users[u];await push();await sb.auth.signOut();chan?.unsubscribe();$('.stg')?.remove();me=null;ready=0;authView()}
boot();
</script></body></html>
